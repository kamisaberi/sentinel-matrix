sensor_id: s147_radon_gas_scintillation_pulse_chamber
name: Radon Gas Scintillation Pulse Chamber
domain_id: 21
domain_title: Extreme Geological, Seismic & Borehole Telemetry Sensors
category: GEOLOGICAL
target_protocol: MODBUS_TCP
default_port: 15147
interface: Lucas Cell Radiation Counter
description: 'Radon Gas Scintillation Pulse Chamber is a specialized Domain 21 (Extreme
  Geological, Seismic & Borehole Telemetry Sensors) cyber-physical monitoring sensor.
  Interfacing directly via Lucas Cell Radiation Counter, it is specifically engineered
  to mitigate and detect Subsurface fault micro-cracking, radioactive mine shaft ventilation
  failure. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Alpha decay pulses from ^{222}Rn; concentration doubling within 24 hours
  flags active subterranean geological fault movement.. Any divergence between commanded
  network state and this physical reading triggers sub-microsecond in-kernel eBPF
  packet mitigation.'
target_threat: Subsurface fault micro-cracking, radioactive mine shaft ventilation
  failure
core_invariant: Alpha decay pulses from ^{222}Rn; concentration doubling within 24
  hours flags active subterranean geological fault movement.
physics:
  engine: seismic_geophone
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: mm/s
registers:
  holding_registers:
    40431:
      name: s147_radon_gas_scintillation_pulse_chamber_pv
      type: float32
      scale: 1.0
      unit: mm/s
    40433:
      name: s147_radon_gas_scintillation_pulse_chamber_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s147_radon_gas_scintillation_pulse_chamber_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Subsurface fault micro-cracking, radioactive mine
    shaft ventilation failure'
