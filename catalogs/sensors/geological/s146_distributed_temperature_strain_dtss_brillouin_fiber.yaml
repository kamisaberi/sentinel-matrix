sensor_id: s146_distributed_temperature_strain_dtss_brillouin_fiber
name: Distributed Temperature & Strain (DTSS) Brillouin Fiber
domain_id: 21
domain_title: Extreme Geological, Seismic & Borehole Telemetry Sensors
category: GEOLOGICAL
target_protocol: MODBUS_TCP
default_port: 15146
interface: BOTDA Optical Interrogator (Idea 101)
description: "Distributed Temperature & Strain (DTSS) Brillouin Fiber is a specialized\
  \ Domain 21 (Extreme Geological, Seismic & Borehole Telemetry Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via BOTDA Optical Interrogator (Idea 101),\
  \ it is specifically engineered to mitigate and detect Trans-continental pipeline\
  \ ground movement, active tectonic shear. In the Aryorithm edge architecture, it\
  \ continuously asserts the operational invariant: Measures local Brillouin frequency\
  \ shift \u0394 \\nu_B(z) = C_\\epsilon \\epsilon(z) + C_T T(z); strain \\epsilon\
  \ > 0.4\\% flags pipeline buckling hazard.. Any divergence between commanded network\
  \ state and this physical reading triggers sub-microsecond in-kernel eBPF packet\
  \ mitigation."
target_threat: Trans-continental pipeline ground movement, active tectonic shear
core_invariant: "Measures local Brillouin frequency shift \u0394 \\nu_B(z) = C_\\\
  epsilon \\epsilon(z) + C_T T(z); strain \\epsilon > 0.4\\% flags pipeline buckling\
  \ hazard."
physics:
  engine: seismic_geophone
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: mm/s
registers:
  holding_registers:
    40421:
      name: s146_distributed_temperature_strain_dtss_brillouin_fiber_pv
      type: float32
      scale: 1.0
      unit: mm/s
    40423:
      name: s146_distributed_temperature_strain_dtss_brillouin_fiber_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s146_distributed_temperature_strain_dtss_brillouin_fiber_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Trans-continental pipeline ground movement, active
    tectonic shear'
