sensor_id: s283_cabin_acoustic_sound_pressure_level_spl_dosimeter
name: Cabin Acoustic Sound Pressure Level (SPL) Dosimeter
domain_id: 40
domain_title: Spacecraft Life Support (ECLSS) & Cabin Ecology Sensors
category: AVIONICS
target_protocol: MODBUS_TCP
default_port: 15283
interface: Calibrated Precision Microphone Array
description: 'Cabin Acoustic Sound Pressure Level (SPL) Dosimeter is a specialized
  Domain 40 (Spacecraft Life Support (ECLSS) & Cabin Ecology Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Calibrated Precision Microphone Array,
  it is specifically engineered to mitigate and detect Ventilation fan acoustic resonance,
  crew sleep deprivation sabotage. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Continuous A-weighted sound exposure: L_{Aeq}
  <= 60\,dBA (NASA flight limit); acoustic spikes throttle fan VFD speeds.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Ventilation fan acoustic resonance, crew sleep deprivation sabotage
core_invariant: 'Continuous A-weighted sound exposure: L_{Aeq} <= 60\,dBA (NASA flight
  limit); acoustic spikes throttle fan VFD speeds.'
physics:
  engine: avionics_pitot
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: knots
registers:
  holding_registers:
    40211:
      name: s283_cabin_acoustic_sound_pressure_level_spl_dosimeter_pv
      type: float32
      scale: 1.0
      unit: knots
    40213:
      name: s283_cabin_acoustic_sound_pressure_level_spl_dosimeter_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s283_cabin_acoustic_sound_pressure_level_spl_dosimeter_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Ventilation fan acoustic resonance, crew sleep deprivation
    sabotage'
