sensor_id: s203_microchannel_plate_mcp_auroral_vuv_imager
name: Microchannel Plate (MCP) Auroral VUV Imager
domain_id: 29
domain_title: Spacecraft Ionizing Radiation, Solar Wind & Magnetospheric Sensors
category: AVIONICS
target_protocol: MODBUS_TCP
default_port: 15203
interface: CsI Photocathode (130--180 nm)
description: 'Microchannel Plate (MCP) Auroral VUV Imager is a specialized Domain
  29 (Spacecraft Ionizing Radiation, Solar Wind & Magnetospheric Sensors) cyber-physical
  monitoring sensor. Interfacing directly via CsI Photocathode (130--180 nm), it is
  specifically engineered to mitigate and detect Ionospheric scintillation events,
  satellite GPS communication blackouts. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Counts Lyman-Birge-Hopfield (LBH) nitrogen auroral
  emission photons; detects ionospheric plasma bubbles causing RF link fade.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Ionospheric scintillation events, satellite GPS communication blackouts
core_invariant: Counts Lyman-Birge-Hopfield (LBH) nitrogen auroral emission photons;
  detects ionospheric plasma bubbles causing RF link fade.
physics:
  engine: avionics_pitot
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: knots
registers:
  holding_registers:
    40451:
      name: s203_microchannel_plate_mcp_auroral_vuv_imager_pv
      type: float32
      scale: 1.0
      unit: knots
    40453:
      name: s203_microchannel_plate_mcp_auroral_vuv_imager_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s203_microchannel_plate_mcp_auroral_vuv_imager_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Ionospheric scintillation events, satellite GPS communication
    blackouts'
