sensor_id: s279_ndir_carbon_dioxide_co_2_scrubber_saturation_sentry
name: NDIR Carbon Dioxide (CO_2) Scrubber Saturation Sentry
domain_id: 40
domain_title: Spacecraft Life Support (ECLSS) & Cabin Ecology Sensors
category: AVIONICS
target_protocol: MODBUS_TCP
default_port: 15279
interface: "Dual-Beam Infrared Sensor (4.26\\,\xB5m)"
description: "NDIR Carbon Dioxide (CO_2) Scrubber Saturation Sentry is a specialized\
  \ Domain 40 (Spacecraft Life Support (ECLSS) & Cabin Ecology Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Dual-Beam Infrared Sensor (4.26\\\
  ,\xB5m), it is specifically engineered to mitigate and detect Amine scrubber bed\
  \ failure, astronaut hypercapnia / CO2 narcosis. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Cabin carbon dioxide partial\
  \ pressure: P_{CO_2} <= 0.40\\,kPa; exceeding threshold switches regenerative amine\
  \ beds.. Any divergence between commanded network state and this physical reading\
  \ triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Amine scrubber bed failure, astronaut hypercapnia / CO2 narcosis
core_invariant: 'Cabin carbon dioxide partial pressure: P_{CO_2} <= 0.40\,kPa; exceeding
  threshold switches regenerative amine beds.'
physics:
  engine: avionics_pitot
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: knots
registers:
  holding_registers:
    40171:
      name: s279_ndir_carbon_dioxide_co_2_scrubber_saturation_sentry_pv
      type: float32
      scale: 1.0
      unit: knots
    40173:
      name: s279_ndir_carbon_dioxide_co_2_scrubber_saturation_sentry_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s279_ndir_carbon_dioxide_co_2_scrubber_saturation_sentry_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Amine scrubber bed failure, astronaut hypercapnia
    / CO2 narcosis'
