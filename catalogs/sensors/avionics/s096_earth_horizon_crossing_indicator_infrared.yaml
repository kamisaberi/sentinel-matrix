sensor_id: s096_earth_horizon_crossing_indicator_infrared
name: Earth Horizon Crossing Indicator (Infrared)
domain_id: 14
domain_title: Aerospace, Avionics & Spacecraft Physical Sensors
category: AVIONICS
target_protocol: MODBUS_TCP
default_port: 15096
interface: Bolometer Scanner (SpaceWire)
description: "Earth Horizon Crossing Indicator (Infrared) is a specialized Domain\
  \ 14 (Aerospace, Avionics & Spacecraft Physical Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via Bolometer Scanner (SpaceWire), it is specifically\
  \ engineered to mitigate and detect Satellite nadir-pointing loss, gyroless attitude\
  \ deception. In the Aryorithm edge architecture, it continuously asserts the operational\
  \ invariant: Senses the 14--16\\,\xB5m atmospheric carbon dioxide layer to lock\
  \ satellite Z-axis directly to the center of the Earth.. Any divergence between\
  \ commanded network state and this physical reading triggers sub-microsecond in-kernel\
  \ eBPF packet mitigation."
target_threat: Satellite nadir-pointing loss, gyroless attitude deception
core_invariant: "Senses the 14--16\\,\xB5m atmospheric carbon dioxide layer to lock\
  \ satellite Z-axis directly to the center of the Earth."
physics:
  engine: avionics_pitot
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: knots
registers:
  holding_registers:
    40441:
      name: s096_earth_horizon_crossing_indicator_infrared_pv
      type: float32
      scale: 1.0
      unit: knots
    40443:
      name: s096_earth_horizon_crossing_indicator_infrared_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s096_earth_horizon_crossing_indicator_infrared_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Satellite nadir-pointing loss, gyroless attitude
    deception'
