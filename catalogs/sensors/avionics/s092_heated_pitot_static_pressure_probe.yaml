sensor_id: s092_heated_pitot_static_pressure_probe
name: Heated Pitot-Static Pressure Probe
domain_id: 14
domain_title: Aerospace, Avionics & Spacecraft Physical Sensors
category: AVIONICS
target_protocol: MODBUS_TCP
default_port: 15092
interface: ARINC 429 Air Data Computer
description: 'Heated Pitot-Static Pressure Probe is a specialized Domain 14 (Aerospace,
  Avionics & Spacecraft Physical Sensors) cyber-physical monitoring sensor. Interfacing
  directly via ARINC 429 Air Data Computer, it is specifically engineered to mitigate
  and detect Airspeed falsification, pitot-tube heater sabotage (AF447 disaster).
  In the Aryorithm edge architecture, it continuously asserts the operational invariant:
  Dynamic pressure q = \frac{1}{2}\rho v^2; airspeed must strictly correlate with
  GPS groundspeed, wind vectors, and engine thrust settings.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Airspeed falsification, pitot-tube heater sabotage (AF447 disaster)
core_invariant: Dynamic pressure q = \frac{1}{2}\rho v^2; airspeed must strictly correlate
  with GPS groundspeed, wind vectors, and engine thrust settings.
physics:
  engine: avionics_pitot
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: knots
registers:
  holding_registers:
    40411:
      name: s092_heated_pitot_static_pressure_probe_pv
      type: float32
      scale: 1.0
      unit: knots
    40413:
      name: s092_heated_pitot_static_pressure_probe_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s092_heated_pitot_static_pressure_probe_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Airspeed falsification, pitot-tube heater sabotage
    (AF447 disaster)'
