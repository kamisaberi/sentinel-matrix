sensor_id: s095_coarse_sun_sensor_css_photodiode_array
name: Coarse Sun Sensor (CSS) Photodiode Array
domain_id: 14
domain_title: Aerospace, Avionics & Spacecraft Physical Sensors
category: AVIONICS
target_protocol: MODBUS_TCP
default_port: 15095
interface: Analog SpaceWire Sensor
description: 'Coarse Sun Sensor (CSS) Photodiode Array is a specialized Domain 14
  (Aerospace, Avionics & Spacecraft Physical Sensors) cyber-physical monitoring sensor.
  Interfacing directly via Analog SpaceWire Sensor, it is specifically engineered
  to mitigate and detect Spacecraft tumbling, loss of sun-pointing attitude. In the
  Aryorithm edge architecture, it continuously asserts the operational invariant:
  Computes solar vector \mathbf{S}_{body} = [s_x, s_y, s_z]^T; triggers emergency
  thruster despin if solar panels lose illumination.. Any divergence between commanded
  network state and this physical reading triggers sub-microsecond in-kernel eBPF
  packet mitigation.'
target_threat: Spacecraft tumbling, loss of sun-pointing attitude
core_invariant: Computes solar vector \mathbf{S}_{body} = [s_x, s_y, s_z]^T; triggers
  emergency thruster despin if solar panels lose illumination.
physics:
  engine: avionics_pitot
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: knots
registers:
  holding_registers:
    40431:
      name: s095_coarse_sun_sensor_css_photodiode_array_pv
      type: float32
      scale: 1.0
      unit: knots
    40433:
      name: s095_coarse_sun_sensor_css_photodiode_array_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s095_coarse_sun_sensor_css_photodiode_array_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Spacecraft tumbling, loss of sun-pointing attitude'
