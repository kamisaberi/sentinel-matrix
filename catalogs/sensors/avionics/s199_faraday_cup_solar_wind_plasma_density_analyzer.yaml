sensor_id: s199_faraday_cup_solar_wind_plasma_density_analyzer
name: Faraday Cup Solar Wind Plasma Density Analyzer
domain_id: 29
domain_title: Spacecraft Ionizing Radiation, Solar Wind & Magnetospheric Sensors
category: AVIONICS
target_protocol: MODBUS_TCP
default_port: 15199
interface: Dual-Grid Electrostatic Collector
description: 'Faraday Cup Solar Wind Plasma Density Analyzer is a specialized Domain
  29 (Spacecraft Ionizing Radiation, Solar Wind & Magnetospheric Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Dual-Grid Electrostatic Collector, it
  is specifically engineered to mitigate and detect Coronal Mass Ejection (CME) shockwaves,
  solar wind density spikes. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: Current collector plate charge: I = q \cdot n_i \cdot
  v_{sw} \cdot A; solar wind proton density surge (> 50\,protons/cm^3) triggers payload
  safe-mode.. Any divergence between commanded network state and this physical reading
  triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Coronal Mass Ejection (CME) shockwaves, solar wind density spikes
core_invariant: 'Current collector plate charge: I = q \cdot n_i \cdot v_{sw} \cdot
  A; solar wind proton density surge (> 50\,protons/cm^3) triggers payload safe-mode.'
physics:
  engine: avionics_pitot
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: knots
registers:
  holding_registers:
    40421:
      name: s199_faraday_cup_solar_wind_plasma_density_analyzer_pv
      type: float32
      scale: 1.0
      unit: knots
    40423:
      name: s199_faraday_cup_solar_wind_plasma_density_analyzer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s199_faraday_cup_solar_wind_plasma_density_analyzer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Coronal Mass Ejection (CME) shockwaves, solar wind
    density spikes'
