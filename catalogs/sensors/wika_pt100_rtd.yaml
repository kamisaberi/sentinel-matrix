sensor_id: "wika_pt100_rtd"
vendor: "WIKA"
model: "TR10-C Industrial RTD"
category: "TEMPERATURE"
target_protocol: "MODBUS_TCP"
default_port: 15504
physics:
  engine: "thermal_lag_ode"
  baseline_value: 68.5
  min_value: -50.0
  max_value: 400.0
  noise_sigma: 0.15
registers:
  holding_registers:
    40030: { name: "temperature_c", type: "float32", scale: 1.0, unit: "C" }
fault_hooks:
  - id: "thermal_runaway"
    action: "linear_ramp"
    rate_per_sec: 4.2