sensor_id: s351_bucket_tooth_load_pin_shear_force_transducer
name: Bucket Tooth Load Pin Shear Force Transducer
domain_id: 50
domain_title: Autonomous Heavy Earthmoving & Excavator Kinematic Sensors
category: KINEMATIC
target_protocol: MODBUS_TCP
default_port: 15351
interface: Strain-Gauge Instrumented Pivot Pin
description: 'Bucket Tooth Load Pin Shear Force Transducer is a specialized Domain
  50 (Autonomous Heavy Earthmoving & Excavator Kinematic Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Strain-Gauge Instrumented Pivot Pin, it is specifically
  engineered to mitigate and detect Excessive breakout force, bucket tooth fracture
  on granite bedrock. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: Measured digging force: F_{digging} = \sqrt{F_x^2 + F_y^2}
  <= F_{structural\_limit}; forces stick cylinder relief before tooth breakage.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Excessive breakout force, bucket tooth fracture on granite bedrock
core_invariant: 'Measured digging force: F_{digging} = \sqrt{F_x^2 + F_y^2} <= F_{structural\_limit};
  forces stick cylinder relief before tooth breakage.'
physics:
  engine: kinematic_encoder
  baseline_value: 0.0
  min_value: -180.0
  max_value: 180.0
  noise_sigma: 0.02
  unit: mm
registers:
  holding_registers:
    40351:
      name: s351_bucket_tooth_load_pin_shear_force_transducer_pv
      type: float32
      scale: 1.0
      unit: mm
    40353:
      name: s351_bucket_tooth_load_pin_shear_force_transducer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s351_bucket_tooth_load_pin_shear_force_transducer_fault
  action: step_increase
  value: 45.0
  description: 'Injects anomaly: Excessive breakout force, bucket tooth fracture on
    granite bedrock'
