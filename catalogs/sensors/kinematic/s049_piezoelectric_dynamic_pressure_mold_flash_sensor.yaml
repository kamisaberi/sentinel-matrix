sensor_id: s049_piezoelectric_dynamic_pressure_mold_flash_sensor
name: Piezoelectric Dynamic Pressure / Mold-Flash Sensor
domain_id: 8
domain_title: Mechanical, Displacement & Kinematic Sensors
category: KINEMATIC
target_protocol: MODBUS_TCP
default_port: 15049
interface: High-Charge In-Mold Transducer
description: "Piezoelectric Dynamic Pressure / Mold-Flash Sensor is a specialized\
  \ Domain 08 (Mechanical, Displacement & Kinematic Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via High-Charge In-Mold Transducer, it is specifically\
  \ engineered to mitigate and detect Injection molding mold-flash separation explosions.\
  \ In the Aryorithm edge architecture, it continuously asserts the operational invariant:\
  \ Cavity pressure integral \u2208t P dt <= F_{clamp\\_force} prevents die blowouts..\
  \ Any divergence between commanded network state and this physical reading triggers\
  \ sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Injection molding mold-flash separation explosions
core_invariant: "Cavity pressure integral \u2208t P dt <= F_{clamp\\_force} prevents\
  \ die blowouts."
physics:
  engine: kinematic_encoder
  baseline_value: 0.0
  min_value: -180.0
  max_value: 180.0
  noise_sigma: 0.02
  unit: mm
registers:
  holding_registers:
    40481:
      name: s049_piezoelectric_dynamic_pressure_mold_flash_sensor_pv
      type: float32
      scale: 1.0
      unit: mm
    40483:
      name: s049_piezoelectric_dynamic_pressure_mold_flash_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s049_piezoelectric_dynamic_pressure_mold_flash_sensor_fault
  action: step_increase
  value: 45.0
  description: 'Injects anomaly: Injection molding mold-flash separation explosions'
