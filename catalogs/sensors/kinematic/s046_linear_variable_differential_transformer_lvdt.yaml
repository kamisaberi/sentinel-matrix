sensor_id: s046_linear_variable_differential_transformer_lvdt
name: Linear Variable Differential Transformer (LVDT)
domain_id: 8
domain_title: Mechanical, Displacement & Kinematic Sensors
category: KINEMATIC
target_protocol: MODBUS_TCP
default_port: 15046
interface: High-Precision AC Signal Conditioner
description: 'Linear Variable Differential Transformer (LVDT) is a specialized Domain
  08 (Mechanical, Displacement & Kinematic Sensors) cyber-physical monitoring sensor.
  Interfacing directly via High-Precision AC Signal Conditioner, it is specifically
  engineered to mitigate and detect Nuclear control rod hang-up, turbine steam valve
  jam. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Rod drop acceleration \frac{d^2z}{dt^2} >= g - F_{drag}; slow drop triggers
  emergency boron dump.. Any divergence between commanded network state and this physical
  reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Nuclear control rod hang-up, turbine steam valve jam
core_invariant: Rod drop acceleration \frac{d^2z}{dt^2} >= g - F_{drag}; slow drop
  triggers emergency boron dump.
physics:
  engine: kinematic_encoder
  baseline_value: 0.0
  min_value: -180.0
  max_value: 180.0
  noise_sigma: 0.02
  unit: mm
registers:
  holding_registers:
    40451:
      name: s046_linear_variable_differential_transformer_lvdt_pv
      type: float32
      scale: 1.0
      unit: mm
    40453:
      name: s046_linear_variable_differential_transformer_lvdt_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s046_linear_variable_differential_transformer_lvdt_fault
  action: step_increase
  value: 45.0
  description: 'Injects anomaly: Nuclear control rod hang-up, turbine steam valve
    jam'
