sensor_id: s047_optical_rotary_shaft_encoder
name: Optical Rotary Shaft Encoder
domain_id: 8
domain_title: Mechanical, Displacement & Kinematic Sensors
category: KINEMATIC
target_protocol: MODBUS_TCP
default_port: 15047
interface: Quadrature ABZ High-Speed Counter
description: "Optical Rotary Shaft Encoder is a specialized Domain 08 (Mechanical,\
  \ Displacement & Kinematic Sensors) cyber-physical monitoring sensor. Interfacing\
  \ directly via Quadrature ABZ High-Speed Counter, it is specifically engineered\
  \ to mitigate and detect Conveyor belt jamming, motor slip, tachometer spoofing.\
  \ In the Aryorithm edge architecture, it continuously asserts the operational invariant:\
  \ Position vector must match motor drive frequency: \\theta(t) = \u2208t \\omega(t)\
  \ dt.. Any divergence between commanded network state and this physical reading\
  \ triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Conveyor belt jamming, motor slip, tachometer spoofing
core_invariant: "Position vector must match motor drive frequency: \\theta(t) = \u2208\
  t \\omega(t) dt."
physics:
  engine: kinematic_encoder
  baseline_value: 0.0
  min_value: -180.0
  max_value: 180.0
  noise_sigma: 0.02
  unit: mm
registers:
  holding_registers:
    40461:
      name: s047_optical_rotary_shaft_encoder_pv
      type: float32
      scale: 1.0
      unit: mm
    40463:
      name: s047_optical_rotary_shaft_encoder_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s047_optical_rotary_shaft_encoder_fault
  action: step_increase
  value: 45.0
  description: 'Injects anomaly: Conveyor belt jamming, motor slip, tachometer spoofing'
