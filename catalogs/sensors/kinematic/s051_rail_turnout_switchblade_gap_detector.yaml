sensor_id: s051_rail_turnout_switchblade_gap_detector
name: Rail Turnout Switchblade Gap Detector
domain_id: 8
domain_title: Mechanical, Displacement & Kinematic Sensors
category: KINEMATIC
target_protocol: MODBUS_TCP
default_port: 15051
interface: Inductive Proximity / LVDT Sensor
description: 'Rail Turnout Switchblade Gap Detector is a specialized Domain 08 (Mechanical,
  Displacement & Kinematic Sensors) cyber-physical monitoring sensor. Interfacing
  directly via Inductive Proximity / LVDT Sensor, it is specifically engineered to
  mitigate and detect Railway point machine switch splitting / derailment. In the
  Aryorithm edge architecture, it continuously asserts the operational invariant:
  Signal locked to RED if switchblade-to-stock-rail gap exceeds 2.0\,mm.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Railway point machine switch splitting / derailment
core_invariant: Signal locked to RED if switchblade-to-stock-rail gap exceeds 2.0\,mm.
physics:
  engine: kinematic_encoder
  baseline_value: 0.0
  min_value: -180.0
  max_value: 180.0
  noise_sigma: 0.02
  unit: mm
registers:
  holding_registers:
    40001:
      name: s051_rail_turnout_switchblade_gap_detector_pv
      type: float32
      scale: 1.0
      unit: mm
    40003:
      name: s051_rail_turnout_switchblade_gap_detector_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s051_rail_turnout_switchblade_gap_detector_fault
  action: step_increase
  value: 45.0
  description: 'Injects anomaly: Railway point machine switch splitting / derailment'
