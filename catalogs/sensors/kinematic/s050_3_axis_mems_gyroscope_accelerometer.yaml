sensor_id: s050_3_axis_mems_gyroscope_accelerometer
name: 3-Axis MEMS Gyroscope & Accelerometer
domain_id: 8
domain_title: Mechanical, Displacement & Kinematic Sensors
category: KINEMATIC
target_protocol: MODBUS_TCP
default_port: 15050
interface: High-Rate SPI Bus (100 kHz)
description: '3-Axis MEMS Gyroscope & Accelerometer is a specialized Domain 08 (Mechanical,
  Displacement & Kinematic Sensors) cyber-physical monitoring sensor. Interfacing
  directly via High-Rate SPI Bus (100 kHz), it is specifically engineered to mitigate
  and detect Drone acoustic resonance blinding, spoofed flight tilt. In the Aryorithm
  edge architecture, it continuously asserts the operational invariant: Sensor output
  decoupled if high-frequency noise spikes around the silicon resonance band.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Drone acoustic resonance blinding, spoofed flight tilt
core_invariant: Sensor output decoupled if high-frequency noise spikes around the
  silicon resonance band.
physics:
  engine: kinematic_encoder
  baseline_value: 0.0
  min_value: -180.0
  max_value: 180.0
  noise_sigma: 0.02
  unit: mm
registers:
  holding_registers:
    40491:
      name: s050_3_axis_mems_gyroscope_accelerometer_pv
      type: float32
      scale: 1.0
      unit: mm
    40493:
      name: s050_3_axis_mems_gyroscope_accelerometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s050_3_axis_mems_gyroscope_accelerometer_fault
  action: step_increase
  value: 45.0
  description: 'Injects anomaly: Drone acoustic resonance blinding, spoofed flight
    tilt'
