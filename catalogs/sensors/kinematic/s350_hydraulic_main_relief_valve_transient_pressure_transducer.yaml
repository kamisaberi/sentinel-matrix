sensor_id: s350_hydraulic_main_relief_valve_transient_pressure_transducer
name: Hydraulic Main Relief Valve Transient Pressure Transducer
domain_id: 50
domain_title: Autonomous Heavy Earthmoving & Excavator Kinematic Sensors
category: KINEMATIC
target_protocol: MODBUS_TCP
default_port: 15350
interface: Piezoresistive Transmitter (600\,bar)
description: 'Hydraulic Main Relief Valve Transient Pressure Transducer is a specialized
  Domain 50 (Autonomous Heavy Earthmoving & Excavator Kinematic Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Piezoresistive Transmitter (600\,bar),
  it is specifically engineered to mitigate and detect Hydraulic line pressure spike,
  excavator boom cylinder rupture. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Main relief pressure limit: P_{hyd} <= 350\,bar;
  pressure spike rate \frac{dP}{dt} > 5{,}000\,bar/s throttles hydraulic pump displacement
  in < 2\,ms.. Any divergence between commanded network state and this physical reading
  triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Hydraulic line pressure spike, excavator boom cylinder rupture
core_invariant: 'Main relief pressure limit: P_{hyd} <= 350\,bar; pressure spike rate
  \frac{dP}{dt} > 5{,}000\,bar/s throttles hydraulic pump displacement in < 2\,ms.'
physics:
  engine: kinematic_encoder
  baseline_value: 0.0
  min_value: -180.0
  max_value: 180.0
  noise_sigma: 0.02
  unit: mm
registers:
  holding_registers:
    40341:
      name: s350_hydraulic_main_relief_valve_transient_pressure_transducer_pv
      type: float32
      scale: 1.0
      unit: mm
    40343:
      name: s350_hydraulic_main_relief_valve_transient_pressure_transducer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s350_hydraulic_main_relief_valve_transient_pressure_transducer_fault
  action: step_increase
  value: 45.0
  description: 'Injects anomaly: Hydraulic line pressure spike, excavator boom cylinder
    rupture'
