sensor_id: s447_encapsulant_moisture_vapor_transmission_rate_mvtr_sensor
name: Encapsulant Moisture Vapor Transmission Rate (MVTR) Sensor
domain_id: 63
domain_title: Advanced Photovoltaic Perovskite-Silicon Tandem Fab & Degradation Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15447
interface: Thin-Film Calcium Electrical Resistance Gauge
description: "Encapsulant Moisture Vapor Transmission Rate (MVTR) Sensor is a specialized\
  \ Domain 63 (Advanced Photovoltaic Perovskite-Silicon Tandem Fab & Degradation Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via Thin-Film Calcium Electrical\
  \ Resistance Gauge, it is specifically engineered to mitigate and detect Barrier\
  \ foil micro-pinholes, perovskite water dissolution failure. In the Aryorithm edge\
  \ architecture, it continuously asserts the operational invariant: Calcium corrosion\
  \ resistance: \\frac{dR}{dt} \u221D MVTR; transmission rate must remain MVTR <=\
  \ 10^{-4}\\,g/(m^2\\cdotday).. Any divergence between commanded network state and\
  \ this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Barrier foil micro-pinholes, perovskite water dissolution failure
core_invariant: "Calcium corrosion resistance: \\frac{dR}{dt} \u221D MVTR; transmission\
  \ rate must remain MVTR <= 10^{-4}\\,g/(m^2\\cdotday)."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40211:
      name: s447_encapsulant_moisture_vapor_transmission_rate_mvtr_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40213:
      name: s447_encapsulant_moisture_vapor_transmission_rate_mvtr_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s447_encapsulant_moisture_vapor_transmission_rate_mvtr_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Barrier foil micro-pinholes, perovskite water dissolution
    failure'
