sensor_id: s480_vacuum_pressure_swing_adsorption_vpsa_gauge
name: Vacuum Pressure Swing Adsorption (VPSA) Gauge
domain_id: 68
domain_title: Carbon Dioxide Direct Air Capture (DAC) & Zeolite Adsorption Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15480
interface: Corrosion-Resistant Capacitance Manometer
description: 'Vacuum Pressure Swing Adsorption (VPSA) Gauge is a specialized Domain
  68 (Carbon Dioxide Direct Air Capture (DAC) & Zeolite Adsorption Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Corrosion-Resistant Capacitance Manometer,
  it is specifically engineered to mitigate and detect Vacuum desorption bypass, atmospheric
  air back-leakage. In the Aryorithm edge architecture, it continuously asserts the
  operational invariant: Vacuum level during desorption: P_{desorb} <= 150\,mbar;
  pressure rise indicates valve seat failure, halting evacuation.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Vacuum desorption bypass, atmospheric air back-leakage
core_invariant: 'Vacuum level during desorption: P_{desorb} <= 150\,mbar; pressure
  rise indicates valve seat failure, halting evacuation.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40041:
      name: s480_vacuum_pressure_swing_adsorption_vpsa_gauge_pv
      type: float32
      scale: 1.0
      unit: units
    40043:
      name: s480_vacuum_pressure_swing_adsorption_vpsa_gauge_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s480_vacuum_pressure_swing_adsorption_vpsa_gauge_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Vacuum desorption bypass, atmospheric air back-leakage'
