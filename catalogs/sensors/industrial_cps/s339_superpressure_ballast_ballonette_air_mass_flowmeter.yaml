sensor_id: s339_superpressure_ballast_ballonette_air_mass_flowmeter
name: Superpressure Ballast Ballonette Air Mass Flowmeter
domain_id: 48
domain_title: High-Altitude Pseudo-Satellite (HAPS) & Stratospheric Airship Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15339
interface: Thermal Mass Flow Sensor
description: 'Superpressure Ballast Ballonette Air Mass Flowmeter is a specialized
  Domain 48 (High-Altitude Pseudo-Satellite (HAPS) & Stratospheric Airship Sensors)
  cyber-physical monitoring sensor. Interfacing directly via Thermal Mass Flow Sensor,
  it is specifically engineered to mitigate and detect Airship altitude control failure,
  uncontrolled stratospheric descent. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Ballast air mass rate: \dot{m}_{air} = \rho_{air}
  A v; mass balance determines net airship buoyant lift force: F_{net} = B - mg..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Airship altitude control failure, uncontrolled stratospheric descent
core_invariant: 'Ballast air mass rate: \dot{m}_{air} = \rho_{air} A v; mass balance
  determines net airship buoyant lift force: F_{net} = B - mg.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40231:
      name: s339_superpressure_ballast_ballonette_air_mass_flowmeter_pv
      type: float32
      scale: 1.0
      unit: units
    40233:
      name: s339_superpressure_ballast_ballonette_air_mass_flowmeter_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s339_superpressure_ballast_ballonette_air_mass_flowmeter_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Airship altitude control failure, uncontrolled stratospheric
    descent'
