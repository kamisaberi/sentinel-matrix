sensor_id: s285_safety_laser_scanner_dual_ossd_field_monitor
name: Safety Laser Scanner Dual OSSD Field Monitor
domain_id: 41
domain_title: Autonomous Mobile Robot (AMR) & AGV Drivetrain Safety Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
