sensor_id: s487_seafloor_crawler_geotechnical_shear_sinkage_profiler
name: Seafloor Crawler Geotechnical Shear Sinkage Profiler
domain_id: 69
domain_title: Deep Sea Mining Crawler & Slurry Riser Lift Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15487
interface: Dual High-Frequency Sonic Profiler
description: 'Seafloor Crawler Geotechnical Shear Sinkage Profiler is a specialized
  Domain 69 (Deep Sea Mining Crawler & Slurry Riser Lift Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Dual High-Frequency Sonic Profiler, it is specifically
  engineered to mitigate and detect Crawler vehicle sinkage in abyssal pelagic clay,
  vehicle loss. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Track sinkage depth: z_{sink} <= z_{critical} = 150\,mm; excessive sinkage
  increases track contact area and redistributes vehicle weight.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Crawler vehicle sinkage in abyssal pelagic clay, vehicle loss
core_invariant: 'Track sinkage depth: z_{sink} <= z_{critical} = 150\,mm; excessive
  sinkage increases track contact area and redistributes vehicle weight.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40111:
      name: s487_seafloor_crawler_geotechnical_shear_sinkage_profiler_pv
      type: float32
      scale: 1.0
      unit: units
    40113:
      name: s487_seafloor_crawler_geotechnical_shear_sinkage_profiler_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s487_seafloor_crawler_geotechnical_shear_sinkage_profiler_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Crawler vehicle sinkage in abyssal pelagic clay,
    vehicle loss'
