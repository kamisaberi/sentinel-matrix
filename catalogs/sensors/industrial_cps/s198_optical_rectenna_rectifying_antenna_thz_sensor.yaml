description: 'Optical Rectenna (Rectifying Antenna) THz Sensor is a specialized Domain
  28 (Terahertz (THz) & Millimeter-Wave Concealed Threat Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Metal-Insulator-Metal (MIM) Nanodiode, it is specifically
  engineered to mitigate and detect Parasitic wireless electronic eavesdropping bugs,
  zero-power transmitters. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: Converts incident ambient THz/IR electromagnetic waves
  into DC voltage without battery power, alerting to nearby covert listening implants..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Parasitic wireless electronic eavesdropping bugs, zero-power transmitters
core_invariant: Converts incident ambient THz/IR electromagnetic waves into DC voltage
  without battery power, alerting to nearby covert listening implants.
