sensor_id: s405_gradient_coil_thermal_expansion_resistance_array
name: Gradient Coil Thermal Expansion Resistance Array
domain_id: 57
domain_title: Ultra-High Field (7T/11.7T) MRI Safety & Patient Protection Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15405
interface: Embedded PT100 Matrix in Resin Casting
description: 'Gradient Coil Thermal Expansion Resistance Array is a specialized Domain
  57 (Ultra-High Field (7T/11.7T) MRI Safety & Patient Protection Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Embedded PT100 Matrix in Resin Casting,
  it is specifically engineered to mitigate and detect Gradient coil overheating,
  epoxy delamination from eddy currents. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Coil internal temperature: T_{gradient} <= 75^\circC;
  cooling water flow loss halts diffusion tensor imaging sequences.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Gradient coil overheating, epoxy delamination from eddy currents
core_invariant: 'Coil internal temperature: T_{gradient} <= 75^\circC; cooling water
  flow loss halts diffusion tensor imaging sequences.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40311:
      name: s405_gradient_coil_thermal_expansion_resistance_array_pv
      type: float32
      scale: 1.0
      unit: units
    40313:
      name: s405_gradient_coil_thermal_expansion_resistance_array_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s405_gradient_coil_thermal_expansion_resistance_array_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Gradient coil overheating, epoxy delamination from
    eddy currents'
