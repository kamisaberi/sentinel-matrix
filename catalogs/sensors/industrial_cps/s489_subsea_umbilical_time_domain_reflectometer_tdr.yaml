sensor_id: s489_subsea_umbilical_time_domain_reflectometer_tdr
name: Subsea Umbilical Time-Domain Reflectometer (TDR)
domain_id: 69
domain_title: Deep Sea Mining Crawler & Slurry Riser Lift Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15489
interface: High-Voltage Pulsed Cable Analyzer
description: 'Subsea Umbilical Time-Domain Reflectometer (TDR) is a specialized Domain
  69 (Deep Sea Mining Crawler & Slurry Riser Lift Sensors) cyber-physical monitoring
  sensor. Interfacing directly via High-Voltage Pulsed Cable Analyzer, it is specifically
  engineered to mitigate and detect Umbilical armor severance, 10\,kV subsea cable
  short-circuit. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Senses reflected pulse impedance: Z_0 = \sqrt{L/C}; reflection step indicates
  water ingress, tripping surface circuit breakers in < 1.0\,ms.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Umbilical armor severance, 10\,kV subsea cable short-circuit
core_invariant: 'Senses reflected pulse impedance: Z_0 = \sqrt{L/C}; reflection step
  indicates water ingress, tripping surface circuit breakers in < 1.0\,ms.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40131:
      name: s489_subsea_umbilical_time_domain_reflectometer_tdr_pv
      type: float32
      scale: 1.0
      unit: units
    40133:
      name: s489_subsea_umbilical_time_domain_reflectometer_tdr_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s489_subsea_umbilical_time_domain_reflectometer_tdr_fault
