sensor_id: s403_5_gauss_magnetic_fringe_field_boundary_safety_barrier_hall_sensor
name: 5-Gauss Magnetic Fringe Field Boundary Safety Barrier Hall Sensor
domain_id: 57
domain_title: Ultra-High Field (7T/11.7T) MRI Safety & Patient Protection Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15403
interface: 3-Axis Precision Hall Sensor at Room Entry
description: '5-Gauss Magnetic Fringe Field Boundary Safety Barrier Hall Sensor is
  a specialized Domain 57 (Ultra-High Field (7T/11.7T) MRI Safety & Patient Protection
  Sensors) cyber-physical monitoring sensor. Interfacing directly via 3-Axis Precision
  Hall Sensor at Room Entry, it is specifically engineered to mitigate and detect
  Ferromagnetic object missile hazard (oxygen tanks, wheelchairs pulled to bore).
  In the Aryorithm edge architecture, it continuously asserts the operational invariant:
  Magnetic field threshold: B >= 0.5\,mT (5 Gauss boundary); ferromagnetic metal ingress
  sounds sirens and locks entry door.. Any divergence between commanded network state
  and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Ferromagnetic object missile hazard (oxygen tanks, wheelchairs pulled
  to bore)
core_invariant: 'Magnetic field threshold: B >= 0.5\,mT (5 Gauss boundary); ferromagnetic
  metal ingress sounds sirens and locks entry door.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40291:
      name: s403_5_gauss_magnetic_fringe_field_boundary_safety_barrier_hall_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40293:
      name: s403_5_gauss_magnetic_fringe_field_boundary_safety_barrier_hall_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s403_5_gauss_magnetic_fringe_field_boundary_safety_barrier_hall_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Ferromagnetic object missile hazard (oxygen tanks,
    wheelchairs pulled to bore)'
