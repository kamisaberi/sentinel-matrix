sensor_id: s562_deionized_water_feed_high_purity_resistivity_meter
name: Deionized Water Feed High-Purity Resistivity Meter
domain_id: 79
domain_title: Microgrid Renewable Water Electrolyzer (Alkaline & PEM) Hydrogen Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15562
interface: Coaxial Titanium Flow Cell (0.01 cell constant)
description: 'Deionized Water Feed High-Purity Resistivity Meter is a specialized
  Domain 79 (Microgrid Renewable Water Electrolyzer (Alkaline & PEM) Hydrogen Sensors)
  cyber-physical monitoring sensor. Interfacing directly via Coaxial Titanium Flow
  Cell (0.01 cell constant), it is specifically engineered to mitigate and detect
  Anion/cation bed exhaustion, catalyst poisoning from chlorine/iron. In the Aryorithm
  edge architecture, it continuously asserts the operational invariant: Feedwater
  electrical resistivity: \rho >= 18.2\,M\Omega\cdotcm; resistivity drop isolates
  feed to prevent membrane destruction.. Any divergence between commanded network
  state and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Anion/cation bed exhaustion, catalyst poisoning from chlorine/iron
core_invariant: 'Feedwater electrical resistivity: \rho >= 18.2\,M\Omega\cdotcm; resistivity
  drop isolates feed to prevent membrane destruction.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40301:
      name: s562_deionized_water_feed_high_purity_resistivity_meter_pv
      type: float32
      scale: 1.0
      unit: units
    40303:
      name: s562_deionized_water_feed_high_purity_resistivity_meter_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s562_deionized_water_feed_high_purity_resistivity_meter_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Anion/cation bed exhaustion, catalyst poisoning from
    chlorine/iron'
