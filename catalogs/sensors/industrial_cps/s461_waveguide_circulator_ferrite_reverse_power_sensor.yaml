sensor_id: s461_waveguide_circulator_ferrite_reverse_power_sensor
name: Waveguide Circulator Ferrite Reverse Power Sensor
domain_id: 65
domain_title: Directed-Energy Counter-Electronics (HPEM/HPM) Waveguide Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15461
interface: Hall Probe on Circulator Bias Magnet
description: 'Waveguide Circulator Ferrite Reverse Power Sensor is a specialized Domain
  65 (Directed-Energy Counter-Electronics (HPEM/HPM) Waveguide Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Hall Probe on Circulator Bias Magnet,
  it is specifically engineered to mitigate and detect Circulator permanent magnet
  demagnetization, reflected power burn. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Internal magnetic bias: B_0 >= B_{saturation};
  loss of magnetic bias isolates microwave source to prevent reverse power damage..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Circulator permanent magnet demagnetization, reflected power burn
core_invariant: 'Internal magnetic bias: B_0 >= B_{saturation}; loss of magnetic bias
  isolates microwave source to prevent reverse power damage.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40351:
      name: s461_waveguide_circulator_ferrite_reverse_power_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40353:
      name: s461_waveguide_circulator_ferrite_reverse_power_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s461_waveguide_circulator_ferrite_reverse_power_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Circulator permanent magnet demagnetization, reflected
    power burn'
