  \ asserts the operational invariant: Differential glove pressure decay: \u0394 P\
  \ <= 10\\,Pa/min at P = 1{,}000\\,Pa; leak detection locks filling line immediately..\
  \ Any divergence between commanded network state and this physical reading triggers\
  \ sub-microsecond in-kernel eBPF packet mitigation."
