sensor_id: s241_trackside_hot_wheel_detector_hwd_radiometric_pyrometer
name: Trackside Hot Wheel Detector (HWD) Radiometric Pyrometer
domain_id: 34
domain_title: Railway Signaling, Trackside Balise & Eurobalise PTC Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15241
interface: Multi-Zone Infrared Spot Pyrometer
description: 'Trackside Hot Wheel Detector (HWD) Radiometric Pyrometer is a specialized
  Domain 34 (Railway Signaling, Trackside Balise & Eurobalise PTC Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Multi-Zone Infrared Spot Pyrometer,
  it is specifically engineered to mitigate and detect Locked brake shoe, shattered
  railway wheel tread explosion. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Wheel tread temperature: T_{tread} <= 350^\circC;
  thermal peak indicates dragging mechanical brake shoe; forces train stop at next
  siding.. Any divergence between commanded network state and this physical reading
  triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Locked brake shoe, shattered railway wheel tread explosion
core_invariant: 'Wheel tread temperature: T_{tread} <= 350^\circC; thermal peak indicates
  dragging mechanical brake shoe; forces train stop at next siding.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40311:
      name: s241_trackside_hot_wheel_detector_hwd_radiometric_pyrometer_pv
      type: float32
      scale: 1.0
      unit: units
    40313:
      name: s241_trackside_hot_wheel_detector_hwd_radiometric_pyrometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s241_trackside_hot_wheel_detector_hwd_radiometric_pyrometer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Locked brake shoe, shattered railway wheel tread
    explosion'
