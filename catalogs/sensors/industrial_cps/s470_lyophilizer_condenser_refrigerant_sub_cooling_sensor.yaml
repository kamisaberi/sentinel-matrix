sensor_id: s470_lyophilizer_condenser_refrigerant_sub_cooling_sensor
name: Lyophilizer Condenser Refrigerant Sub-Cooling Sensor
domain_id: 66
domain_title: Pharmaceutical Sterile Aseptic Isolator & CIP Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15470
interface: Dual Pressure-Temperature Transmitter
description: 'Lyophilizer Condenser Refrigerant Sub-Cooling Sensor is a specialized
  Domain 66 (Pharmaceutical Sterile Aseptic Isolator & CIP Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Dual Pressure-Temperature Transmitter,
  it is specifically engineered to mitigate and detect Condenser refrigeration failure,
  sublimation vapor collapse. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Condenser temperature: T_{condenser} <= -75^\circC;
  temperature rise > -60^\circC aborts vial shelf heating to prevent product meltback..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Condenser refrigeration failure, sublimation vapor collapse
core_invariant: 'Condenser temperature: T_{condenser} <= -75^\circC; temperature rise
  > -60^\circC aborts vial shelf heating to prevent product meltback.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40441:
      name: s470_lyophilizer_condenser_refrigerant_sub_cooling_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40443:
      name: s470_lyophilizer_condenser_refrigerant_sub_cooling_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s470_lyophilizer_condenser_refrigerant_sub_cooling_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Condenser refrigeration failure, sublimation vapor
    collapse'
