sensor_id: s240_switch_machine_friction_clutch_torque_transducer
name: Switch Machine Friction Clutch Torque Transducer
domain_id: 34
domain_title: Railway Signaling, Trackside Balise & Eurobalise PTC Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15240
interface: Load-Cell on Drive Escapement Crank
description: "Switch Machine Friction Clutch Torque Transducer is a specialized Domain\
  \ 34 (Railway Signaling, Trackside Balise & Eurobalise PTC Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Load-Cell on Drive Escapement Crank,\
  \ it is specifically engineered to mitigate and detect Switch point stone jamming,\
  \ point motor mechanical burnout. In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Motor clutch slipping force: F_{clutch} = 5.5\\\
  ,kN \xB1 0.5\\,kN; force exceeding threshold cuts motor power in < 3.5\\,seconds\
  \ to prevent motor fire.. Any divergence between commanded network state and this\
  \ physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Switch point stone jamming, point motor mechanical burnout
core_invariant: "Motor clutch slipping force: F_{clutch} = 5.5\\,kN \xB1 0.5\\,kN;\
  \ force exceeding threshold cuts motor power in < 3.5\\,seconds to prevent motor\
  \ fire."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40301:
      name: s240_switch_machine_friction_clutch_torque_transducer_pv
      type: float32
      scale: 1.0
      unit: units
    40303:
      name: s240_switch_machine_friction_clutch_torque_transducer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s240_switch_machine_friction_clutch_torque_transducer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Switch point stone jamming, point motor mechanical
    burnout'
