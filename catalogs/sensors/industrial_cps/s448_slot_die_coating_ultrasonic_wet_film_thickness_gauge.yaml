sensor_id: s448_slot_die_coating_ultrasonic_wet_film_thickness_gauge
name: Slot-Die Coating Ultrasonic Wet Film Thickness Gauge
domain_id: 63
domain_title: Advanced Photovoltaic Perovskite-Silicon Tandem Fab & Degradation Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15448
interface: High-Frequency Acoustic Echo Probe
description: "Slot-Die Coating Ultrasonic Wet Film Thickness Gauge is a specialized\
  \ Domain 63 (Advanced Photovoltaic Perovskite-Silicon Tandem Fab & Degradation Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via High-Frequency Acoustic\
  \ Echo Probe, it is specifically engineered to mitigate and detect Coating thickness\
  \ non-uniformity, meniscus pinhole defects. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Wet film layer thickness: d_{wet}\
  \ = d_{target} \xB1 2.0\\%; meniscus instability commands immediate syringe pump\
  \ stroke trim.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Coating thickness non-uniformity, meniscus pinhole defects
core_invariant: "Wet film layer thickness: d_{wet} = d_{target} \xB1 2.0\\%; meniscus\
  \ instability commands immediate syringe pump stroke trim."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40221:
      name: s448_slot_die_coating_ultrasonic_wet_film_thickness_gauge_pv
      type: float32
      scale: 1.0
      unit: units
    40223:
      name: s448_slot_die_coating_ultrasonic_wet_film_thickness_gauge_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s448_slot_die_coating_ultrasonic_wet_film_thickness_gauge_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Coating thickness non-uniformity, meniscus pinhole
    defects'
