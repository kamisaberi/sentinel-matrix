sensor_id: s341_haps_propeller_blade_acoustic_tip_noise_sensor
name: HAPS Propeller Blade Acoustic Tip Noise Sensor
domain_id: 48
domain_title: High-Altitude Pseudo-Satellite (HAPS) & Stratospheric Airship Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15341
interface: Flush-Mounted Piezo Sensor
description: 'HAPS Propeller Blade Acoustic Tip Noise Sensor is a specialized Domain
  48 (High-Altitude Pseudo-Satellite (HAPS) & Stratospheric Airship Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Flush-Mounted Piezo Sensor, it is specifically
  engineered to mitigate and detect Propeller blade tip sonic shockwave, high-altitude
  efficiency drop. In the Aryorithm edge architecture, it continuously asserts the
  operational invariant: Propeller tip Mach number: M_{tip} = \frac{\sqrt{v_{flight}^2
  + (\omega R)^2}}{a(T)} <= 0.75; prevents transonic drag rise.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Propeller blade tip sonic shockwave, high-altitude efficiency drop
core_invariant: 'Propeller tip Mach number: M_{tip} = \frac{\sqrt{v_{flight}^2 + (\omega
  R)^2}}{a(T)} <= 0.75; prevents transonic drag rise.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40251:
      name: s341_haps_propeller_blade_acoustic_tip_noise_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40253:
      name: s341_haps_propeller_blade_acoustic_tip_noise_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s341_haps_propeller_blade_acoustic_tip_noise_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Propeller blade tip sonic shockwave, high-altitude
    efficiency drop'
