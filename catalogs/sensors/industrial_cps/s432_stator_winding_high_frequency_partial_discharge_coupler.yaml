sensor_id: s432_stator_winding_high_frequency_partial_discharge_coupler
name: Stator Winding High-Frequency Partial Discharge Coupler
domain_id: 61
domain_title: High-Speed Electric Vehicle (EV) Powertrain & Silicon Carbide (SiC)
  Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15432
interface: Capacitive Busbar Sensor (100 MHz)
description: 'Stator Winding High-Frequency Partial Discharge Coupler is a specialized
  Domain 61 (High-Speed Electric Vehicle (EV) Powertrain & Silicon Carbide (SiC) Sensors)
  cyber-physical monitoring sensor. Interfacing directly via Capacitive Busbar Sensor
  (100 MHz), it is specifically engineered to mitigate and detect High dV/dt inverter-induced
  motor turn-to-turn insulation breakdown. In the Aryorithm edge architecture, it
  continuously asserts the operational invariant: Detects high-frequency partial discharge
  charge pulses (q > 50\,pC) caused by steep switching edges (> 50\,V/ns).. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: High dV/dt inverter-induced motor turn-to-turn insulation breakdown
core_invariant: Detects high-frequency partial discharge charge pulses (q > 50\,pC)
  caused by steep switching edges (> 50\,V/ns).
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40061:
      name: s432_stator_winding_high_frequency_partial_discharge_coupler_pv
      type: float32
      scale: 1.0
      unit: units
    40063:
      name: s432_stator_winding_high_frequency_partial_discharge_coupler_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s432_stator_winding_high_frequency_partial_discharge_coupler_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: High dV/dt inverter-induced motor turn-to-turn insulation
    breakdown'
