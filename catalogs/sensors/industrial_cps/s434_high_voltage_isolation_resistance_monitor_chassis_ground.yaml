sensor_id: s434_high_voltage_isolation_resistance_monitor_chassis_ground
name: High-Voltage Isolation Resistance Monitor (Chassis Ground)
domain_id: 61
domain_title: High-Speed Electric Vehicle (EV) Powertrain & Silicon Carbide (SiC)
  Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15434
interface: Switched-Resistor Voltage Divider
description: 'High-Voltage Isolation Resistance Monitor (Chassis Ground) is a specialized
  Domain 61 (High-Speed Electric Vehicle (EV) Powertrain & Silicon Carbide (SiC) Sensors)
  cyber-physical monitoring sensor. Interfacing directly via Switched-Resistor Voltage
  Divider, it is specifically engineered to mitigate and detect Battery pack high-voltage
  ground fault, passenger electrocution hazard. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Isolation resistance: R_{iso}
  >= 500\,\Omega/V (ECE R100 standard); isolation drop below 100\,\Omega/V opens main
  contactors in < 100\,ms.. Any divergence between commanded network state and this
  physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Battery pack high-voltage ground fault, passenger electrocution hazard
core_invariant: 'Isolation resistance: R_{iso} >= 500\,\Omega/V (ECE R100 standard);
  isolation drop below 100\,\Omega/V opens main contactors in < 100\,ms.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40081:
      name: s434_high_voltage_isolation_resistance_monitor_chassis_ground_pv
      type: float32
      scale: 1.0
      unit: units
    40083:
      name: s434_high_voltage_isolation_resistance_monitor_chassis_ground_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s434_high_voltage_isolation_resistance_monitor_chassis_ground_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Battery pack high-voltage ground fault, passenger
    electrocution hazard'
