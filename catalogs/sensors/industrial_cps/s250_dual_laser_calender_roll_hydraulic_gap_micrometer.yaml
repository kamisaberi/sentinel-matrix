sensor_id: s250_dual_laser_calender_roll_hydraulic_gap_micrometer
name: Dual-Laser Calender Roll Hydraulic Gap Micrometer
domain_id: 36
domain_title: Battery Gigafactory Roll-to-Roll & Electrode Calendering Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15250
interface: Dual Confocal Chromatic Sensor (50 kHz)
description: "Dual-Laser Calender Roll Hydraulic Gap Micrometer is a specialized Domain\
  \ 36 (Battery Gigafactory Roll-to-Roll & Electrode Calendering Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Dual Confocal Chromatic Sensor (50\
  \ kHz), it is specifically engineered to mitigate and detect Calender roll gap tampering,\
  \ electrode over-densification / foil tear. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Roll nip gap: d_{nip} = d_{target}\
  \ \xB1 0.5\\,\xB5m; over-pressure crushes active cathode crystals, causing internal\
  \ battery shorts.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Calender roll gap tampering, electrode over-densification / foil tear
core_invariant: "Roll nip gap: d_{nip} = d_{target} \xB1 0.5\\,\xB5m; over-pressure\
  \ crushes active cathode crystals, causing internal battery shorts."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40401:
      name: s250_dual_laser_calender_roll_hydraulic_gap_micrometer_pv
      type: float32
      scale: 1.0
      unit: units
    40403:
      name: s250_dual_laser_calender_roll_hydraulic_gap_micrometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s250_dual_laser_calender_roll_hydraulic_gap_micrometer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Calender roll gap tampering, electrode over-densification
    / foil tear'
