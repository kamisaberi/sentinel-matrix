sensor_id: s396_straw_chopper_rotor_speed_inductive_centrifugal_sensor
name: Straw Chopper Rotor Speed Inductive Centrifugal Sensor
domain_id: 56
domain_title: Autonomous Agricultural Combine Harvester & Grain Loss Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15396
interface: Ferrous Target Proximity Pickup
description: 'Straw Chopper Rotor Speed Inductive Centrifugal Sensor is a specialized
  Domain 56 (Autonomous Agricultural Combine Harvester & Grain Loss Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Ferrous Target Proximity Pickup, it
  is specifically engineered to mitigate and detect Straw chopper belt slip, combustible
  dust accumulation and fire hazard. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Chopper speed: \omega_{chopper} >= 0.95 \cdot
  \omega_{nominal}; speed drop triggers automated belt tensioner and slows combine
  ground speed.. Any divergence between commanded network state and this physical
  reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Straw chopper belt slip, combustible dust accumulation and fire hazard
core_invariant: 'Chopper speed: \omega_{chopper} >= 0.95 \cdot \omega_{nominal}; speed
  drop triggers automated belt tensioner and slows combine ground speed.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40231:
      name: s396_straw_chopper_rotor_speed_inductive_centrifugal_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40233:
      name: s396_straw_chopper_rotor_speed_inductive_centrifugal_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s396_straw_chopper_rotor_speed_inductive_centrifugal_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Straw chopper belt slip, combustible dust accumulation
    and fire hazard'
