sensor_id: s215_structure_borne_acoustic_emission_ae_laser_keyhole_sensor
name: Structure-Borne Acoustic Emission (AE) Laser Keyhole Sensor
domain_id: 31
domain_title: Metal Additive Manufacturing (3D Printing) Melt-Pool Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15215
interface: Fiber-Coupled Piezoelectric Transducer
description: 'Structure-Borne Acoustic Emission (AE) Laser Keyhole Sensor is a specialized
  Domain 31 (Metal Additive Manufacturing (3D Printing) Melt-Pool Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Fiber-Coupled Piezoelectric Transducer,
  it is specifically engineered to mitigate and detect Hidden subterranean micro-cracks
  inside titanium printed components. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Detects acoustic shock pulses (100 kHz--1 MHz)
  generated by rapid vapor plume collapse; halts laser exposure to remediate voids..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Hidden subterranean micro-cracks inside titanium printed components
core_invariant: Detects acoustic shock pulses (100 kHz--1 MHz) generated by rapid
  vapor plume collapse; halts laser exposure to remediate voids.
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40061:
      name: s215_structure_borne_acoustic_emission_ae_laser_keyhole_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40063:
      name: s215_structure_borne_acoustic_emission_ae_laser_keyhole_sensor_status
