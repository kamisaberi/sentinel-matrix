sensor_id: s253_rotary_slitter_knife_ultrasonic_resonance_monitor
name: Rotary Slitter Knife Ultrasonic Resonance Monitor
domain_id: 36
domain_title: Battery Gigafactory Roll-to-Roll & Electrode Calendering Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
