sensor_id: s216_laser_profilometer_powder_bed_topography_scanner
name: Laser Profilometer Powder Bed Topography Scanner
domain_id: 31
domain_title: Metal Additive Manufacturing (3D Printing) Melt-Pool Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15216
interface: Blue Laser Line-Scan (405 nm)
description: "Laser Profilometer Powder Bed Topography Scanner is a specialized Domain\
  \ 31 (Metal Additive Manufacturing (3D Printing) Melt-Pool Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Blue Laser Line-Scan (405 nm), it\
  \ is specifically engineered to mitigate and detect Recoater blade mechanical collision,\
  \ powder streaking and uneven layer thickness. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: 2D height elevation map: Layer\
  \ thickness z_{powder}(x,y) = z_{nominal} \xB1 10\\,\xB5m; uneven spreading stops\
  \ the recoater carriage before collision.. Any divergence between commanded network\
  \ state and this physical reading triggers sub-microsecond in-kernel eBPF packet\
  \ mitigation."
target_threat: Recoater blade mechanical collision, powder streaking and uneven layer
  thickness
core_invariant: "2D height elevation map: Layer thickness z_{powder}(x,y) = z_{nominal}\
  \ \xB1 10\\,\xB5m; uneven spreading stops the recoater carriage before collision."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40071:
      name: s216_laser_profilometer_powder_bed_topography_scanner_pv
      type: float32
      scale: 1.0
      unit: units
    40073:
      name: s216_laser_profilometer_powder_bed_topography_scanner_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s216_laser_profilometer_powder_bed_topography_scanner_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Recoater blade mechanical collision, powder streaking
    and uneven layer thickness'
