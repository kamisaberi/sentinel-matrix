sensor_id: s502_3d_high_speed_lidar_gantry_clearance_profiler
name: 3D High-Speed LiDAR Gantry Clearance Profiler
domain_id: 71
domain_title: Autonomous Port Container Straddle Carrier & AGV Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15502
interface: 360-Degree Multi-Beam LiDAR Scanner
description: '3D High-Speed LiDAR Gantry Clearance Profiler is a specialized Domain
  71 (Autonomous Port Container Straddle Carrier & AGV Sensors) cyber-physical monitoring
  sensor. Interfacing directly via 360-Degree Multi-Beam LiDAR Scanner, it is specifically
  engineered to mitigate and detect Vehicle collision with container stacks, pedestrian
  intrusion. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Dynamic safety envelope: d_{clearance} >= v(t) \cdot t_{stop} + d_{margin};
  intrusion stops vehicle travel in < 1.5\,seconds.. Any divergence between commanded
  network state and this physical reading triggers sub-microsecond in-kernel eBPF
  packet mitigation.'
target_threat: Vehicle collision with container stacks, pedestrian intrusion
core_invariant: 'Dynamic safety envelope: d_{clearance} >= v(t) \cdot t_{stop} + d_{margin};
  intrusion stops vehicle travel in < 1.5\,seconds.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40251:
      name: s502_3d_high_speed_lidar_gantry_clearance_profiler_pv
      type: float32
      scale: 1.0
      unit: units
    40253:
      name: s502_3d_high_speed_lidar_gantry_clearance_profiler_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s502_3d_high_speed_lidar_gantry_clearance_profiler_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Vehicle collision with container stacks, pedestrian
    intrusion'
