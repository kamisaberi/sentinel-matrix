sensor_id: s556_hydrogen_in_oxygen_h_2_in_o_2_thermal_conductivity_analyzer
name: Hydrogen-in-Oxygen (H_2-in-O_2) Thermal Conductivity Analyzer
domain_id: 79
domain_title: Microgrid Renewable Water Electrolyzer (Alkaline & PEM) Hydrogen Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15556
interface: ATEX Zone 1 Dual-Channel Detector
description: 'Hydrogen-in-Oxygen (H_2-in-O_2) Thermal Conductivity Analyzer is a specialized
  Domain 79 (Microgrid Renewable Water Electrolyzer (Alkaline & PEM) Hydrogen Sensors)
  cyber-physical monitoring sensor. Interfacing directly via ATEX Zone 1 Dual-Channel
  Detector, it is specifically engineered to mitigate and detect Low-load membrane
  crossover, explosive gas mixture in oxygen vent. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Hydrogen concentration in oxygen:
  [H_2] <= 1.5\% (lower than 50\% of LEL); concentration > 2.0\% trips DC rectifier
  in < 200\,ms.. Any divergence between commanded network state and this physical
  reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Low-load membrane crossover, explosive gas mixture in oxygen vent
core_invariant: 'Hydrogen concentration in oxygen: [H_2] <= 1.5\% (lower than 50\%
  of LEL); concentration > 2.0\% trips DC rectifier in < 200\,ms.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40241:
      name: s556_hydrogen_in_oxygen_h_2_in_o_2_thermal_conductivity_analyzer_pv
      type: float32
      scale: 1.0
      unit: units
    40243:
      name: s556_hydrogen_in_oxygen_h_2_in_o_2_thermal_conductivity_analyzer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s556_hydrogen_in_oxygen_h_2_in_o_2_thermal_conductivity_analyzer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Low-load membrane crossover, explosive gas mixture
    in oxygen vent'
