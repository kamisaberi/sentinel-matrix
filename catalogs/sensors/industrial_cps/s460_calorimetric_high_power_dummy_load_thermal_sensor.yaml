sensor_id: s460_calorimetric_high_power_dummy_load_thermal_sensor
name: Calorimetric High-Power Dummy Load Thermal Sensor
domain_id: 65
domain_title: Directed-Energy Counter-Electronics (HPEM/HPM) Waveguide Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15460
interface: Platinum RTD Pair in Coolant Flow
description: 'Calorimetric High-Power Dummy Load Thermal Sensor is a specialized Domain
  65 (Directed-Energy Counter-Electronics (HPEM/HPM) Waveguide Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Platinum RTD Pair in Coolant Flow, it
  is specifically engineered to mitigate and detect Dummy load water cooling failure,
  RF absorber tile melting. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: Absorbed power: P = \dot{m} C_p (T_{out} - T_{in}); flow
  loss cuts microwave generator before ferrite tile vaporization.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Dummy load water cooling failure, RF absorber tile melting
core_invariant: 'Absorbed power: P = \dot{m} C_p (T_{out} - T_{in}); flow loss cuts
  microwave generator before ferrite tile vaporization.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40341:
      name: s460_calorimetric_high_power_dummy_load_thermal_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40343:
      name: s460_calorimetric_high_power_dummy_load_thermal_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s460_calorimetric_high_power_dummy_load_thermal_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Dummy load water cooling failure, RF absorber tile
    melting'
