sensor_id: s294_optical_ground_wire_opgw_distributed_fiber_strain_sentry
name: Optical Ground Wire (OPGW) Distributed Fiber Strain Sentry
domain_id: 42
domain_title: High-Tension Transmission Pylon & Dynamic Line Rating (DLR) Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15294
interface: BOTDA Interrogator on Pylon Fiber
description: 'Optical Ground Wire (OPGW) Distributed Fiber Strain Sentry is a specialized
  Domain 42 (High-Tension Transmission Pylon & Dynamic Line Rating (DLR) Sensors)
  cyber-physical monitoring sensor. Interfacing directly via BOTDA Interrogator on
  Pylon Fiber, it is specifically engineered to mitigate and detect Pylon foundation
  wash-out, tower tilt, transmission line vandalism. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Distributed strain along fiber
  core: \epsilon(z) <= 0.25\%; localized strain spike flags physical tower leaning
  or ice accumulation.. Any divergence between commanded network state and this physical
  reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Pylon foundation wash-out, tower tilt, transmission line vandalism
core_invariant: 'Distributed strain along fiber core: \epsilon(z) <= 0.25\%; localized
  strain spike flags physical tower leaning or ice accumulation.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40301:
      name: s294_optical_ground_wire_opgw_distributed_fiber_strain_sentry_pv
      type: float32
      scale: 1.0
      unit: units
    40303:
      name: s294_optical_ground_wire_opgw_distributed_fiber_strain_sentry_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s294_optical_ground_wire_opgw_distributed_fiber_strain_sentry_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Pylon foundation wash-out, tower tilt, transmission
    line vandalism'
