sensor_id: s402_patient_bed_pneumatic_squeeze_emergency_egress_sensor
name: Patient Bed Pneumatic Squeeze Emergency Egress Sensor
domain_id: 57
domain_title: Ultra-High Field (7T/11.7T) MRI Safety & Patient Protection Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15402
interface: Hermetic Air Bulb Pressure Switch
description: "Patient Bed Pneumatic Squeeze Emergency Egress Sensor is a specialized\
  \ Domain 57 (Ultra-High Field (7T/11.7T) MRI Safety & Patient Protection Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via Hermetic Air Bulb Pressure\
  \ Switch, it is specifically engineered to mitigate and detect Patient panic/cardiac\
  \ event during scan, entrapment inside bore. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Air pressure pulse: \u0394\
  \ P >= 50\\,mbar instantly aborts RF scanning sequence and powers the patient bed\
  \ table eject drive.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Patient panic/cardiac event during scan, entrapment inside bore
core_invariant: "Air pressure pulse: \u0394 P >= 50\\,mbar instantly aborts RF scanning\
  \ sequence and powers the patient bed table eject drive."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40281:
      name: s402_patient_bed_pneumatic_squeeze_emergency_egress_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40283:
      name: s402_patient_bed_pneumatic_squeeze_emergency_egress_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s402_patient_bed_pneumatic_squeeze_emergency_egress_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Patient panic/cardiac event during scan, entrapment
    inside bore'
