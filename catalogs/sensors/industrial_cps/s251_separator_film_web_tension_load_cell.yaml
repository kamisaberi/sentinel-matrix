sensor_id: s251_separator_film_web_tension_load_cell
name: Separator Film Web Tension Load Cell
domain_id: 36
domain_title: Battery Gigafactory Roll-to-Roll & Electrode Calendering Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15251
interface: Full-Bridge Piezoresistive Transducer
description: 'Separator Film Web Tension Load Cell is a specialized Domain 36 (Battery
  Gigafactory Roll-to-Roll & Electrode Calendering Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Full-Bridge Piezoresistive Transducer, it is specifically
  engineered to mitigate and detect Web break, polymer separator stretching and micro-pore
  collapse. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Dynamic web tension ODE: \frac{dT_{web}}{dt} = \frac{EA}{L}(v_2 - v_1)
  - \frac{v_1}{L}T_{web}; tension spikes trigger servo unwind dancer adjustments..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Web break, polymer separator stretching and micro-pore collapse
core_invariant: 'Dynamic web tension ODE: \frac{dT_{web}}{dt} = \frac{EA}{L}(v_2 -
  v_1) - \frac{v_1}{L}T_{web}; tension spikes trigger servo unwind dancer adjustments.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40411:
      name: s251_separator_film_web_tension_load_cell_pv
      type: float32
      scale: 1.0
      unit: units
    40413:
      name: s251_separator_film_web_tension_load_cell_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s251_separator_film_web_tension_load_cell_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Web break, polymer separator stretching and micro-pore
    collapse'
