sensor_id: s404_mri_cold_head_displacer_cryo_cooler_acoustic_rhythm_sensor
name: MRI Cold-Head Displacer Cryo-Cooler Acoustic Rhythm Sensor
domain_id: 57
domain_title: Ultra-High Field (7T/11.7T) MRI Safety & Patient Protection Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15404
interface: Piezoelectric Tap on Compressor Line
description: "MRI Cold-Head Displacer Cryo-Cooler Acoustic Rhythm Sensor is a specialized\
  \ Domain 57 (Ultra-High Field (7T/11.7T) MRI Safety & Patient Protection Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via Piezoelectric Tap on\
  \ Compressor Line, it is specifically engineered to mitigate and detect Gifford-McMahon\
  \ cryocooler valve seizure, progressive helium boil-off. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Cold-head piston frequency:\
  \ f = 2.0\\,Hz \xB1 0.05\\,Hz; rhythm deviation flags valve seal wear before helium\
  \ boiling occurs.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Gifford-McMahon cryocooler valve seizure, progressive helium boil-off
core_invariant: "Cold-head piston frequency: f = 2.0\\,Hz \xB1 0.05\\,Hz; rhythm deviation\
  \ flags valve seal wear before helium boiling occurs."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40301:
      name: s404_mri_cold_head_displacer_cryo_cooler_acoustic_rhythm_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40303:
      name: s404_mri_cold_head_displacer_cryo_cooler_acoustic_rhythm_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s404_mri_cold_head_displacer_cryo_cooler_acoustic_rhythm_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Gifford-McMahon cryocooler valve seizure, progressive
    helium boil-off'
