sensor_id: s218_recoater_blade_impact_strain_gauge
name: Recoater Blade Impact Strain Gauge
domain_id: 31
domain_title: Metal Additive Manufacturing (3D Printing) Melt-Pool Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15218
interface: Full-Bridge Piezoresistive Foil
description: 'Recoater Blade Impact Strain Gauge is a specialized Domain 31 (Metal
  Additive Manufacturing (3D Printing) Melt-Pool Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Full-Bridge Piezoresistive Foil, it is specifically
  engineered to mitigate and detect Protruding warped part collision, recoater motor
  gear stripping. In the Aryorithm edge architecture, it continuously asserts the
  operational invariant: Bending strain: \epsilon_{blade} <= \epsilon_{yield}; mechanical
  resistance force > 50\,N reverses recoater movement in < 2\,ms.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Protruding warped part collision, recoater motor gear stripping
core_invariant: 'Bending strain: \epsilon_{blade} <= \epsilon_{yield}; mechanical
  resistance force > 50\,N reverses recoater movement in < 2\,ms.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40091:
      name: s218_recoater_blade_impact_strain_gauge_pv
      type: float32
      scale: 1.0
      unit: units
    40093:
      name: s218_recoater_blade_impact_strain_gauge_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s218_recoater_blade_impact_strain_gauge_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Protruding warped part collision, recoater motor
    gear stripping'
