sensor_id: s305_thickener_rake_drive_torque_bed_level_transducer
name: Thickener Rake Drive Torque & Bed Level Transducer
domain_id: 43
domain_title: Mining Flotation & Mineral Beneficiation Process Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15305
interface: Hydraulic Pressure Cell + Sludge Interface Probe
description: 'Thickener Rake Drive Torque & Bed Level Transducer is a specialized
  Domain 43 (Mining Flotation & Mineral Beneficiation Process Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Hydraulic Pressure Cell + Sludge Interface
  Probe, it is specifically engineered to mitigate and detect Thickener bed compaction
  lock, rake arm snapping, tailings overflow. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Mechanical torque: \tau_{rake}
  <= \tau_{maximum}; torque rise auto-raises rake mechanism while increasing underflow
  pumping.. Any divergence between commanded network state and this physical reading
  triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Thickener bed compaction lock, rake arm snapping, tailings overflow
core_invariant: 'Mechanical torque: \tau_{rake} <= \tau_{maximum}; torque rise auto-raises
  rake mechanism while increasing underflow pumping.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40411:
      name: s305_thickener_rake_drive_torque_bed_level_transducer_pv
      type: float32
      scale: 1.0
      unit: units
    40413:
      name: s305_thickener_rake_drive_torque_bed_level_transducer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s305_thickener_rake_drive_torque_bed_level_transducer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Thickener bed compaction lock, rake arm snapping,
    tailings overflow'
