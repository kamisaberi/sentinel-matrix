sensor_id: s444_conductive_atomic_force_microscope_c_afm_cantilever
name: Conductive Atomic Force Microscope (C-AFM) Cantilever
domain_id: 63
domain_title: Advanced Photovoltaic Perovskite-Silicon Tandem Fab & Degradation Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15444
interface: Conductive Diamond-Coated Tip
description: 'Conductive Atomic Force Microscope (C-AFM) Cantilever is a specialized
  Domain 63 (Advanced Photovoltaic Perovskite-Silicon Tandem Fab & Degradation Sensors)
  cyber-physical monitoring sensor. Interfacing directly via Conductive Diamond-Coated
  Tip, it is specifically engineered to mitigate and detect Nanoscale pinhole shunts,
  local current leakage across perovskite films. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Local current map: I_{leak} <=
  100\,pA at reverse bias V = -1.0\,V; current spikes flag conductive pinhole shorts..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Nanoscale pinhole shunts, local current leakage across perovskite films
core_invariant: 'Local current map: I_{leak} <= 100\,pA at reverse bias V = -1.0\,V;
  current spikes flag conductive pinhole shorts.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40181:
      name: s444_conductive_atomic_force_microscope_c_afm_cantilever_pv
      type: float32
      scale: 1.0
      unit: units
    40183:
      name: s444_conductive_atomic_force_microscope_c_afm_cantilever_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s444_conductive_atomic_force_microscope_c_afm_cantilever_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Nanoscale pinhole shunts, local current leakage across
    perovskite films'
