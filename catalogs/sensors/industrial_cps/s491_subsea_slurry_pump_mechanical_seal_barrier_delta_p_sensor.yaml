sensor_id: s491_subsea_slurry_pump_mechanical_seal_barrier_delta_p_sensor
name: Subsea Slurry Pump Mechanical Seal Barrier Delta-P Sensor
domain_id: 69
domain_title: Deep Sea Mining Crawler & Slurry Riser Lift Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15491
interface: Differential Pressure Transmitter
description: "Subsea Slurry Pump Mechanical Seal Barrier Delta-P Sensor is a specialized\
  \ Domain 69 (Deep Sea Mining Crawler & Slurry Riser Lift Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Differential Pressure Transmitter,\
  \ it is specifically engineered to mitigate and detect Barrier fluid loss, abrasive\
  \ seabed sand ingress into motor bearings. In the Aryorithm edge architecture, it\
  \ continuously asserts the operational invariant: Barrier fluid overpressure: \u0394\
  \ P_{barrier} = P_{barrier} - P_{seawater} >= 2.5\\,bar; loss of differential pressure\
  \ trips motor.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Barrier fluid loss, abrasive seabed sand ingress into motor bearings
core_invariant: "Barrier fluid overpressure: \u0394 P_{barrier} = P_{barrier} - P_{seawater}\
  \ >= 2.5\\,bar; loss of differential pressure trips motor."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40151:
      name: s491_subsea_slurry_pump_mechanical_seal_barrier_delta_p_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40153:
      name: s491_subsea_slurry_pump_mechanical_seal_barrier_delta_p_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s491_subsea_slurry_pump_mechanical_seal_barrier_delta_p_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Barrier fluid loss, abrasive seabed sand ingress
    into motor bearings'
