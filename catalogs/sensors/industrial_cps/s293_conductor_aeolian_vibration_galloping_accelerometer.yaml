sensor_id: s293_conductor_aeolian_vibration_galloping_accelerometer
name: Conductor Aeolian Vibration & Galloping Accelerometer
domain_id: 42
domain_title: High-Tension Transmission Pylon & Dynamic Line Rating (DLR) Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15293
interface: High-G Triaxial MEMS Clamped to Wire
description: 'Conductor Aeolian Vibration & Galloping Accelerometer is a specialized
  Domain 42 (High-Tension Transmission Pylon & Dynamic Line Rating (DLR) Sensors)
  cyber-physical monitoring sensor. Interfacing directly via High-G Triaxial MEMS
  Clamped to Wire, it is specifically engineered to mitigate and detect Wind-induced
  sub-span oscillation, fatigue break of conductor strands. In the Aryorithm edge
  architecture, it continuously asserts the operational invariant: Vibration frequency
  and amplitude: f = 0.185 \frac{v_{wind}}{D}; galloping amplitude > 0.5\,m alerts
  to install dynamic dampers.. Any divergence between commanded network state and
  this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Wind-induced sub-span oscillation, fatigue break of conductor strands
core_invariant: 'Vibration frequency and amplitude: f = 0.185 \frac{v_{wind}}{D};
  galloping amplitude > 0.5\,m alerts to install dynamic dampers.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40291:
      name: s293_conductor_aeolian_vibration_galloping_accelerometer_pv
      type: float32
      scale: 1.0
      unit: units
    40293:
      name: s293_conductor_aeolian_vibration_galloping_accelerometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s293_conductor_aeolian_vibration_galloping_accelerometer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Wind-induced sub-span oscillation, fatigue break
    of conductor strands'
