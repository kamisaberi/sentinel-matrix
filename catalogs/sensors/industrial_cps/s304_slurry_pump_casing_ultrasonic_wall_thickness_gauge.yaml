sensor_id: s304_slurry_pump_casing_ultrasonic_wall_thickness_gauge
name: Slurry Pump Casing Ultrasonic Wall Thickness Gauge
domain_id: 43
domain_title: Mining Flotation & Mineral Beneficiation Process Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15304
interface: High-Temperature Clamp-On EMAT Probe
description: 'Slurry Pump Casing Ultrasonic Wall Thickness Gauge is a specialized
  Domain 43 (Mining Flotation & Mineral Beneficiation Process Sensors) cyber-physical
  monitoring sensor. Interfacing directly via High-Temperature Clamp-On EMAT Probe,
  it is specifically engineered to mitigate and detect Hydro-abrasive pump casing
  washout, pressurized toxic tailings spill. In the Aryorithm edge architecture, it
  continuously asserts the operational invariant: Casing residual thickness: d_{casing}
  >= d_{minimum} = 15.0\,mm; wear rate extrapolation predicts maintenance date.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Hydro-abrasive pump casing washout, pressurized toxic tailings spill
core_invariant: 'Casing residual thickness: d_{casing} >= d_{minimum} = 15.0\,mm;
  wear rate extrapolation predicts maintenance date.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40401:
      name: s304_slurry_pump_casing_ultrasonic_wall_thickness_gauge_pv
      type: float32
      scale: 1.0
      unit: units
    40403:
      name: s304_slurry_pump_casing_ultrasonic_wall_thickness_gauge_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s304_slurry_pump_casing_ultrasonic_wall_thickness_gauge_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Hydro-abrasive pump casing washout, pressurized toxic
    tailings spill'
