sensor_id: s468_peristaltic_vial_filling_pump_magnetostrictive_stroke_sensor
name: Peristaltic Vial Filling Pump Magnetostrictive Stroke Sensor
domain_id: 66
domain_title: Pharmaceutical Sterile Aseptic Isolator & CIP Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15468
interface: Linear Magnetostrictive Displacement
description: "Peristaltic Vial Filling Pump Magnetostrictive Stroke Sensor is a specialized\
  \ Domain 66 (Pharmaceutical Sterile Aseptic Isolator & CIP Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Linear Magnetostrictive Displacement,\
  \ it is specifically engineered to mitigate and detect Sub-microliter under-dosing\
  \ / over-dosing of critical oncology drugs. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Liquid dose displacement: V_{fill}\
  \ = A_{pump} \\cdot \u0394 x = V_{target} \xB1 0.5\\%; stroke deviation rejects\
  \ vial before capping.. Any divergence between commanded network state and this\
  \ physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Sub-microliter under-dosing / over-dosing of critical oncology drugs
core_invariant: "Liquid dose displacement: V_{fill} = A_{pump} \\cdot \u0394 x = V_{target}\
  \ \xB1 0.5\\%; stroke deviation rejects vial before capping."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40421:
      name: s468_peristaltic_vial_filling_pump_magnetostrictive_stroke_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40423:
      name: s468_peristaltic_vial_filling_pump_magnetostrictive_stroke_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s468_peristaltic_vial_filling_pump_magnetostrictive_stroke_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Sub-microliter under-dosing / over-dosing of critical
    oncology drugs'
