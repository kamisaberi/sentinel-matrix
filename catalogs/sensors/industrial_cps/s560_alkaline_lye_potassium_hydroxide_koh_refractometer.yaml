sensor_id: s560_alkaline_lye_potassium_hydroxide_koh_refractometer
name: Alkaline Lye Potassium Hydroxide (KOH) Refractometer
domain_id: 79
domain_title: Microgrid Renewable Water Electrolyzer (Alkaline & PEM) Hydrogen Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15560
interface: Critical Angle Optical Prism Sensor
description: "Alkaline Lye Potassium Hydroxide (KOH) Refractometer is a specialized\
  \ Domain 79 (Microgrid Renewable Water Electrolyzer (Alkaline & PEM) Hydrogen Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via Critical Angle Optical\
  \ Prism Sensor, it is specifically engineered to mitigate and detect Lye concentration\
  \ dilution fraud, caustic solution crystallization. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Refractive index: n_D \u221D\
  \ [KOH] = 30.0\\% \xB1 1.0\\,wt\\%; low concentration increases overpotential, spiking\
  \ electricity usage.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Lye concentration dilution fraud, caustic solution crystallization
core_invariant: "Refractive index: n_D \u221D [KOH] = 30.0\\% \xB1 1.0\\,wt\\%; low\
  \ concentration increases overpotential, spiking electricity usage."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40281:
      name: s560_alkaline_lye_potassium_hydroxide_koh_refractometer_pv
      type: float32
      scale: 1.0
      unit: units
    40283:
      name: s560_alkaline_lye_potassium_hydroxide_koh_refractometer_status
