sensor_id: s503_diesel_electric_straddle_carrier_inverter_ct_array
name: Diesel-Electric Straddle Carrier Inverter CT Array
domain_id: 71
domain_title: Autonomous Port Container Straddle Carrier & AGV Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15503
interface: High-Bandwidth Hall Current Sensor
description: 'Diesel-Electric Straddle Carrier Inverter CT Array is a specialized
  Domain 71 (Autonomous Port Container Straddle Carrier & AGV Sensors) cyber-physical
  monitoring sensor. Interfacing directly via High-Bandwidth Hall Current Sensor,
  it is specifically engineered to mitigate and detect Regenerative hoist braking
  overvoltage, DC link inverter explosion. In the Aryorithm edge architecture, it
  continuously asserts the operational invariant: Phase current balance: \sum I_{phase}
  == 0; current imbalance indicates stator winding short, engaging mechanical hoist
  brakes.. Any divergence between commanded network state and this physical reading
  triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Regenerative hoist braking overvoltage, DC link inverter explosion
core_invariant: 'Phase current balance: \sum I_{phase} == 0; current imbalance indicates
  stator winding short, engaging mechanical hoist brakes.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40261:
      name: s503_diesel_electric_straddle_carrier_inverter_ct_array_pv
      type: float32
      scale: 1.0
      unit: units
    40263:
      name: s503_diesel_electric_straddle_carrier_inverter_ct_array_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s503_diesel_electric_straddle_carrier_inverter_ct_array_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Regenerative hoist braking overvoltage, DC link inverter
    explosion'
