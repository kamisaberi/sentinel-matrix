sensor_id: s429_inverter_phase_high_bandwidth_rogowski_sensor
name: Inverter Phase High-Bandwidth Rogowski Sensor
domain_id: 61
domain_title: High-Speed Electric Vehicle (EV) Powertrain & Silicon Carbide (SiC)
  Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15429
interface: PCB Embedded Rogowski Coil (50 MHz)
description: "Inverter Phase High-Bandwidth Rogowski Sensor is a specialized Domain\
  \ 61 (High-Speed Electric Vehicle (EV) Powertrain & Silicon Carbide (SiC) Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via PCB Embedded Rogowski\
  \ Coil (50 MHz), it is specifically engineered to mitigate and detect Bridge arm\
  \ shoot-through, high-voltage battery short-circuit. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Senses extreme current slew\
  \ rates: \\frac{dI}{dt} >= 5\\,kA/\xB5s; triggers soft-turn-off gate driver shutdown\
  \ in < 200\\,ns.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Bridge arm shoot-through, high-voltage battery short-circuit
core_invariant: "Senses extreme current slew rates: \\frac{dI}{dt} >= 5\\,kA/\xB5\
  s; triggers soft-turn-off gate driver shutdown in < 200\\,ns."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40041:
      name: s429_inverter_phase_high_bandwidth_rogowski_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40043:
      name: s429_inverter_phase_high_bandwidth_rogowski_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s429_inverter_phase_high_bandwidth_rogowski_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Bridge arm shoot-through, high-voltage battery short-circuit'
