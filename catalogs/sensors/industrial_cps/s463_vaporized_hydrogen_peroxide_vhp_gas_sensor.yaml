sensor_id: s463_vaporized_hydrogen_peroxide_vhp_gas_sensor
name: Vaporized Hydrogen Peroxide (VHP) Gas Sensor
domain_id: 66
domain_title: Pharmaceutical Sterile Aseptic Isolator & CIP Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15463
interface: Amperometric Electrochemical Sensor
description: 'Vaporized Hydrogen Peroxide (VHP) Gas Sensor is a specialized Domain
  66 (Pharmaceutical Sterile Aseptic Isolator & CIP Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Amperometric Electrochemical Sensor, it is specifically
  engineered to mitigate and detect Inadequate bio-decontamination cycle, toxic VHP
  residue in drug vials. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: VHP sterilization dose: C_{VHP} >= 400\,ppm maintained
  for t >= 30\,min; aeration must reduce residue to < 1.0\,ppm.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Inadequate bio-decontamination cycle, toxic VHP residue in drug vials
core_invariant: 'VHP sterilization dose: C_{VHP} >= 400\,ppm maintained for t >= 30\,min;
  aeration must reduce residue to < 1.0\,ppm.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40371:
      name: s463_vaporized_hydrogen_peroxide_vhp_gas_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40373:
      name: s463_vaporized_hydrogen_peroxide_vhp_gas_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s463_vaporized_hydrogen_peroxide_vhp_gas_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Inadequate bio-decontamination cycle, toxic VHP residue
    in drug vials'
