sensor_id: s301_sag_mill_shell_acoustic_impact_sensor
name: SAG Mill Shell Acoustic Impact Sensor
domain_id: 43
domain_title: Mining Flotation & Mineral Beneficiation Process Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15301
interface: Wireless Shell-Mounted Piezo-Transducer
description: 'SAG Mill Shell Acoustic Impact Sensor is a specialized Domain 43 (Mining
  Flotation & Mineral Beneficiation Process Sensors) cyber-physical monitoring sensor.
  Interfacing directly via Wireless Shell-Mounted Piezo-Transducer, it is specifically
  engineered to mitigate and detect Grinding ball direct liner strike, catastrophic
  mill liner fracture. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: Acoustic strike frequency and energy: impact angle \theta_{toe}
  must hit the ore toe; direct liner impact de-rates rotational speed in < 5\,seconds..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Grinding ball direct liner strike, catastrophic mill liner fracture
core_invariant: 'Acoustic strike frequency and energy: impact angle \theta_{toe} must
  hit the ore toe; direct liner impact de-rates rotational speed in < 5\,seconds.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40371:
      name: s301_sag_mill_shell_acoustic_impact_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40373:
      name: s301_sag_mill_shell_acoustic_impact_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s301_sag_mill_shell_acoustic_impact_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Grinding ball direct liner strike, catastrophic mill
    liner fracture'
