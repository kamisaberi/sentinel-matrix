sensor_id: s501_hydrostatic_wheel_motor_differential_pressure_sensor
name: Hydrostatic Wheel-Motor Differential Pressure Sensor
domain_id: 71
domain_title: Autonomous Port Container Straddle Carrier & AGV Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15501
interface: Hydraulic Transducer on Closed-Loop Drive
description: "Hydrostatic Wheel-Motor Differential Pressure Sensor is a specialized\
  \ Domain 71 (Autonomous Port Container Straddle Carrier & AGV Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Hydraulic Transducer on Closed-Loop\
  \ Drive, it is specifically engineered to mitigate and detect Wheel-motor cavitation,\
  \ runaway wheel spin on wet steel plates. In the Aryorithm edge architecture, it\
  \ continuously asserts the operational invariant: Closed-loop differential pressure:\
  \ \u0394 P = P_A - P_B <= 380\\,bar; pressure loss flags hydraulic hose rupture;\
  \ applies spring brakes.. Any divergence between commanded network state and this\
  \ physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Wheel-motor cavitation, runaway wheel spin on wet steel plates
core_invariant: "Closed-loop differential pressure: \u0394 P = P_A - P_B <= 380\\\
  ,bar; pressure loss flags hydraulic hose rupture; applies spring brakes."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40241:
      name: s501_hydrostatic_wheel_motor_differential_pressure_sensor_pv
      type: float32
      scale: 1.0
      unit: units
    40243:
      name: s501_hydrostatic_wheel_motor_differential_pressure_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s501_hydrostatic_wheel_motor_differential_pressure_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Wheel-motor cavitation, runaway wheel spin on wet
    steel plates'
