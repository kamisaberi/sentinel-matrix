sensor_id: s478_solid_amine_contactor_co_2_desorption_mass_spectrometer
name: Solid-Amine Contactor CO_2 Desorption Mass Spectrometer
domain_id: 68
domain_title: Carbon Dioxide Direct Air Capture (DAC) & Zeolite Adsorption Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15478
interface: Quadrupole Process Mass Spectrometer
description: 'Solid-Amine Contactor CO_2 Desorption Mass Spectrometer is a specialized
  Domain 68 (Carbon Dioxide Direct Air Capture (DAC) & Zeolite Adsorption Sensors)
  cyber-physical monitoring sensor. Interfacing directly via Quadrupole Process Mass
  Spectrometer, it is specifically engineered to mitigate and detect Amine chemical
  degradation, toxic nitrosamine/nitramine emission. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: CO_2 purity: [CO_2] >= 99.5\%;
  degradation fragments (m/z = 30, 44, 46) must remain below environmental permit
  limits.. Any divergence between commanded network state and this physical reading
  triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Amine chemical degradation, toxic nitrosamine/nitramine emission
core_invariant: 'CO_2 purity: [CO_2] >= 99.5\%; degradation fragments (m/z = 30, 44,
  46) must remain below environmental permit limits.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40021:
      name: s478_solid_amine_contactor_co_2_desorption_mass_spectrometer_pv
      type: float32
      scale: 1.0
      unit: units
    40023:
      name: s478_solid_amine_contactor_co_2_desorption_mass_spectrometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s478_solid_amine_contactor_co_2_desorption_mass_spectrometer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Amine chemical degradation, toxic nitrosamine/nitramine
    emission'
