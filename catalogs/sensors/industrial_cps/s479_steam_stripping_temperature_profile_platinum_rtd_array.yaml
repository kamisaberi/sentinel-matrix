sensor_id: s479_steam_stripping_temperature_profile_platinum_rtd_array
name: Steam Stripping Temperature Profile Platinum RTD Array
domain_id: 68
domain_title: Carbon Dioxide Direct Air Capture (DAC) & Zeolite Adsorption Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15479
interface: 16-Point Multi-Junction RTD Tree
description: "Steam Stripping Temperature Profile Platinum RTD Array is a specialized\
  \ Domain 68 (Carbon Dioxide Direct Air Capture (DAC) & Zeolite Adsorption Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via 16-Point Multi-Junction\
  \ RTD Tree, it is specifically engineered to mitigate and detect Desorption thermal\
  \ hot-spots, thermal degradation of solid sorbent. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Desorption temperature: T_{desorb}\
  \ = 100^\\circC \xB1 2^\\circC; localized hot spot (> 110^\\circC) cuts stripping\
  \ steam to prevent sorbent decomposition.. Any divergence between commanded network\
  \ state and this physical reading triggers sub-microsecond in-kernel eBPF packet\
  \ mitigation."
target_threat: Desorption thermal hot-spots, thermal degradation of solid sorbent
core_invariant: "Desorption temperature: T_{desorb} = 100^\\circC \xB1 2^\\circC;\
  \ localized hot spot (> 110^\\circC) cuts stripping steam to prevent sorbent decomposition."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40031:
      name: s479_steam_stripping_temperature_profile_platinum_rtd_array_pv
      type: float32
      scale: 1.0
      unit: units
    40033:
      name: s479_steam_stripping_temperature_profile_platinum_rtd_array_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s479_steam_stripping_temperature_profile_platinum_rtd_array_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Desorption thermal hot-spots, thermal degradation
    of solid sorbent'
