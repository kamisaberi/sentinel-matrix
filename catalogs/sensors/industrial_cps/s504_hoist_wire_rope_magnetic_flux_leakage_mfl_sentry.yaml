  holding_registers:
    40271:
      name: s504_hoist_wire_rope_magnetic_flux_leakage_mfl_sentry_pv
      type: float32
      scale: 1.0
      unit: units
    40273:
      name: s504_hoist_wire_rope_magnetic_flux_leakage_mfl_sentry_status
