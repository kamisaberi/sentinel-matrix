sensor_id: s291_scan_match_quality_slam_lidar_invariant_probe
name: Scan Match Quality SLAM LiDAR Invariant Probe
domain_id: 41
domain_title: Autonomous Mobile Robot (AMR) & AGV Drivetrain Safety Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15291
interface: 2D Safety LiDAR Point-Cloud Stream
description: 'Scan Match Quality SLAM LiDAR Invariant Probe is a specialized Domain
  41 (Autonomous Mobile Robot (AMR) & AGV Drivetrain Safety Sensors) cyber-physical
  monitoring sensor. Interfacing directly via 2D Safety LiDAR Point-Cloud Stream,
  it is specifically engineered to mitigate and detect "Kidnapped Robot" attack, reflective
  marker spoofing in warehouse. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Scan-to-map ICP covariance matrix trace: Tr(\mathbf{\Sigma}_{pose})
  <= \tau_{localization}; localization failure forces controlled stop.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: '"Kidnapped Robot" attack, reflective marker spoofing in warehouse'
core_invariant: 'Scan-to-map ICP covariance matrix trace: Tr(\mathbf{\Sigma}_{pose})
  <= \tau_{localization}; localization failure forces controlled stop.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40271:
      name: s291_scan_match_quality_slam_lidar_invariant_probe_pv
      type: float32
      scale: 1.0
      unit: units
    40273:
      name: s291_scan_match_quality_slam_lidar_invariant_probe_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s291_scan_match_quality_slam_lidar_invariant_probe_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: "Kidnapped Robot" attack, reflective marker spoofing
    in warehouse'
