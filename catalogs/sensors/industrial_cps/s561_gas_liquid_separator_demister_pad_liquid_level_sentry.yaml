sensor_id: s561_gas_liquid_separator_demister_pad_liquid_level_sentry
name: Gas-Liquid Separator Demister Pad Liquid Level Sentry
domain_id: 79
domain_title: Microgrid Renewable Water Electrolyzer (Alkaline & PEM) Hydrogen Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15561
interface: High-Pressure Guided Wave Radar
description: 'Gas-Liquid Separator Demister Pad Liquid Level Sentry is a specialized
  Domain 79 (Microgrid Renewable Water Electrolyzer (Alkaline & PEM) Hydrogen Sensors)
  cyber-physical monitoring sensor. Interfacing directly via High-Pressure Guided
  Wave Radar, it is specifically engineered to mitigate and detect Lye liquid carryover
  into dry gas lines, caustic aerosol explosion. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Liquid level in separator: h_{liquid}
  <= h_{demister} - 150\,mm; high level trips drain valve to prevent caustic carryover..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Lye liquid carryover into dry gas lines, caustic aerosol explosion
core_invariant: 'Liquid level in separator: h_{liquid} <= h_{demister} - 150\,mm;
  high level trips drain valve to prevent caustic carryover.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40291:
      name: s561_gas_liquid_separator_demister_pad_liquid_level_sentry_pv
      type: float32
      scale: 1.0
      unit: units
    40293:
      name: s561_gas_liquid_separator_demister_pad_liquid_level_sentry_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s561_gas_liquid_separator_demister_pad_liquid_level_sentry_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Lye liquid carryover into dry gas lines, caustic
    aerosol explosion'
