sensor_id: s484_co_2_compressor_chilled_mirror_optical_hygrometer
name: CO_2 Compressor Chilled-Mirror Optical Hygrometer
domain_id: 68
domain_title: Carbon Dioxide Direct Air Capture (DAC) & Zeolite Adsorption Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15484
interface: Chilled Mirror Dew/Frost Point Sensor
description: 'CO_2 Compressor Chilled-Mirror Optical Hygrometer is a specialized Domain
  68 (Carbon Dioxide Direct Air Capture (DAC) & Zeolite Adsorption Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Chilled Mirror Dew/Frost Point Sensor,
  it is specifically engineered to mitigate and detect Liquid water condensation inside
  150-bar supercritical CO_2 pipeline. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Condensation temperature: T_{mirror} = T_{dew}
  <= T_{gas} - 15^\circC; moisture margin collapse trips interstage compressor drains..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Liquid water condensation inside 150-bar supercritical CO_2 pipeline
core_invariant: 'Condensation temperature: T_{mirror} = T_{dew} <= T_{gas} - 15^\circC;
  moisture margin collapse trips interstage compressor drains.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40081:
      name: s484_co_2_compressor_chilled_mirror_optical_hygrometer_pv
      type: float32
      scale: 1.0
      unit: units
    40083:
      name: s484_co_2_compressor_chilled_mirror_optical_hygrometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s484_co_2_compressor_chilled_mirror_optical_hygrometer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Liquid water condensation inside 150-bar supercritical
    CO_2 pipeline'
