sensor_id: s288_regenerative_braking_dc_bus_overvoltage_surge_detector
name: Regenerative Braking DC Bus Overvoltage Surge Detector
domain_id: 41
domain_title: Autonomous Mobile Robot (AMR) & AGV Drivetrain Safety Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15288
interface: Isolated Voltage Divider on Inverter Bus
description: "Regenerative Braking DC Bus Overvoltage Surge Detector is a specialized\
  \ Domain 41 (Autonomous Mobile Robot (AMR) & AGV Drivetrain Safety Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Isolated Voltage Divider on Inverter\
  \ Bus, it is specifically engineered to mitigate and detect Dynamic braking resistor\
  \ open-circuit, inverter capacitor bank explosion. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Inverter DC bus voltage: V_{DC}\
  \ <= 48.0\\,V \xB1 10\\%; overvoltage surge triggers mechanical brake clamp before\
  \ electronics fry.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Dynamic braking resistor open-circuit, inverter capacitor bank explosion
core_invariant: "Inverter DC bus voltage: V_{DC} <= 48.0\\,V \xB1 10\\%; overvoltage\
  \ surge triggers mechanical brake clamp before electronics fry."
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40251:
      name: s288_regenerative_braking_dc_bus_overvoltage_surge_detector_pv
      type: float32
      scale: 1.0
      unit: units
    40253:
      name: s288_regenerative_braking_dc_bus_overvoltage_surge_detector_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s288_regenerative_braking_dc_bus_overvoltage_surge_detector_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Dynamic braking resistor open-circuit, inverter capacitor
    bank explosion'
