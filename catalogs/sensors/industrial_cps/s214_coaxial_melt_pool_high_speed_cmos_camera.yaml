sensor_id: s214_coaxial_melt_pool_high_speed_cmos_camera
name: Coaxial Melt-Pool High-Speed CMOS Camera
domain_id: 31
domain_title: Metal Additive Manufacturing (3D Printing) Melt-Pool Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15214
interface: Short-Wave Infrared (SWIR) Sensor
description: 'Coaxial Melt-Pool High-Speed CMOS Camera is a specialized Domain 31
  (Metal Additive Manufacturing (3D Printing) Melt-Pool Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Short-Wave Infrared (SWIR) Sensor, it is specifically
  engineered to mitigate and detect Keyhole porosity defect formation, melt pool aspect
  ratio warping. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Melt pool length-to-width ratio: \frac{L_{pool}}{W_{pool}} <= 2.5; elongated
  keyhole geometry flags trapped vapor bubbles inside turbine blade prints.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Keyhole porosity defect formation, melt pool aspect ratio warping
core_invariant: 'Melt pool length-to-width ratio: \frac{L_{pool}}{W_{pool}} <= 2.5;
  elongated keyhole geometry flags trapped vapor bubbles inside turbine blade prints.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40051:
      name: s214_coaxial_melt_pool_high_speed_cmos_camera_pv
      type: float32
      scale: 1.0
      unit: units
    40053:
      name: s214_coaxial_melt_pool_high_speed_cmos_camera_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s214_coaxial_melt_pool_high_speed_cmos_camera_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Keyhole porosity defect formation, melt pool aspect
    ratio warping'
