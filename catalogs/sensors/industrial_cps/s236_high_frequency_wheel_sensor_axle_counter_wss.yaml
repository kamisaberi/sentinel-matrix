sensor_id: s236_high_frequency_wheel_sensor_axle_counter_wss
name: High-Frequency Wheel Sensor (Axle Counter WSS)
domain_id: 34
domain_title: Railway Signaling, Trackside Balise & Eurobalise PTC Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15236
interface: Dual High-Frequency Eddy Current Coils
description: 'High-Frequency Wheel Sensor (Axle Counter WSS) is a specialized Domain
  34 (Railway Signaling, Trackside Balise & Eurobalise PTC Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Dual High-Frequency Eddy Current Coils,
  it is specifically engineered to mitigate and detect Phantom train car detection,
  track clear spoofing, collision hazard. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Passing wheel flange attenuates high-frequency
  magnetic coupling (30 kHz); phase shift direction reveals train travel vector and
  wheel count.. Any divergence between commanded network state and this physical reading
  triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Phantom train car detection, track clear spoofing, collision hazard
core_invariant: Passing wheel flange attenuates high-frequency magnetic coupling (30
  kHz); phase shift direction reveals train travel vector and wheel count.
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40261:
      name: s236_high_frequency_wheel_sensor_axle_counter_wss_pv
      type: float32
      scale: 1.0
      unit: units
    40263:
      name: s236_high_frequency_wheel_sensor_axle_counter_wss_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s236_high_frequency_wheel_sensor_axle_counter_wss_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Phantom train car detection, track clear spoofing,
    collision hazard'
