sensor_id: s292_overhead_conductor_tension_load_cell
name: Overhead Conductor Tension Load Cell
domain_id: 42
domain_title: High-Tension Transmission Pylon & Dynamic Line Rating (DLR) Sensors
category: INDUSTRIAL_CPS
target_protocol: MODBUS_TCP
default_port: 15292
interface: Shackle-Mounted Strain Transducer
description: 'Overhead Conductor Tension Load Cell is a specialized Domain 42 (High-Tension
  Transmission Pylon & Dynamic Line Rating (DLR) Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Shackle-Mounted Strain Transducer, it is specifically
  engineered to mitigate and detect Transmission line thermal sag, conductor annealing,
  tree-flashover. In the Aryorithm edge architecture, it continuously asserts the
  operational invariant: Catenary tension equation: T = \frac{w L^2}{8 S}; tension
  drop below safe limit indicates excessive conductor sag towards ground.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Transmission line thermal sag, conductor annealing, tree-flashover
core_invariant: 'Catenary tension equation: T = \frac{w L^2}{8 S}; tension drop below
  safe limit indicates excessive conductor sag towards ground.'
physics:
  engine: generic_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: units
registers:
  holding_registers:
    40281:
      name: s292_overhead_conductor_tension_load_cell_pv
      type: float32
      scale: 1.0
      unit: units
    40283:
      name: s292_overhead_conductor_tension_load_cell_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s292_overhead_conductor_tension_load_cell_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Transmission line thermal sag, conductor annealing,
    tree-flashover'
