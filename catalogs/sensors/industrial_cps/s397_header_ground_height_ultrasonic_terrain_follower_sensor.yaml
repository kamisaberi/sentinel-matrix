description: "Header Ground Height Ultrasonic Terrain Follower Sensor is a specialized\
  \ Domain 56 (Autonomous Agricultural Combine Harvester & Grain Loss Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Dual Ultrasonic Transducers on Wing\
  \ Tips, it is specifically engineered to mitigate and detect Header ground strike,\
  \ cutter bar knife destruction on uneven terrain. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Header ground clearance: h_{header}\
  \ = h_{setpoint} \xB1 20\\,mm; dynamic hydraulic tilt cylinders adjust header roll\
  \ in < 100\\,ms.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Header ground strike, cutter bar knife destruction on uneven terrain
core_invariant: "Header ground clearance: h_{header} = h_{setpoint} \xB1 20\\,mm;\
  \ dynamic hydraulic tilt cylinders adjust header roll in < 100\\,ms."
