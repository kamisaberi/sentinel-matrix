sensor_id: s160_beta_gauge_radiometric_particulate_mass_monitor
name: Beta-Gauge Radiometric Particulate Mass Monitor
domain_id: 23
domain_title: Environmental Biosecurity, Pathogen & CBRN Defense Sensors
category: BIOPROCESS
target_protocol: MODBUS_TCP
default_port: 15160
interface: Carbon-14 (C-14) Beta Attenuation
description: "Beta-Gauge Radiometric Particulate Mass Monitor is a specialized Domain\
  \ 23 (Environmental Biosecurity, Pathogen & CBRN Defense Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Carbon-14 (C-14) Beta Attenuation,\
  \ it is specifically engineered to mitigate and detect Industrial stack filter tampering,\
  \ environmental compliance fraud. In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Beta particle absorption: I = I_0 e^{-\xB5\
  _m \\cdot C_{mass}}; measures true physical particulate mass density (PM_{2.5} /\
  \ PM_{10}) directly.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Industrial stack filter tampering, environmental compliance fraud
core_invariant: "Beta particle absorption: I = I_0 e^{-\xB5_m \\cdot C_{mass}}; measures\
  \ true physical particulate mass density (PM_{2.5} / PM_{10}) directly."
physics:
  engine: bioprocess_cell
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: pH
registers:
  holding_registers:
    40051:
      name: s160_beta_gauge_radiometric_particulate_mass_monitor_pv
      type: float32
      scale: 1.0
      unit: pH
    40053:
      name: s160_beta_gauge_radiometric_particulate_mass_monitor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s160_beta_gauge_radiometric_particulate_mass_monitor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Industrial stack filter tampering, environmental
    compliance fraud'
