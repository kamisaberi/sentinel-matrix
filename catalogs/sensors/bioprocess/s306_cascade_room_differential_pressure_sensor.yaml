sensor_id: s306_cascade_room_differential_pressure_sensor
name: Cascade Room Differential Pressure Sensor
domain_id: 44
domain_title: High-Containment BSL-4 / Biosecurity Facility Environmental Sensors
category: BIOPROCESS
target_protocol: MODBUS_TCP
default_port: 15306
interface: High-Accuracy Piezoresistive Diaphragm
description: "Cascade Room Differential Pressure Sensor is a specialized Domain 44\
  \ (High-Containment BSL-4 / Biosecurity Facility Environmental Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via High-Accuracy Piezoresistive Diaphragm,\
  \ it is specifically engineered to mitigate and detect Negative pressure envelope\
  \ loss, airborne pathogen escape to corridors. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Room pressure cascade: P_{BSL4}\
  \ < P_{Airlock} < P_{Clean}; minimum differential \u0394 P >= 25.0\\,Pa maintained\
  \ by supply/exhaust fans.. Any divergence between commanded network state and this\
  \ physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Negative pressure envelope loss, airborne pathogen escape to corridors
core_invariant: "Room pressure cascade: P_{BSL4} < P_{Airlock} < P_{Clean}; minimum\
  \ differential \u0394 P >= 25.0\\,Pa maintained by supply/exhaust fans."
physics:
  engine: bioprocess_cell
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: pH
registers:
  holding_registers:
    40421:
      name: s306_cascade_room_differential_pressure_sensor_pv
      type: float32
      scale: 1.0
      unit: pH
    40423:
      name: s306_cascade_room_differential_pressure_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s306_cascade_room_differential_pressure_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Negative pressure envelope loss, airborne pathogen
    escape to corridors'
