sensor_id: s311_pneumatic_door_gasket_seal_pressure_switch
name: Pneumatic Door Gasket Seal Pressure Switch
domain_id: 44
domain_title: High-Containment BSL-4 / Biosecurity Facility Environmental Sensors
category: BIOPROCESS
target_protocol: MODBUS_TCP
default_port: 15311
interface: Pressure-Decay Differential Switch
description: 'Pneumatic Door Gasket Seal Pressure Switch is a specialized Domain 44
  (High-Containment BSL-4 / Biosecurity Facility Environmental Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Pressure-Decay Differential Switch,
  it is specifically engineered to mitigate and detect Inflatable gasket seal deflation
  during active pathogen handling. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Door seal pressure: P_{seal} >= 2.5\,bar; pressure
  loss prevents the outer airlock door from unlatching.. Any divergence between commanded
  network state and this physical reading triggers sub-microsecond in-kernel eBPF
  packet mitigation.'
target_threat: Inflatable gasket seal deflation during active pathogen handling
core_invariant: 'Door seal pressure: P_{seal} >= 2.5\,bar; pressure loss prevents
  the outer airlock door from unlatching.'
physics:
  engine: bioprocess_cell
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: pH
registers:
  holding_registers:
    40471:
      name: s311_pneumatic_door_gasket_seal_pressure_switch_pv
      type: float32
      scale: 1.0
      unit: pH
    40473:
      name: s311_pneumatic_door_gasket_seal_pressure_switch_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s311_pneumatic_door_gasket_seal_pressure_switch_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Inflatable gasket seal deflation during active pathogen
    handling'
