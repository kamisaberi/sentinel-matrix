sensor_id: s158_surface_plasmon_resonance_spr_affinity_biosensor
name: Surface Plasmon Resonance (SPR) Affinity Biosensor
domain_id: 23
domain_title: Environmental Biosecurity, Pathogen & CBRN Defense Sensors
category: BIOPROCESS
target_protocol: MODBUS_TCP
default_port: 15158
interface: Kretschmann Optical Prism Coupler
description: "Surface Plasmon Resonance (SPR) Affinity Biosensor is a specialized\
  \ Domain 23 (Environmental Biosecurity, Pathogen & CBRN Defense Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Kretschmann Optical Prism Coupler,\
  \ it is specifically engineered to mitigate and detect Biological toxin contamination\
  \ in drinking water (botulinum, abrin). In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Refractive index shift \u0394 n caused by molecular\
  \ antibody-antigen binding; automated water intake diversion before municipal distribution..\
  \ Any divergence between commanded network state and this physical reading triggers\
  \ sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Biological toxin contamination in drinking water (botulinum, abrin)
core_invariant: "Refractive index shift \u0394 n caused by molecular antibody-antigen\
  \ binding; automated water intake diversion before municipal distribution."
physics:
  engine: bioprocess_cell
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: pH
registers:
