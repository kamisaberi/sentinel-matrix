sensor_id: s224_catalytic_surface_recombination_thermocouple
name: Catalytic Surface Recombination Thermocouple
domain_id: 32
domain_title: Spacecraft Re-entry & Hypersonic Thermal Protection Systems (TPS)
category: TEMPERATURE
target_protocol: MODBUS_TCP
default_port: 15224
interface: Differential Coated Thermocouple
description: "Catalytic Surface Recombination Thermocouple is a specialized Domain\
  \ 32 (Spacecraft Re-entry & Hypersonic Thermal Protection Systems (TPS)) cyber-physical\
  \ monitoring sensor. Interfacing directly via Differential Coated Thermocouple,\
  \ it is specifically engineered to mitigate and detect Catalytic atomic oxygen recombination,\
  \ leading-edge burn-through. In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Temperature delta between catalytic (copper)\
  \ and non-catalytic (silica) surfaces reveals atomic recombination heating: q''_{chem}\
  \ = \\gamma_O \\cdot \u0394 H_R \\cdot J_O.. Any divergence between commanded network\
  \ state and this physical reading triggers sub-microsecond in-kernel eBPF packet\
  \ mitigation."
target_threat: Catalytic atomic oxygen recombination, leading-edge burn-through
core_invariant: "Temperature delta between catalytic (copper) and non-catalytic (silica)\
  \ surfaces reveals atomic recombination heating: q''_{chem} = \\gamma_O \\cdot \u0394\
  \ H_R \\cdot J_O."
physics:
  engine: thermal_lag_ode
  baseline_value: 68.5
  min_value: -50.0
  max_value: 400.0
  noise_sigma: 0.15
  unit: degC
registers:
  holding_registers:
    40141:
      name: s224_catalytic_surface_recombination_thermocouple_pv
      type: float32
      scale: 1.0
      unit: degC
    40143:
      name: s224_catalytic_surface_recombination_thermocouple_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s224_catalytic_surface_recombination_thermocouple_fault
  action: linear_ramp
  value: 15.0
  description: 'Injects anomaly: Catalytic atomic oxygen recombination, leading-edge
    burn-through'
