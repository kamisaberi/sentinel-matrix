sensor_id: s040_bess_inter_cell_thermal_expansion_sensor
name: BESS Inter-Cell Thermal Expansion Sensor
domain_id: 6
domain_title: Thermal, Infrared & Cryogenic Sensors
category: TEMPERATURE
target_protocol: MODBUS_TCP
default_port: 15040
interface: Strain Gauge / Thin-Film RTD
description: 'BESS Inter-Cell Thermal Expansion Sensor is a specialized Domain 06
  (Thermal, Infrared & Cryogenic Sensors) cyber-physical monitoring sensor. Interfacing
  directly via Strain Gauge / Thin-Film RTD, it is specifically engineered to mitigate
  and detect Lithium-ion battery dendrite growth and swelling. In the Aryorithm edge
  architecture, it continuously asserts the operational invariant: Mechanical swelling
  combined with temperature rise triggers DC contactor trip.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Lithium-ion battery dendrite growth and swelling
core_invariant: Mechanical swelling combined with temperature rise triggers DC contactor
  trip.
physics:
  engine: thermal_lag_ode
  baseline_value: 68.5
  min_value: -50.0
  max_value: 400.0
  noise_sigma: 0.15
  unit: degC
registers:
  holding_registers:
    40391:
      name: s040_bess_inter_cell_thermal_expansion_sensor_pv
      type: float32
      scale: 1.0
      unit: degC
    40393:
      name: s040_bess_inter_cell_thermal_expansion_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s040_bess_inter_cell_thermal_expansion_sensor_fault
  action: linear_ramp
  value: 15.0
  description: 'Injects anomaly: Lithium-ion battery dendrite growth and swelling'
