sensor_id: s038_cryogenic_ruthenium_oxide_ruo_2_thermometer
name: Cryogenic Ruthenium Oxide (RuO_2) Thermometer
domain_id: 6
domain_title: Thermal, Infrared & Cryogenic Sensors
category: TEMPERATURE
target_protocol: MODBUS_TCP
default_port: 15038
interface: AC Resistance Bridge (< 1 K)
description: "Cryogenic Ruthenium Oxide (RuO_2) Thermometer is a specialized Domain\
  \ 06 (Thermal, Infrared & Cryogenic Sensors) cyber-physical monitoring sensor. Interfacing\
  \ directly via AC Resistance Bridge (< 1 K), it is specifically engineered to mitigate\
  \ and detect Quantum dilution refrigerator phase separation failure. In the Aryorithm\
  \ edge architecture, it continuously asserts the operational invariant: Mixing chamber\
  \ temperature must stay within 15 mK \xB1 2 mK.. Any divergence between commanded\
  \ network state and this physical reading triggers sub-microsecond in-kernel eBPF\
  \ packet mitigation."
target_threat: Quantum dilution refrigerator phase separation failure
core_invariant: "Mixing chamber temperature must stay within 15 mK \xB1 2 mK."
physics:
  engine: thermal_lag_ode
  baseline_value: 68.5
  min_value: -50.0
  max_value: 400.0
  noise_sigma: 0.15
  unit: degC
registers:
  holding_registers:
    40371:
      name: s038_cryogenic_ruthenium_oxide_ruo_2_thermometer_pv
      type: float32
      scale: 1.0
      unit: degC
    40373:
      name: s038_cryogenic_ruthenium_oxide_ruo_2_thermometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s038_cryogenic_ruthenium_oxide_ruo_2_thermometer_fault
  action: linear_ramp
  value: 15.0
  description: 'Injects anomaly: Quantum dilution refrigerator phase separation failure'
