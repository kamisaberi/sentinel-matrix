sensor_id: s319_rocket_nozzle_regenerative_cooling_fuel_flow_meter
name: Rocket Nozzle Regenerative Cooling Fuel Flow Meter
domain_id: 45
domain_title: Launch Vehicle Cryogenic Propulsion & TVC Gimbal Mechanics Sensors
category: TEMPERATURE
target_protocol: MODBUS_TCP
default_port: 15319
interface: Cryogenic Turbine Flow Meter
description: "Rocket Nozzle Regenerative Cooling Fuel Flow Meter is a specialized\
  \ Domain 45 (Launch Vehicle Cryogenic Propulsion & TVC Gimbal Mechanics Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via Cryogenic Turbine Flow\
  \ Meter, it is specifically engineered to mitigate and detect Nozzle throat regenerative\
  \ cooling starvation, throat burn-through. In the Aryorithm edge architecture, it\
  \ continuously asserts the operational invariant: Coolant mass flow: \\dot{m}_{coolant}\
  \ >= \\frac{q''_{throat} A_{throat}}{C_p \u0394 T_{allowable}}; starvation triggers\
  \ immediate engine cutoff.. Any divergence between commanded network state and this\
  \ physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Nozzle throat regenerative cooling starvation, throat burn-through
core_invariant: "Coolant mass flow: \\dot{m}_{coolant} >= \\frac{q''_{throat} A_{throat}}{C_p\
  \ \u0394 T_{allowable}}; starvation triggers immediate engine cutoff."
physics:
  engine: thermal_lag_ode
  baseline_value: 68.5
  min_value: -50.0
  max_value: 400.0
  noise_sigma: 0.15
  unit: degC
registers:
  holding_registers:
    40031:
      name: s319_rocket_nozzle_regenerative_cooling_fuel_flow_meter_pv
      type: float32
      scale: 1.0
      unit: degC
    40033:
      name: s319_rocket_nozzle_regenerative_cooling_fuel_flow_meter_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s319_rocket_nozzle_regenerative_cooling_fuel_flow_meter_fault
  action: linear_ramp
  value: 15.0
  description: 'Injects anomaly: Nozzle throat regenerative cooling starvation, throat
    burn-through'
