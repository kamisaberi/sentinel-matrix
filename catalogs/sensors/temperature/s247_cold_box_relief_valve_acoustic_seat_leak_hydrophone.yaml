sensor_id: s247_cold_box_relief_valve_acoustic_seat_leak_hydrophone
name: Cold-Box Relief Valve Acoustic Seat Leak Hydrophone
domain_id: 35
domain_title: Liquid Hydrogen (LH_2) & Cryogenic Infrastructure Sensors
category: TEMPERATURE
target_protocol: MODBUS_TCP
default_port: 15247
interface: Wideband High-Frequency Accelerometer
description: 'Cold-Box Relief Valve Acoustic Seat Leak Hydrophone is a specialized
  Domain 35 (Liquid Hydrogen (LH_2) & Cryogenic Infrastructure Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Wideband High-Frequency Accelerometer,
  it is specifically engineered to mitigate and detect Unseated cryogenic valve, continuous
  hidden hydrogen loss. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: High-frequency acoustic emission (80--150\,kHz) generated
  by supersonic gas leakage across metal valve seat; alerts to unseated valve.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Unseated cryogenic valve, continuous hidden hydrogen loss
core_invariant: High-frequency acoustic emission (80--150\,kHz) generated by supersonic
  gas leakage across metal valve seat; alerts to unseated valve.
physics:
  engine: thermal_lag_ode
  baseline_value: 68.5
  min_value: -50.0
  max_value: 400.0
  noise_sigma: 0.15
  unit: degC
registers:
  holding_registers:
    40371:
      name: s247_cold_box_relief_valve_acoustic_seat_leak_hydrophone_pv
      type: float32
      scale: 1.0
      unit: degC
    40373:
      name: s247_cold_box_relief_valve_acoustic_seat_leak_hydrophone_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s247_cold_box_relief_valve_acoustic_seat_leak_hydrophone_fault
  action: linear_ramp
  value: 15.0
  description: 'Injects anomaly: Unseated cryogenic valve, continuous hidden hydrogen
    loss'
