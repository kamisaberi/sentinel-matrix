sensor_id: s039_cpu_heat_sink_thermal_gradient_sensor
name: CPU Heat-Sink Thermal Gradient Sensor
domain_id: 6
domain_title: Thermal, Infrared & Cryogenic Sensors
category: TEMPERATURE
target_protocol: MODBUS_TCP
default_port: 15039
interface: eBPF Driver / Coretemp MSR
description: 'CPU Heat-Sink Thermal Gradient Sensor is a specialized Domain 06 (Thermal,
  Infrared & Cryogenic Sensors) cyber-physical monitoring sensor. Interfacing directly
  via eBPF Driver / Coretemp MSR, it is specifically engineered to mitigate and detect
  Thermal covert-channel data exfiltration. In the Aryorithm edge architecture, it
  continuously asserts the operational invariant: Oscillations in \frac{dT_{CPU}}{dt}
  at frequency f_{leak} trigger random thermal noise injection.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Thermal covert-channel data exfiltration
core_invariant: Oscillations in \frac{dT_{CPU}}{dt} at frequency f_{leak} trigger
  random thermal noise injection.
physics:
  engine: thermal_lag_ode
  baseline_value: 68.5
  min_value: -50.0
  max_value: 400.0
  noise_sigma: 0.15
  unit: degC
registers:
  holding_registers:
    40381:
      name: s039_cpu_heat_sink_thermal_gradient_sensor_pv
      type: float32
      scale: 1.0
      unit: degC
    40383:
      name: s039_cpu_heat_sink_thermal_gradient_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
