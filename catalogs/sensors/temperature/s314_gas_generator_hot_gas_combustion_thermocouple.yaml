sensor_id: s314_gas_generator_hot_gas_combustion_thermocouple
name: Gas Generator Hot-Gas Combustion Thermocouple
domain_id: 45
domain_title: Launch Vehicle Cryogenic Propulsion & TVC Gimbal Mechanics Sensors
category: TEMPERATURE
target_protocol: MODBUS_TCP
default_port: 15314
interface: High-Temperature R-Type Probe (1{,}200^\circC)
description: 'Gas Generator Hot-Gas Combustion Thermocouple is a specialized Domain
  45 (Launch Vehicle Cryogenic Propulsion & TVC Gimbal Mechanics Sensors) cyber-physical
  monitoring sensor. Interfacing directly via High-Temperature R-Type Probe (1{,}200^\circC),
  it is specifically engineered to mitigate and detect Gas generator temperature spike,
  turbopump turbine blade melting. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Exhaust gas temperature: T_{hot\_gas} <= 900^\circC;
  temperature spike commands immediate oxidizer valve trim.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Gas generator temperature spike, turbopump turbine blade melting
core_invariant: 'Exhaust gas temperature: T_{hot\_gas} <= 900^\circC; temperature
  spike commands immediate oxidizer valve trim.'
physics:
  engine: thermal_lag_ode
  baseline_value: 68.5
  min_value: -50.0
  max_value: 400.0
  noise_sigma: 0.15
  unit: degC
registers:
  holding_registers:
    40491:
      name: s314_gas_generator_hot_gas_combustion_thermocouple_pv
      type: float32
      scale: 1.0
      unit: degC
    40493:
      name: s314_gas_generator_hot_gas_combustion_thermocouple_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s314_gas_generator_hot_gas_combustion_thermocouple_fault
  action: linear_ramp
  value: 15.0
  description: 'Injects anomaly: Gas generator temperature spike, turbopump turbine
    blade melting'
