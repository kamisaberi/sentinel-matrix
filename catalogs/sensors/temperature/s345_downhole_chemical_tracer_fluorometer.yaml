sensor_id: s345_downhole_chemical_tracer_fluorometer
name: Downhole Chemical Tracer Fluorometer
domain_id: 49
domain_title: Enhanced Geothermal Systems (EGS) & Hydraulic Fracture Sensors
category: TEMPERATURE
target_protocol: MODBUS_TCP
default_port: 15345
interface: Sapphire Window Optical Fluorometer
description: 'Downhole Chemical Tracer Fluorometer is a specialized Domain 49 (Enhanced
  Geothermal Systems (EGS) & Hydraulic Fracture Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Sapphire Window Optical Fluorometer, it is specifically
  engineered to mitigate and detect Thermal short-circuiting between injection and
  production wells. In the Aryorithm edge architecture, it continuously asserts the
  operational invariant: Tracer concentration curve C(t); breakthrough time indicates
  direct fracture channeling, triggering injection diversion.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Thermal short-circuiting between injection and production wells
core_invariant: Tracer concentration curve C(t); breakthrough time indicates direct
  fracture channeling, triggering injection diversion.
physics:
  engine: thermal_lag_ode
  baseline_value: 68.5
  min_value: -50.0
  max_value: 400.0
  noise_sigma: 0.15
  unit: degC
registers:
  holding_registers:
    40291:
      name: s345_downhole_chemical_tracer_fluorometer_pv
      type: float32
      scale: 1.0
      unit: degC
    40293:
      name: s345_downhole_chemical_tracer_fluorometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s345_downhole_chemical_tracer_fluorometer_fault
  action: linear_ramp
  value: 15.0
  description: 'Injects anomaly: Thermal short-circuiting between injection and production
    wells'
