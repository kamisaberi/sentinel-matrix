sensor_id: s141_solid_rocket_motor_srm_o_ring_joint_thermal_sensor
name: Solid Rocket Motor (SRM) O-Ring Joint Thermal Sensor
domain_id: 20
domain_title: Combustion, Turbomachinery & Rocket Propulsion Sensors
category: PROPULSION
target_protocol: MODBUS_TCP
default_port: 15141
interface: Thin-Film Fiber Bragg Grating (FBG)
description: "Solid Rocket Motor (SRM) O-Ring Joint Thermal Sensor is a specialized\
  \ Domain 20 (Combustion, Turbomachinery & Rocket Propulsion Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Thin-Film Fiber Bragg Grating (FBG),\
  \ it is specifically engineered to mitigate and detect Joint O-ring erosion, hot\
  \ gas blow-by (Challenger disaster scenario). In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Temperature jump \u0394 T >\
  \ 200^\\circC across casing joint insulation triggers flight termination system\
  \ or thrust termination vents.. Any divergence between commanded network state and\
  \ this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Joint O-ring erosion, hot gas blow-by (Challenger disaster scenario)
core_invariant: "Temperature jump \u0394 T > 200^\\circC across casing joint insulation\
  \ triggers flight termination system or thrust termination vents."
physics:
  engine: combustion_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: bar
registers:
  holding_registers:
    40371:
      name: s141_solid_rocket_motor_srm_o_ring_joint_thermal_sensor_pv
      type: float32
      scale: 1.0
      unit: bar
    40373:
      name: s141_solid_rocket_motor_srm_o_ring_joint_thermal_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s141_solid_rocket_motor_srm_o_ring_joint_thermal_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Joint O-ring erosion, hot gas blow-by (Challenger
    disaster scenario)'
