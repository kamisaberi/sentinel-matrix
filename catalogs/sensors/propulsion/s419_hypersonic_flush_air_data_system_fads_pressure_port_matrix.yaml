sensor_id: s419_hypersonic_flush_air_data_system_fads_pressure_port_matrix
name: Hypersonic Flush Air Data System (FADS) Pressure Port Matrix
domain_id: 59
domain_title: Hypersonic Scramjet Propulsion & Supersonic Combustion Sensors
category: PROPULSION
target_protocol: MODBUS_TCP
default_port: 15419
interface: 9-Hole Matrix Piezoresistive System
description: "Hypersonic Flush Air Data System (FADS) Pressure Port Matrix is a specialized\
  \ Domain 59 (Hypersonic Scramjet Propulsion & Supersonic Combustion Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via 9-Hole Matrix Piezoresistive System,\
  \ it is specifically engineered to mitigate and detect Mach number falsification,\
  \ angle-of-attack error during scramjet burn. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Surface pressure distribution\
  \ inversion: P_i = q_\u2208fty [1 - \\frac{9}{4}\\sin^2\\theta_i]; extracts flight\
  \ Mach number M_\u2208fty and dynamic pressure q_\u2208fty.. Any divergence between\
  \ commanded network state and this physical reading triggers sub-microsecond in-kernel\
  \ eBPF packet mitigation."
target_threat: Mach number falsification, angle-of-attack error during scramjet burn
core_invariant: "Surface pressure distribution inversion: P_i = q_\u2208fty [1 - \\\
  frac{9}{4}\\sin^2\\theta_i]; extracts flight Mach number M_\u2208fty and dynamic\
  \ pressure q_\u2208fty."
physics:
  engine: combustion_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: bar
registers:
  holding_registers:
    40451:
      name: s419_hypersonic_flush_air_data_system_fads_pressure_port_matrix_pv
      type: float32
      scale: 1.0
      unit: bar
    40453:
      name: s419_hypersonic_flush_air_data_system_fads_pressure_port_matrix_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s419_hypersonic_flush_air_data_system_fads_pressure_port_matrix_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Mach number falsification, angle-of-attack error
    during scramjet burn'
