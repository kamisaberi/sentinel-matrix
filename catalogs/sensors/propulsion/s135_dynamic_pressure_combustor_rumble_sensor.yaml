sensor_id: s135_dynamic_pressure_combustor_rumble_sensor
name: Dynamic Pressure Combustor Rumble Sensor
domain_id: 20
domain_title: Combustion, Turbomachinery & Rocket Propulsion Sensors
category: PROPULSION
target_protocol: MODBUS_TCP
default_port: 15135
interface: Water-Cooled Piezoelectric Gauge
description: "Dynamic Pressure Combustor Rumble Sensor is a specialized Domain 20\
  \ (Combustion, Turbomachinery & Rocket Propulsion Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via Water-Cooled Piezoelectric Gauge, it is specifically\
  \ engineered to mitigate and detect Thermoacoustic combustion instability (flame\
  \ rumble), turbine blowout. In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Rayleigh criterion: \u2208t p'(t) q'(t) dt\
  \ > 0; pressure oscillation amplitude p' > 0.5\\,bar at 100--400\\,Hz forces fuel-trim\
  \ in < 5\\,ms.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Thermoacoustic combustion instability (flame rumble), turbine blowout
core_invariant: "Rayleigh criterion: \u2208t p'(t) q'(t) dt > 0; pressure oscillation\
  \ amplitude p' > 0.5\\,bar at 100--400\\,Hz forces fuel-trim in < 5\\,ms."
physics:
  engine: combustion_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: bar
registers:
  holding_registers:
    40311:
      name: s135_dynamic_pressure_combustor_rumble_sensor_pv
      type: float32
      scale: 1.0
      unit: bar
    40313:
      name: s135_dynamic_pressure_combustor_rumble_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s135_dynamic_pressure_combustor_rumble_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Thermoacoustic combustion instability (flame rumble),
    turbine blowout'
