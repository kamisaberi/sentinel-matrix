sensor_id: s413_scramjet_isolator_shock_train_static_pressure_tap_rake
name: Scramjet Isolator Shock-Train Static Pressure Tap Rake
domain_id: 59
domain_title: Hypersonic Scramjet Propulsion & Supersonic Combustion Sensors
category: PROPULSION
target_protocol: MODBUS_TCP
default_port: 15413
interface: High-Frequency Piezoresistive Array (100 kHz)
description: 'Scramjet Isolator Shock-Train Static Pressure Tap Rake is a specialized
  Domain 59 (Hypersonic Scramjet Propulsion & Supersonic Combustion Sensors) cyber-physical
  monitoring sensor. Interfacing directly via High-Frequency Piezoresistive Array
  (100 kHz), it is specifically engineered to mitigate and detect Scramjet inlet unstart:
  shock train expelled out the front, loss of thrust. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Shock train position x_{shock}
  must remain inside the isolator: x_{inlet\_cowl} < x_{shock} < x_{combustor}; unstart
  precursor commands fuel dump in < 2\,ms.. Any divergence between commanded network
  state and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: 'Scramjet inlet unstart: shock train expelled out the front, loss of
  thrust'
core_invariant: 'Shock train position x_{shock} must remain inside the isolator: x_{inlet\_cowl}
  < x_{shock} < x_{combustor}; unstart precursor commands fuel dump in < 2\,ms.'
physics:
  engine: combustion_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: bar
registers:
  holding_registers:
    40391:
      name: s413_scramjet_isolator_shock_train_static_pressure_tap_rake_pv
      type: float32
      scale: 1.0
      unit: bar
    40393:
      name: s413_scramjet_isolator_shock_train_static_pressure_tap_rake_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s413_scramjet_isolator_shock_train_static_pressure_tap_rake_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Scramjet inlet unstart: shock train expelled out
    the front, loss of thrust'
