sensor_id: s136_dual_wavelength_flame_scanner_uv_ir
name: Dual-Wavelength Flame Scanner (UV/IR)
domain_id: 20
domain_title: Combustion, Turbomachinery & Rocket Propulsion Sensors
category: PROPULSION
target_protocol: MODBUS_TCP
default_port: 15136
interface: Dual-Spectral Solid-State Detector
description: 'Dual-Wavelength Flame Scanner (UV/IR) is a specialized Domain 20 (Combustion,
  Turbomachinery & Rocket Propulsion Sensors) cyber-physical monitoring sensor. Interfacing
  directly via Dual-Spectral Solid-State Detector, it is specifically engineered to
  mitigate and detect Industrial boiler flameout, fuel-rich explosive re-ignition
  puffing. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Cross-correlates UV flicker (200--300\,nm) with IR combustion glow; flame
  extinction cuts main fuel safety shutoff valve in < 50\,ms.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Industrial boiler flameout, fuel-rich explosive re-ignition puffing
core_invariant: Cross-correlates UV flicker (200--300\,nm) with IR combustion glow;
  flame extinction cuts main fuel safety shutoff valve in < 50\,ms.
physics:
  engine: combustion_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: bar
registers:
  holding_registers:
    40321:
      name: s136_dual_wavelength_flame_scanner_uv_ir_pv
      type: float32
      scale: 1.0
      unit: bar
    40323:
      name: s136_dual_wavelength_flame_scanner_uv_ir_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s136_dual_wavelength_flame_scanner_uv_ir_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Industrial boiler flameout, fuel-rich explosive re-ignition
    puffing'
