sensor_id: s517_landing_leg_over_center_collet_lock_proximity_sensor
name: Landing Leg Over-Center Collet Lock Proximity Sensor
domain_id: 73
domain_title: Reusable Rocket Booster Aerogrid Fins & Landing Mechanics Sensors
category: PROPULSION
target_protocol: MODBUS_TCP
