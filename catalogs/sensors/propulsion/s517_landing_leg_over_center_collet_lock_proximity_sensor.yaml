interface: Dual Magnetically-Coded Hermetic Switch
description: 'Landing Leg Over-Center Collet Lock Proximity Sensor is a specialized
  Domain 73 (Reusable Rocket Booster Aerogrid Fins & Landing Mechanics Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Dual Magnetically-Coded Hermetic Switch,
  it is specifically engineered to mitigate and detect Incomplete landing leg deployment,
  booster toppling upon touchdown. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Mechanical over-center lock verified on all 4
  legs: S_{leg\_lock} == LOCKED; incomplete lock commands terminal landing divert..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Incomplete landing leg deployment, booster toppling upon touchdown
core_invariant: 'Mechanical over-center lock verified on all 4 legs: S_{leg\_lock}
  == LOCKED; incomplete lock commands terminal landing divert.'
physics:
  engine: combustion_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: bar
registers:
  holding_registers:
    40401:
      name: s517_landing_leg_over_center_collet_lock_proximity_sensor_pv
      type: float32
      scale: 1.0
      unit: bar
    40403:
      name: s517_landing_leg_over_center_collet_lock_proximity_sensor_status
