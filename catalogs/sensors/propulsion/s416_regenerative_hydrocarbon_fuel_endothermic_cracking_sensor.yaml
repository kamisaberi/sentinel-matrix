sensor_id: s416_regenerative_hydrocarbon_fuel_endothermic_cracking_sensor
name: Regenerative Hydrocarbon Fuel Endothermic Cracking Sensor
domain_id: 59
domain_title: Hypersonic Scramjet Propulsion & Supersonic Combustion Sensors
category: PROPULSION
target_protocol: MODBUS_TCP
default_port: 15416
interface: High-Pressure Differential Cell (100\,bar)
description: "Regenerative Hydrocarbon Fuel Endothermic Cracking Sensor is a specialized\
  \ Domain 59 (Hypersonic Scramjet Propulsion & Supersonic Combustion Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via High-Pressure Differential Cell (100\\\
  ,bar), it is specifically engineered to mitigate and detect Coking inside cooling\
  \ channels, scramjet combustion chamber melt-through. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Fuel pressure drop: \u0394\
  \ P_{coolant} <= \u0394 P_{coking\\_limit}; pressure drop spike indicates thermal\
  \ cracking blockage, throttling engine fuel.. Any divergence between commanded network\
  \ state and this physical reading triggers sub-microsecond in-kernel eBPF packet\
  \ mitigation."
target_threat: Coking inside cooling channels, scramjet combustion chamber melt-through
core_invariant: "Fuel pressure drop: \u0394 P_{coolant} <= \u0394 P_{coking\\_limit};\
  \ pressure drop spike indicates thermal cracking blockage, throttling engine fuel."
physics:
  engine: combustion_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: bar
registers:
  holding_registers:
    40421:
      name: s416_regenerative_hydrocarbon_fuel_endothermic_cracking_sensor_pv
      type: float32
      scale: 1.0
      unit: bar
    40423:
      name: s416_regenerative_hydrocarbon_fuel_endothermic_cracking_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s416_regenerative_hydrocarbon_fuel_endothermic_cracking_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Coking inside cooling channels, scramjet combustion
    chamber melt-through'
