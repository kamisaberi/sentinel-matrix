sensor_id: s140_turbopump_inducer_cavitation_acoustic_hydrophone
name: Turbopump Inducer Cavitation Acoustic Hydrophone
domain_id: 20
domain_title: Combustion, Turbomachinery & Rocket Propulsion Sensors
category: PROPULSION
target_protocol: MODBUS_TCP
default_port: 15140
interface: Cryogenic Hydrophone in LOX Manifold
description: 'Turbopump Inducer Cavitation Acoustic Hydrophone is a specialized Domain
  20 (Combustion, Turbomachinery & Rocket Propulsion Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Cryogenic Hydrophone in LOX Manifold, it is specifically
  engineered to mitigate and detect Rocket turbopump cavitation vapor lock, liquid
  oxygen impeller destruction. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Ultrasonic acoustic cavitation energy (50--200\,kHz)
  exceeding threshold trims inlet valve pressure before cavitation choke occurs..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Rocket turbopump cavitation vapor lock, liquid oxygen impeller destruction
core_invariant: Ultrasonic acoustic cavitation energy (50--200\,kHz) exceeding threshold
  trims inlet valve pressure before cavitation choke occurs.
physics:
  engine: combustion_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: bar
registers:
  holding_registers:
    40361:
      name: s140_turbopump_inducer_cavitation_acoustic_hydrophone_pv
      type: float32
      scale: 1.0
      unit: bar
    40363:
      name: s140_turbopump_inducer_cavitation_acoustic_hydrophone_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s140_turbopump_inducer_cavitation_acoustic_hydrophone_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Rocket turbopump cavitation vapor lock, liquid oxygen
    impeller destruction'
