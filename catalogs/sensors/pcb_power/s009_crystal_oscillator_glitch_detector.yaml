sensor_id: s009_crystal_oscillator_glitch_detector
name: Crystal Oscillator Glitch Detector
domain_id: 2
domain_title: PCB, Power-Rail & Hardware Fault-Injection Sensors
category: PCB_POWER
target_protocol: MODBUS_TCP
default_port: 15009
interface: High-Frequency Ring Oscillator
description: 'Crystal Oscillator Glitch Detector is a specialized Domain 02 (PCB,
  Power-Rail & Hardware Fault-Injection Sensors) cyber-physical monitoring sensor.
  Interfacing directly via High-Frequency Ring Oscillator, it is specifically engineered
  to mitigate and detect Clock glitching, forcing instructions to skip execution.
  In the Aryorithm edge architecture, it continuously asserts the operational invariant:
  Detects duty-cycle distortion (> 55/45\%) on the external quartz crystal line..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Clock glitching, forcing instructions to skip execution
core_invariant: Detects duty-cycle distortion (> 55/45\%) on the external quartz crystal
  line.
physics:
  engine: pcb_power_glitch
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: mV
registers:
  holding_registers:
    40081:
      name: s009_crystal_oscillator_glitch_detector_pv
      type: float32
      scale: 1.0
      unit: mV
    40083:
      name: s009_crystal_oscillator_glitch_detector_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s009_crystal_oscillator_glitch_detector_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Clock glitching, forcing instructions to skip execution'
