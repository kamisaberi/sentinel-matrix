sensor_id: s002_last_level_cache_llc_miss_rate_sensor
name: Last-Level Cache (LLC) Miss Rate Sensor
domain_id: 1
domain_title: Microarchitectural, CPU & Memory Sensors (Host Hardware Security)
category: MICROARCH
target_protocol: PMU_PERF
default_port: 15002
interface: Hardware PMU Counter
description: 'Last-Level Cache (LLC) Miss Rate Sensor is a specialized Domain 01 (Microarchitectural,
  CPU & Memory Sensors (Host Hardware Security)) cyber-physical monitoring sensor.
  Interfacing directly via Hardware PMU Counter, it is specifically engineered to
  mitigate and detect Spectre, Meltdown, Flush+Reload cache timing attacks. In the
  Aryorithm edge architecture, it continuously asserts the operational invariant:
  LLC Miss Rate < 3.5\%; anomalous burst of misses indicates cache-line probing..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Spectre, Meltdown, Flush+Reload cache timing attacks
core_invariant: LLC Miss Rate < 3.5\%; anomalous burst of misses indicates cache-line
  probing.
physics:
  engine: pmu_microarch
  baseline_value: 1.2
  min_value: 0.1
  max_value: 4.0
  noise_sigma: 0.05
  unit: IPC
registers:
  holding_registers:
    40011:
      name: s002_last_level_cache_llc_miss_rate_sensor_pv
      type: float32
      scale: 1.0
      unit: IPC
    40013:
      name: s002_last_level_cache_llc_miss_rate_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s002_last_level_cache_llc_miss_rate_sensor_fault
  action: step_decrease
  value: -0.8
  description: 'Injects anomaly: Spectre, Meltdown, Flush+Reload cache timing attacks'
