sensor_id: s004_dram_bank_activation_rowhammer_sensor
name: DRAM Bank Activation / Rowhammer Sensor
domain_id: 1
domain_title: Microarchitectural, CPU & Memory Sensors (Host Hardware Security)
category: MICROARCH
target_protocol: PMU_PERF
default_port: 15004
interface: Memory Controller PMU / eBPF
description: "DRAM Bank Activation / Rowhammer Sensor is a specialized Domain 01 (Microarchitectural,\
  \ CPU & Memory Sensors (Host Hardware Security)) cyber-physical monitoring sensor.\
  \ Interfacing directly via Memory Controller PMU / eBPF, it is specifically engineered\
  \ to mitigate and detect ZenHammer, Rowhammer physical bit-flip privilege escalation.\
  \ In the Aryorithm edge architecture, it continuously asserts the operational invariant:\
  \ Bank activation frequency \u0394 t_{act} < 64\\,ns targeting identical row addresses..\
  \ Any divergence between commanded network state and this physical reading triggers\
  \ sub-microsecond in-kernel eBPF packet mitigation."
target_threat: ZenHammer, Rowhammer physical bit-flip privilege escalation
core_invariant: "Bank activation frequency \u0394 t_{act} < 64\\,ns targeting identical\
  \ row addresses."
physics:
  engine: pmu_microarch
  baseline_value: 1.2
  min_value: 0.1
  max_value: 4.0
  noise_sigma: 0.05
  unit: IPC
registers:
  holding_registers:
    40031:
      name: s004_dram_bank_activation_rowhammer_sensor_pv
      type: float32
      scale: 1.0
      unit: IPC
    40033:
      name: s004_dram_bank_activation_rowhammer_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s004_dram_bank_activation_rowhammer_sensor_fault
  action: step_decrease
  value: -0.8
  description: 'Injects anomaly: ZenHammer, Rowhammer physical bit-flip privilege
    escalation'
