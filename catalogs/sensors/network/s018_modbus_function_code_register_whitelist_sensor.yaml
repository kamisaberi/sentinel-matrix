description: 'Modbus Function Code / Register Whitelist Sensor is a specialized Domain
  03 (Wire-Speed Network & Protocol Telemetry Sensors) cyber-physical monitoring sensor.
  Interfacing directly via eBPF Dissector (`xdp_drop.c`), it is specifically engineered
  to mitigate and detect Unauthorized PLC coil writes (FC 0x05, 0x06, 0x0F, 0x10).
  In the Aryorithm edge architecture, it continuously asserts the operational invariant:
  Drops writes originating from non-engineering workstation IPs in < 120\,ns.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Unauthorized PLC coil writes (FC 0x05, 0x06, 0x0F, 0x10)
core_invariant: Drops writes originating from non-engineering workstation IPs in <
  120\,ns.
