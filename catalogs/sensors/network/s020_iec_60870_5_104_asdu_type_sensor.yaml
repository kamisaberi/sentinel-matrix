sensor_id: s020_iec_60870_5_104_asdu_type_sensor
name: IEC 60870-5-104 ASDU Type Sensor
domain_id: 3
domain_title: Wire-Speed Network & Protocol Telemetry Sensors
category: NETWORK
target_protocol: UDP_STREAM
default_port: 15020
interface: eBPF Dissector
description: 'IEC 60870-5-104 ASDU Type Sensor is a specialized Domain 03 (Wire-Speed
  Network & Protocol Telemetry Sensors) cyber-physical monitoring sensor. Interfacing
  directly via eBPF Dissector, it is specifically engineered to mitigate and detect
  Grid tele-control command injection, circuit breaker trip. In the Aryorithm edge
  architecture, it continuously asserts the operational invariant: Enforces Cause-of-Transmission
  (COT) and valid ASDU command ranges.. Any divergence between commanded network state
  and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Grid tele-control command injection, circuit breaker trip
core_invariant: Enforces Cause-of-Transmission (COT) and valid ASDU command ranges.
physics:
  engine: network_ebpf
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: packets
registers:
  holding_registers:
    40191:
      name: s020_iec_60870_5_104_asdu_type_sensor_pv
      type: float32
      scale: 1.0
      unit: packets
    40193:
      name: s020_iec_60870_5_104_asdu_type_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s020_iec_60870_5_104_asdu_type_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Grid tele-control command injection, circuit breaker
    trip'
