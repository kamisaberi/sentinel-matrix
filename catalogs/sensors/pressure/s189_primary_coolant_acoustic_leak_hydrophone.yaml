sensor_id: s189_primary_coolant_acoustic_leak_hydrophone
name: Primary Coolant Acoustic Leak Hydrophone
domain_id: 27
domain_title: Nuclear Reactor Core Hydrodynamics & Two-Phase Voiding Sensors
category: PRESSURE
target_protocol: MODBUS_TCP
default_port: 15189
interface: High-Temperature Waveguide Sensor
description: 'Primary Coolant Acoustic Leak Hydrophone is a specialized Domain 27
  (Nuclear Reactor Core Hydrodynamics & Two-Phase Voiding Sensors) cyber-physical
  monitoring sensor. Interfacing directly via High-Temperature Waveguide Sensor, it
  is specifically engineered to mitigate and detect Reactor primary loop micro-crack
  breach, Loss-of-Coolant Accident (LOCA). In the Aryorithm edge architecture, it
  continuously asserts the operational invariant: Acoustic emission energy (100--400\,kHz)
  generated by high-pressure (155\,bar) water flashing to steam; detects leaks < 1\,liter/min..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Reactor primary loop micro-crack breach, Loss-of-Coolant Accident (LOCA)
core_invariant: Acoustic emission energy (100--400\,kHz) generated by high-pressure
  (155\,bar) water flashing to steam; detects leaks < 1\,liter/min.
physics:
  engine: fluid_pressure_ode
  baseline_value: 6.2
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.04
  unit: bar
registers:
  holding_registers:
    40331:
      name: s189_primary_coolant_acoustic_leak_hydrophone_pv
      type: float32
      scale: 1.0
      unit: bar
    40333:
      name: s189_primary_coolant_acoustic_leak_hydrophone_status
