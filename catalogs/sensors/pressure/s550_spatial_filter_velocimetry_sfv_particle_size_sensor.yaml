sensor_id: s550_spatial_filter_velocimetry_sfv_particle_size_sensor
name: Spatial Filter Velocimetry (SFV) Particle Size Sensor
domain_id: 78
domain_title: Pharmaceutical Continuous Twin-Screw Wet Granulation & Fluid Bed Sensors
category: PRESSURE
