sensor_id: s074_hall_effect_high_current_transducer
name: Hall-Effect High-Current Transducer
domain_id: 11
domain_title: Magnetic, Fluxgate & Magnetohydrodynamic (MHD) Sensors
category: PRESSURE
target_protocol: MODBUS_TCP
default_port: 15074
interface: "Isolated Analog Voltage (\xB1 10V)"
description: "Hall-Effect High-Current Transducer is a specialized Domain 11 (Magnetic,\
  \ Fluxgate & Magnetohydrodynamic (MHD) Sensors) cyber-physical monitoring sensor.\
  \ Interfacing directly via Isolated Analog Voltage (\xB1 10V), it is specifically\
  \ engineered to mitigate and detect DC electric arc-furnace overcurrent, rail traction\
  \ motor flashover. In the Aryorithm edge architecture, it continuously asserts the\
  \ operational invariant: Linearity verification across 0 to 50{,}000\\,A; detects\
  \ sudden saturation plateaus caused by short-circuit faults.. Any divergence between\
  \ commanded network state and this physical reading triggers sub-microsecond in-kernel\
  \ eBPF packet mitigation."
target_threat: DC electric arc-furnace overcurrent, rail traction motor flashover
core_invariant: Linearity verification across 0 to 50{,}000\,A; detects sudden saturation
  plateaus caused by short-circuit faults.
physics:
  engine: fluid_pressure_ode
  baseline_value: 6.2
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.04
  unit: bar
registers:
  holding_registers:
    40231:
      name: s074_hall_effect_high_current_transducer_pv
      type: float32
      scale: 1.0
      unit: bar
    40233:
      name: s074_hall_effect_high_current_transducer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s074_hall_effect_high_current_transducer_fault
  action: step_increase
  value: 8.5
  description: 'Injects anomaly: DC electric arc-furnace overcurrent, rail traction
    motor flashover'
