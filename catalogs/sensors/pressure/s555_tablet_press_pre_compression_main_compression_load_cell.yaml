sensor_id: s555_tablet_press_pre_compression_main_compression_load_cell
name: Tablet Press Pre-Compression & Main Compression Load Cell
domain_id: 78
domain_title: Pharmaceutical Continuous Twin-Screw Wet Granulation & Fluid Bed Sensors
category: PRESSURE
target_protocol: MODBUS_TCP
default_port: 15555
interface: Strain-Gauge Instrumented Compression Roller
description: "Tablet Press Pre-Compression & Main Compression Load Cell is a specialized\
  \ Domain 78 (Pharmaceutical Continuous Twin-Screw Wet Granulation & Fluid Bed Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via Strain-Gauge Instrumented\
  \ Compression Roller, it is specifically engineered to mitigate and detect Tablet\
  \ hardness failure, capping, tool punch overloading. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Compression force: F_{main}\
  \ = 15.0\\,kN \xB1 1.0\\,kN; force anomaly auto-rejects individual out-of-spec tablets\
  \ via fast air-jet.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Tablet hardness failure, capping, tool punch overloading
core_invariant: "Compression force: F_{main} = 15.0\\,kN \xB1 1.0\\,kN; force anomaly\
  \ auto-rejects individual out-of-spec tablets via fast air-jet."
physics:
  engine: fluid_pressure_ode
  baseline_value: 6.2
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.04
  unit: bar
registers:
  holding_registers:
    40231:
      name: s555_tablet_press_pre_compression_main_compression_load_cell_pv
      type: float32
      scale: 1.0
      unit: bar
    40233:
      name: s555_tablet_press_pre_compression_main_compression_load_cell_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s555_tablet_press_pre_compression_main_compression_load_cell_fault
  action: step_increase
  value: 8.5
  description: 'Injects anomaly: Tablet hardness failure, capping, tool punch overloading'
