sensor_id: s553_exhaust_filter_bag_differential_pressure_tear_sensor
name: Exhaust Filter Bag Differential Pressure Tear Sensor
domain_id: 78
domain_title: Pharmaceutical Continuous Twin-Screw Wet Granulation & Fluid Bed Sensors
category: PRESSURE
target_protocol: MODBUS_TCP
default_port: 15553
interface: Fast Differential Piezoresistive Cell
description: "Exhaust Filter Bag Differential Pressure Tear Sensor is a specialized\
  \ Domain 78 (Pharmaceutical Continuous Twin-Screw Wet Granulation & Fluid Bed Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via Fast Differential Piezoresistive\
  \ Cell, it is specifically engineered to mitigate and detect HEPA filter bag tearing,\
  \ toxic Active Pharmaceutical Ingredient (API) escape. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Filter pressure drop: \u0394\
  \ P_{filter} >= 500\\,Pa; sudden drop (< 100\\,Pa) indicates filter bag rupture,\
  \ isolating exhaust dampers.. Any divergence between commanded network state and\
  \ this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: HEPA filter bag tearing, toxic Active Pharmaceutical Ingredient (API)
  escape
core_invariant: "Filter pressure drop: \u0394 P_{filter} >= 500\\,Pa; sudden drop\
  \ (< 100\\,Pa) indicates filter bag rupture, isolating exhaust dampers."
physics:
  engine: fluid_pressure_ode
  baseline_value: 6.2
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.04
  unit: bar
registers:
  holding_registers:
    40211:
      name: s553_exhaust_filter_bag_differential_pressure_tear_sensor_pv
      type: float32
      scale: 1.0
      unit: bar
    40213:
      name: s553_exhaust_filter_bag_differential_pressure_tear_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s553_exhaust_filter_bag_differential_pressure_tear_sensor_fault
  action: step_increase
  value: 8.5
  description: 'Injects anomaly: HEPA filter bag tearing, toxic Active Pharmaceutical
    Ingredient (API) escape'
