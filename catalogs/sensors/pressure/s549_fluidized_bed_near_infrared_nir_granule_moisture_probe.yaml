sensor_id: s549_fluidized_bed_near_infrared_nir_granule_moisture_probe
name: Fluidized Bed Near-Infrared (NIR) Granule Moisture Probe
domain_id: 78
domain_title: Pharmaceutical Continuous Twin-Screw Wet Granulation & Fluid Bed Sensors
category: PRESSURE
target_protocol: MODBUS_TCP
default_port: 15549
interface: Fiber-Optic Diffuse Reflectance Sensor
description: "Fluidized Bed Near-Infrared (NIR) Granule Moisture Probe is a specialized\
  \ Domain 78 (Pharmaceutical Continuous Twin-Screw Wet Granulation & Fluid Bed Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via Fiber-Optic Diffuse\
  \ Reflectance Sensor, it is specifically engineered to mitigate and detect Granule\
  \ over-wetting (mass caking) or over-drying (powder dusting). In the Aryorithm edge\
  \ architecture, it continuously asserts the operational invariant: Absorbance ratio:\
  \ A_{1940nm} / A_{1680nm} \u221D Loss on Drying (LOD)\\%; endpoint moisture must\
  \ achieve: LOD = 2.0\\% \xB1 0.2\\%.. Any divergence between commanded network state\
  \ and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Granule over-wetting (mass caking) or over-drying (powder dusting)
core_invariant: "Absorbance ratio: A_{1940nm} / A_{1680nm} \u221D Loss on Drying (LOD)\\\
  %; endpoint moisture must achieve: LOD = 2.0\\% \xB1 0.2\\%."
physics:
  engine: fluid_pressure_ode
  baseline_value: 6.2
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.04
  unit: bar
registers:
  holding_registers:
    40171:
      name: s549_fluidized_bed_near_infrared_nir_granule_moisture_probe_pv
      type: float32
      scale: 1.0
      unit: bar
    40173:
      name: s549_fluidized_bed_near_infrared_nir_granule_moisture_probe_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s549_fluidized_bed_near_infrared_nir_granule_moisture_probe_fault
  action: step_increase
  value: 8.5
  description: 'Injects anomaly: Granule over-wetting (mass caking) or over-drying
    (powder dusting)'
