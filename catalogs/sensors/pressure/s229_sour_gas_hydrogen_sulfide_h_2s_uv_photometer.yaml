sensor_id: s229_sour_gas_hydrogen_sulfide_h_2s_uv_photometer
name: Sour Gas Hydrogen Sulfide (H_2S) UV Photometer
domain_id: 33
domain_title: Petrochemical Refining & Fluid Catalytic Cracking (FCC) Sensors
category: PRESSURE
