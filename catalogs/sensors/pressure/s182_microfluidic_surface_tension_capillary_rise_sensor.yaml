sensor_id: s182_microfluidic_surface_tension_capillary_rise_sensor
name: Microfluidic Surface Tension / Capillary Rise Sensor
domain_id: 26
domain_title: Microfluidic, Lab-on-a-Chip & DNA Synthesis Biosecurity Sensors
category: PRESSURE
target_protocol: MODBUS_TCP
default_port: 15182
interface: Optical Meniscus Tracking Diode
description: "Microfluidic Surface Tension / Capillary Rise Sensor is a specialized\
  \ Domain 26 (Microfluidic, Lab-on-a-Chip & DNA Synthesis Biosecurity Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Optical Meniscus Tracking Diode, it\
  \ is specifically engineered to mitigate and detect Toxic surfactant injection,\
  \ microfluidic lab-on-chip passive valve bypass. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Young-Laplace capillary pressure:\
  \ \u0394 P = \\frac{2\\gamma \\cos\\theta}{r}; sudden surface tension drop indicates\
  \ solvent contamination or unauthorized detergent addition.. Any divergence between\
  \ commanded network state and this physical reading triggers sub-microsecond in-kernel\
  \ eBPF packet mitigation."
target_threat: Toxic surfactant injection, microfluidic lab-on-chip passive valve
  bypass
core_invariant: "Young-Laplace capillary pressure: \u0394 P = \\frac{2\\gamma \\cos\\\
  theta}{r}; sudden surface tension drop indicates solvent contamination or unauthorized\
  \ detergent addition."
physics:
  engine: fluid_pressure_ode
  baseline_value: 6.2
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.04
  unit: bar
registers:
  holding_registers:
    40261:
      name: s182_microfluidic_surface_tension_capillary_rise_sensor_pv
      type: float32
      scale: 1.0
      unit: bar
    40263:
      name: s182_microfluidic_surface_tension_capillary_rise_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s182_microfluidic_surface_tension_capillary_rise_sensor_fault
  action: step_increase
  value: 8.5
  description: 'Injects anomaly: Toxic surfactant injection, microfluidic lab-on-chip
    passive valve bypass'
