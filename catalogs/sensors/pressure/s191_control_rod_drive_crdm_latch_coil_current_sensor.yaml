description: 'Control Rod Drive (CRDM) Latch Coil Current Sensor is a specialized
  Domain 27 (Nuclear Reactor Core Hydrodynamics & Two-Phase Voiding Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Hall-Effect Current Shunt on Magnet
  Coils, it is specifically engineered to mitigate and detect Control rod drop hesitation,
  electromagnetic gripper sabotage. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Coil de-energization current decay curve: I(t)
  = I_0 e^{-t/\tau}; decay time constant \tau > 15\,ms indicates inductive jamming
  or mechanical latch seizure.. Any divergence between commanded network state and
  this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Control rod drop hesitation, electromagnetic gripper sabotage
core_invariant: 'Coil de-energization current decay curve: I(t) = I_0 e^{-t/\tau};
  decay time constant \tau > 15\,ms indicates inductive jamming or mechanical latch
  seizure.'
