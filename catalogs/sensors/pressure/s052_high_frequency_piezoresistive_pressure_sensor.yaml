sensor_id: s052_high_frequency_piezoresistive_pressure_sensor
name: High-Frequency Piezoresistive Pressure Sensor
domain_id: 9
domain_title: Fluid, Pressure & Hydrodynamic Sensors
category: PRESSURE
target_protocol: MODBUS_TCP
default_port: 15052
interface: 4-20mA / Modbus (10 kHz)
description: "High-Frequency Piezoresistive Pressure Sensor is a specialized Domain\
  \ 09 (Fluid, Pressure & Hydrodynamic Sensors) cyber-physical monitoring sensor.\
  \ Interfacing directly via 4-20mA / Modbus (10 kHz), it is specifically engineered\
  \ to mitigate and detect Water-hammer valve attacks, pipeline hydraulic shockwaves.\
  \ In the Aryorithm edge architecture, it continuously asserts the operational invariant:\
  \ Enforces Joukowsky equation: \u0394 P <= \\rho c \u0394 v; clamps valve speed..\
  \ Any divergence between commanded network state and this physical reading triggers\
  \ sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Water-hammer valve attacks, pipeline hydraulic shockwaves
core_invariant: "Enforces Joukowsky equation: \u0394 P <= \\rho c \u0394 v; clamps\
  \ valve speed."
physics:
  engine: fluid_pressure_ode
  baseline_value: 6.2
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.04
  unit: bar
registers:
  holding_registers:
    40011:
      name: s052_high_frequency_piezoresistive_pressure_sensor_pv
      type: float32
      scale: 1.0
      unit: bar
    40013:
      name: s052_high_frequency_piezoresistive_pressure_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s052_high_frequency_piezoresistive_pressure_sensor_fault
  action: step_increase
  value: 8.5
  description: 'Injects anomaly: Water-hammer valve attacks, pipeline hydraulic shockwaves'
