sensor_id: s053_coriolis_mass_flow_meter
name: Coriolis Mass Flow Meter
domain_id: 9
domain_title: Fluid, Pressure & Hydrodynamic Sensors
category: PRESSURE
target_protocol: MODBUS_TCP
default_port: 15053
interface: HART / Modbus Protocol
description: 'Coriolis Mass Flow Meter is a specialized Domain 09 (Fluid, Pressure
  & Hydrodynamic Sensors) cyber-physical monitoring sensor. Interfacing directly via
  HART / Modbus Protocol, it is specifically engineered to mitigate and detect Custody
  transfer theft, density spoofing, chemical dilution. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Mass flow, fluid density, and
  temperature must obey thermodynamic conservation of mass.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Custody transfer theft, density spoofing, chemical dilution
core_invariant: Mass flow, fluid density, and temperature must obey thermodynamic
  conservation of mass.
physics:
  engine: fluid_pressure_ode
  baseline_value: 6.2
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.04
  unit: bar
registers:
  holding_registers:
    40021:
      name: s053_coriolis_mass_flow_meter_pv
      type: float32
      scale: 1.0
      unit: bar
    40023:
      name: s053_coriolis_mass_flow_meter_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s053_coriolis_mass_flow_meter_fault
  action: step_increase
  value: 8.5
  description: 'Injects anomaly: Custody transfer theft, density spoofing, chemical
    dilution'
