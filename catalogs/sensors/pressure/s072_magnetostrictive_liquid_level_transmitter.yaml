sensor_id: s072_magnetostrictive_liquid_level_transmitter
name: Magnetostrictive Liquid Level Transmitter
domain_id: 11
domain_title: Magnetic, Fluxgate & Magnetohydrodynamic (MHD) Sensors
category: PRESSURE
target_protocol: MODBUS_TCP
default_port: 15072
interface: 4-20mA HART / Modbus
description: "Magnetostrictive Liquid Level Transmitter is a specialized Domain 11\
  \ (Magnetic, Fluxgate & Magnetohydrodynamic (MHD) Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via 4-20mA HART / Modbus, it is specifically engineered\
  \ to mitigate and detect High-precision chemical tank level spoofing, silent siphon\
  \ theft. In the Aryorithm edge architecture, it continuously asserts the operational\
  \ invariant: Float position measured via ultrasonic torsional wave pulse timing\
  \ down a ferromagnetic wire (\xB1 0.5\\,mm resolution).. Any divergence between\
  \ commanded network state and this physical reading triggers sub-microsecond in-kernel\
  \ eBPF packet mitigation."
target_threat: High-precision chemical tank level spoofing, silent siphon theft
core_invariant: "Float position measured via ultrasonic torsional wave pulse timing\
  \ down a ferromagnetic wire (\xB1 0.5\\,mm resolution)."
physics:
  engine: fluid_pressure_ode
  baseline_value: 6.2
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.04
  unit: bar
registers:
  holding_registers:
    40211:
      name: s072_magnetostrictive_liquid_level_transmitter_pv
      type: float32
      scale: 1.0
      unit: bar
    40213:
      name: s072_magnetostrictive_liquid_level_transmitter_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s072_magnetostrictive_liquid_level_transmitter_fault
  action: step_increase
  value: 8.5
  description: 'Injects anomaly: High-precision chemical tank level spoofing, silent
    siphon theft'
