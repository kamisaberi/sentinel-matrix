sensor_id: s207_interharmonic_voltage_current_flicker_transducer
name: Interharmonic Voltage & Current Flicker Transducer
domain_id: 30
domain_title: Electrical Grid Frequency, Power Quality & High-Harmonic Sensors
category: ELECTRICAL
target_protocol: MODBUS_TCP
default_port: 15207
interface: IEC 61000-4-15 Digital Flickermeter
description: 'Interharmonic Voltage & Current Flicker Transducer is a specialized
  Domain 30 (Electrical Grid Frequency, Power Quality & High-Harmonic Sensors) cyber-physical
  monitoring sensor. Interfacing directly via IEC 61000-4-15 Digital Flickermeter,
  it is specifically engineered to mitigate and detect Sub-synchronous torsional interaction
  (SSTI), arc-furnace grid flicker. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Short-term flicker severity: P_{st} = \sqrt{0.0314
  P_{0.1} + 0.0525 P_1 + 0.0657 P_3 + 0.28 P_{10} + 0.08 P_{50}} <= 1.0; prevents
  light flicker and motor overheating.. Any divergence between commanded network state
  and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Sub-synchronous torsional interaction (SSTI), arc-furnace grid flicker
core_invariant: 'Short-term flicker severity: P_{st} = \sqrt{0.0314 P_{0.1} + 0.0525
  P_1 + 0.0657 P_3 + 0.28 P_{10} + 0.08 P_{50}} <= 1.0; prevents light flicker and
  motor overheating.'
physics:
  engine: grid_harmonics
  baseline_value: 230.0
  min_value: 0.0
  max_value: 500.0
  noise_sigma: 0.35
  unit: V
registers:
  holding_registers:
    40491:
      name: s207_interharmonic_voltage_current_flicker_transducer_pv
      type: float32
      scale: 1.0
      unit: V
    40493:
      name: s207_interharmonic_voltage_current_flicker_transducer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s207_interharmonic_voltage_current_flicker_transducer_fault
  action: step_decrease
  value: -45.0
  description: 'Injects anomaly: Sub-synchronous torsional interaction (SSTI), arc-furnace
    grid flicker'
