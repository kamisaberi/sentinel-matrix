sensor_id: s211_ferroresonance_overvoltage_surge_detector
name: Ferroresonance Overvoltage Surge Detector
domain_id: 30
domain_title: Electrical Grid Frequency, Power Quality & High-Harmonic Sensors
category: ELECTRICAL
target_protocol: MODBUS_TCP
default_port: 15211
interface: Digital Waveform Integrator
description: "Ferroresonance Overvoltage Surge Detector is a specialized Domain 30\
  \ (Electrical Grid Frequency, Power Quality & High-Harmonic Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Digital Waveform Integrator, it is\
  \ specifically engineered to mitigate and detect Voltage transformer (VT) core saturation,\
  \ cable capacitive resonance. In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Non-linear resonance condition: \\omega L(I)\
  \ \u2248 \\frac{1}{\\omega C}; detects continuous overvoltage > 2.0\\,p.u. with\
  \ high 3rd harmonic content; inserts damping resistors.. Any divergence between\
  \ commanded network state and this physical reading triggers sub-microsecond in-kernel\
  \ eBPF packet mitigation."
target_threat: Voltage transformer (VT) core saturation, cable capacitive resonance
core_invariant: "Non-linear resonance condition: \\omega L(I) \u2248 \\frac{1}{\\\
  omega C}; detects continuous overvoltage > 2.0\\,p.u. with high 3rd harmonic content;\
  \ inserts damping resistors."
physics:
  engine: grid_harmonics
  baseline_value: 230.0
  min_value: 0.0
  max_value: 500.0
  noise_sigma: 0.35
  unit: V
registers:
  holding_registers:
    40021:
      name: s211_ferroresonance_overvoltage_surge_detector_pv
      type: float32
      scale: 1.0
      unit: V
    40023:
      name: s211_ferroresonance_overvoltage_surge_detector_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s211_ferroresonance_overvoltage_surge_detector_fault
  action: step_decrease
  value: -45.0
  description: 'Injects anomaly: Voltage transformer (VT) core saturation, cable capacitive
    resonance'
