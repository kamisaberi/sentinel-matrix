sensor_id: s545_distributed_acoustic_temperature_das_dts_interrogator
name: Distributed Acoustic & Temperature (DAS/DTS) Interrogator
domain_id: 77
domain_title: High-Voltage Underground HVDC Light & Extruded VSC Cable Sensors
category: ELECTRICAL
target_protocol: MODBUS_TCP
default_port: 15545
interface: Dual-Channel Optical OTDR Fiber Unit
description: "Distributed Acoustic & Temperature (DAS/DTS) Interrogator is a specialized\
  \ Domain 77 (High-Voltage Underground HVDC Light & Extruded VSC Cable Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Dual-Channel Optical OTDR Fiber Unit,\
  \ it is specifically engineered to mitigate and detect Ground excavation strike,\
  \ third-party sabotage, thermal bottlenecking. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Co-located Rayleigh acoustic\
  \ vibration and Brillouin temperature profiles along 100\\,km; pinpoints excavator\
  \ digging within \xB1 1\\,meter.. Any divergence between commanded network state\
  \ and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Ground excavation strike, third-party sabotage, thermal bottlenecking
core_invariant: "Co-located Rayleigh acoustic vibration and Brillouin temperature\
  \ profiles along 100\\,km; pinpoints excavator digging within \xB1 1\\,meter."
physics:
  engine: grid_harmonics
  baseline_value: 230.0
  min_value: 0.0
  max_value: 500.0
  noise_sigma: 0.35
  unit: V
registers:
  holding_registers:
    40131:
      name: s545_distributed_acoustic_temperature_das_dts_interrogator_pv
      type: float32
      scale: 1.0
      unit: V
    40133:
      name: s545_distributed_acoustic_temperature_das_dts_interrogator_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s545_distributed_acoustic_temperature_das_dts_interrogator_fault
  action: step_decrease
  value: -45.0
  description: 'Injects anomaly: Ground excavation strike, third-party sabotage, thermal
    bottlenecking'
