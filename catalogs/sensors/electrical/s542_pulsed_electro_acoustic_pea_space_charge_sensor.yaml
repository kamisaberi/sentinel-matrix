sensor_id: s542_pulsed_electro_acoustic_pea_space_charge_sensor
name: Pulsed Electro-Acoustic (PEA) Space Charge Sensor
domain_id: 77
domain_title: High-Voltage Underground HVDC Light & Extruded VSC Cable Sensors
category: ELECTRICAL
target_protocol: MODBUS_TCP
default_port: 15542
interface: High-Voltage Pulsed Transducer (10 kV)
description: "Pulsed Electro-Acoustic (PEA) Space Charge Sensor is a specialized Domain\
  \ 77 (High-Voltage Underground HVDC Light & Extruded VSC Cable Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via High-Voltage Pulsed Transducer (10\
  \ kV), it is specifically engineered to mitigate and detect DC electric field distortion,\
  \ internal insulation breakdown under DC stress. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Acoustic pressure pulse profile:\
  \ p(t) \u221D q_{space\\_charge}(x) \\cdot E_0; localized charge accumulation exceeding\
  \ threshold flags dielectric aging.. Any divergence between commanded network state\
  \ and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: DC electric field distortion, internal insulation breakdown under DC
  stress
core_invariant: "Acoustic pressure pulse profile: p(t) \u221D q_{space\\_charge}(x)\
  \ \\cdot E_0; localized charge accumulation exceeding threshold flags dielectric\
  \ aging."
physics:
  engine: grid_harmonics
  baseline_value: 230.0
  min_value: 0.0
  max_value: 500.0
  noise_sigma: 0.35
  unit: V
registers:
  holding_registers:
    40101:
      name: s542_pulsed_electro_acoustic_pea_space_charge_sensor_pv
      type: float32
      scale: 1.0
      unit: V
    40103:
      name: s542_pulsed_electro_acoustic_pea_space_charge_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s542_pulsed_electro_acoustic_pea_space_charge_sensor_fault
  action: step_decrease
  value: -45.0
  description: 'Injects anomaly: DC electric field distortion, internal insulation
    breakdown under DC stress'
