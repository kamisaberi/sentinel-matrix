sensor_id: s208_high_speed_zero_crossing_phase_jitter_detector
name: High-Speed Zero-Crossing Phase Jitter Detector
domain_id: 30
domain_title: Electrical Grid Frequency, Power Quality & High-Harmonic Sensors
category: ELECTRICAL
target_protocol: MODBUS_TCP
default_port: 15208
interface: Precision Comparator (50 ns)
description: "High-Speed Zero-Crossing Phase Jitter Detector is a specialized Domain\
  \ 30 (Electrical Grid Frequency, Power Quality & High-Harmonic Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Precision Comparator (50 ns), it is\
  \ specifically engineered to mitigate and detect Grid frequency synthetic ROCOF\
  \ spoofing, phase angle jump attacks. In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Zero-crossing period deviation: \u0394 T_{zc}\
  \ = T_k - T_{nominal}; detects sub-cycle phase jumps > 5^\\circ before relay PLLs\
  \ unlock.. Any divergence between commanded network state and this physical reading\
  \ triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Grid frequency synthetic ROCOF spoofing, phase angle jump attacks
core_invariant: "Zero-crossing period deviation: \u0394 T_{zc} = T_k - T_{nominal};\
  \ detects sub-cycle phase jumps > 5^\\circ before relay PLLs unlock."
physics:
  engine: grid_harmonics
  baseline_value: 230.0
  min_value: 0.0
  max_value: 500.0
  noise_sigma: 0.35
  unit: V
registers:
  holding_registers:
    40001:
      name: s208_high_speed_zero_crossing_phase_jitter_detector_pv
      type: float32
      scale: 1.0
      unit: V
    40003:
      name: s208_high_speed_zero_crossing_phase_jitter_detector_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s208_high_speed_zero_crossing_phase_jitter_detector_fault
  action: step_decrease
  value: -45.0
  description: 'Injects anomaly: Grid frequency synthetic ROCOF spoofing, phase angle
    jump attacks'
