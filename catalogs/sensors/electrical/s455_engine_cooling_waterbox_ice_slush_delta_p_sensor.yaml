sensor_id: s455_engine_cooling_waterbox_ice_slush_delta_p_sensor
name: Engine Cooling Waterbox Ice-Slush Delta-P Sensor
domain_id: 64
domain_title: Extreme Arctic LNG & Icebreaker Hydro-Structural Hull Sensors
category: ELECTRICAL
target_protocol: MODBUS_TCP
default_port: 15455
interface: Differential Pressure Transmitter
description: "Engine Cooling Waterbox Ice-Slush Delta-P Sensor is a specialized Domain\
  \ 64 (Extreme Arctic LNG & Icebreaker Hydro-Structural Hull Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Differential Pressure Transmitter,\
  \ it is specifically engineered to mitigate and detect Seawater sea-chest ice-slush\
  \ clogging, main propulsion engine overheat. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Sea-chest pressure drop: \u0394\
  \ P_{chest} <= 0.25\\,bar; slush clogging triggers hot engine cooling water backflush\
  \ in < 2\\,seconds.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Seawater sea-chest ice-slush clogging, main propulsion engine overheat
core_invariant: "Sea-chest pressure drop: \u0394 P_{chest} <= 0.25\\,bar; slush clogging\
  \ triggers hot engine cooling water backflush in < 2\\,seconds."
physics:
  engine: grid_harmonics
  baseline_value: 230.0
  min_value: 0.0
  max_value: 500.0
  noise_sigma: 0.35
  unit: V
registers:
  holding_registers:
    40291:
      name: s455_engine_cooling_waterbox_ice_slush_delta_p_sensor_pv
      type: float32
      scale: 1.0
      unit: V
    40293:
      name: s455_engine_cooling_waterbox_ice_slush_delta_p_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s455_engine_cooling_waterbox_ice_slush_delta_p_sensor_fault
  action: step_decrease
  value: -45.0
  description: 'Injects anomaly: Seawater sea-chest ice-slush clogging, main propulsion
    engine overheat'
