sensor_id: s528_passive_containment_condensation_heat_flux_meter
name: Passive Containment Condensation Heat Flux Meter
domain_id: 75
domain_title: Advanced Nuclear Fission Small Modular Reactor (SMR) Passive Safety
  Sensors
category: NUCLEAR
target_protocol: MODBUS_TCP
default_port: 15528
interface: High-Temperature Heat Flux Transducer
description: 'Passive Containment Condensation Heat Flux Meter is a specialized Domain
  75 (Advanced Nuclear Fission Small Modular Reactor (SMR) Passive Safety Sensors)
  cyber-physical monitoring sensor. Interfacing directly via High-Temperature Heat
  Flux Transducer, it is specifically engineered to mitigate and detect Containment
  overpressure, non-condensable gas insulating cooling walls. In the Aryorithm edge
  architecture, it continuously asserts the operational invariant: Measured condensation
  heat flux: q'''' >= q''''_{decay\_heat} / A_{containment}; heat flux drop flags
  steam condensation stagnation, venting relief valves.. Any divergence between commanded
  network state and this physical reading triggers sub-microsecond in-kernel eBPF
  packet mitigation.'
target_threat: Containment overpressure, non-condensable gas insulating cooling walls
core_invariant: 'Measured condensation heat flux: q'''' >= q''''_{decay\_heat} / A_{containment};
  heat flux drop flags steam condensation stagnation, venting relief valves.'
physics:
  engine: nuclear_decay
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: uSv/h
registers:
  holding_registers:
    40481:
      name: s528_passive_containment_condensation_heat_flux_meter_pv
      type: float32
      scale: 1.0
      unit: uSv/h
    40483:
      name: s528_passive_containment_condensation_heat_flux_meter_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s528_passive_containment_condensation_heat_flux_meter_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Containment overpressure, non-condensable gas insulating
    cooling walls'
