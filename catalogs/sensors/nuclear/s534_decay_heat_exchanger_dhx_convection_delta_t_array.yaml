description: "Decay Heat Exchanger (DHX) Convection Delta-T Array is a specialized\
  \ Domain 75 (Advanced Nuclear Fission Small Modular Reactor (SMR) Passive Safety\
  \ Sensors) cyber-physical monitoring sensor. Interfacing directly via Quad-Element\
  \ Platinum RTD String, it is specifically engineered to mitigate and detect Passive\
  \ decay heat removal loop air-binding, secondary thermosiphon loss. In the Aryorithm\
  \ edge architecture, it continuously asserts the operational invariant: Buoyancy\
  \ temperature differential: \u0394 T = T_{hot\\_leg} - T_{cold\\_leg} >= 18.0^\\\
  circC; loss of differential confirms flow stagnation.. Any divergence between commanded\
  \ network state and this physical reading triggers sub-microsecond in-kernel eBPF\
  \ packet mitigation."
target_threat: Passive decay heat removal loop air-binding, secondary thermosiphon
  loss
core_invariant: "Buoyancy temperature differential: \u0394 T = T_{hot\\_leg} - T_{cold\\\
  _leg} >= 18.0^\\circC; loss of differential confirms flow stagnation."
