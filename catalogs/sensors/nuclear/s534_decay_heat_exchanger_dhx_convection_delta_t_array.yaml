  engine: nuclear_decay
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: uSv/h
registers:
  holding_registers:
    40041:
      name: s534_decay_heat_exchanger_dhx_convection_delta_t_array_pv
