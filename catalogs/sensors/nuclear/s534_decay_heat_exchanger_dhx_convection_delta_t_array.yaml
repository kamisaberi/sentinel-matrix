sensor_id: s534_decay_heat_exchanger_dhx_convection_delta_t_array
name: Decay Heat Exchanger (DHX) Convection Delta-T Array
domain_id: 75
domain_title: Advanced Nuclear Fission Small Modular Reactor (SMR) Passive Safety
