sensor_id: s377_euv_spectral_purity_grating_spg_infrared_rejection_sensor
name: EUV Spectral Purity Grating (SPG) Infrared Rejection Sensor
domain_id: 53
domain_title: Extreme Ultraviolet (EUV) Lithography Optics & Sn-Plasma Sensors
category: SEMICONDUCTOR
target_protocol: MODBUS_TCP
default_port: 15377
interface: Water-Cooled Grating Thermopile Absorber
description: "EUV Spectral Purity Grating (SPG) Infrared Rejection Sensor is a specialized\
  \ Domain 53 (Extreme Ultraviolet (EUV) Lithography Optics & Sn-Plasma Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Water-Cooled Grating Thermopile Absorber,\
  \ it is specifically engineered to mitigate and detect Grating cooling failure,\
  \ out-of-band CO_2 infrared laser (10.6\\,\xB5m) wafer scorch. In the Aryorithm\
  \ edge architecture, it continuously asserts the operational invariant: Absorbed\
  \ infrared rejection power: P_{IR\\_absorbed} <= P_{cooling\\_capacity}; excess\
  \ heat flags grating thermal warping.. Any divergence between commanded network\
  \ state and this physical reading triggers sub-microsecond in-kernel eBPF packet\
  \ mitigation."
target_threat: "Grating cooling failure, out-of-band CO_2 infrared laser (10.6\\,\xB5\
  m) wafer scorch"
core_invariant: 'Absorbed infrared rejection power: P_{IR\_absorbed} <= P_{cooling\_capacity};
  excess heat flags grating thermal warping.'
physics:
  engine: vacuum_plasma
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: mbar
registers:
  holding_registers:
    40081:
      name: s377_euv_spectral_purity_grating_spg_infrared_rejection_sensor_pv
      type: float32
      scale: 1.0
      unit: mbar
    40083:
      name: s377_euv_spectral_purity_grating_spg_infrared_rejection_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s377_euv_spectral_purity_grating_spg_infrared_rejection_sensor_fault
  action: step_increase
  value: 10.0
  description: "Injects anomaly: Grating cooling failure, out-of-band CO_2 infrared\
    \ laser (10.6\\,\xB5m) wafer scorch"
