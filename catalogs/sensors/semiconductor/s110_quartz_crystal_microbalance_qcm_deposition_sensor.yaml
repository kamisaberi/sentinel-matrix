sensor_id: s110_quartz_crystal_microbalance_qcm_deposition_sensor
name: Quartz Crystal Microbalance (QCM) Deposition Sensor
domain_id: 16
domain_title: Semiconductor Fab, Vacuum & Plasma Process Sensors
category: SEMICONDUCTOR
target_protocol: MODBUS_TCP
default_port: 15110
interface: High-Frequency Oscillator Bridge
description: "Quartz Crystal Microbalance (QCM) Deposition Sensor is a specialized\
  \ Domain 16 (Semiconductor Fab, Vacuum & Plasma Process Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via High-Frequency Oscillator Bridge,\
  \ it is specifically engineered to mitigate and detect Atomic film deposition rate\
  \ runaway, evaporation crucible depletion. In the Aryorithm edge architecture, it\
  \ continuously asserts the operational invariant: Sauerbrey equation: \u0394 f =\
  \ -\\frac{2 f_0^2}{A \\sqrt{\\rho_q \xB5_q}} \u0394 m; detects sub-nanogram atomic\
  \ mass accumulation per second.. Any divergence between commanded network state\
  \ and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Atomic film deposition rate runaway, evaporation crucible depletion
core_invariant: "Sauerbrey equation: \u0394 f = -\\frac{2 f_0^2}{A \\sqrt{\\rho_q\
  \ \xB5_q}} \u0394 m; detects sub-nanogram atomic mass accumulation per second."
physics:
  engine: vacuum_plasma
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: mbar
registers:
  holding_registers:
    40081:
      name: s110_quartz_crystal_microbalance_qcm_deposition_sensor_pv
      type: float32
      scale: 1.0
      unit: mbar
    40083:
      name: s110_quartz_crystal_microbalance_qcm_deposition_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s110_quartz_crystal_microbalance_qcm_deposition_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Atomic film deposition rate runaway, evaporation
    crucible depletion'
