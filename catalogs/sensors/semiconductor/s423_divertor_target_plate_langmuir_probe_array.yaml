sensor_id: s423_divertor_target_plate_langmuir_probe_array
name: Divertor Target Plate Langmuir Probe Array
domain_id: 60
domain_title: Superconducting Tokamak Fusion Plasma Diagnostics Sensors
category: SEMICONDUCTOR
target_protocol: MODBUS_TCP
default_port: 15423
interface: Fast Voltage-Swept Tungsten Probe
description: "Divertor Target Plate Langmuir Probe Array is a specialized Domain 60\
  \ (Superconducting Tokamak Fusion Plasma Diagnostics Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via Fast Voltage-Swept Tungsten Probe, it is specifically\
  \ engineered to mitigate and detect Divertor detachment failure, localized divertor\
  \ tile thermal melting. In the Aryorithm edge architecture, it continuously asserts\
  \ the operational invariant: Saturation current density: j_{sat} \u221D n_e \\sqrt{T_e};\
  \ heat flux q_{divertor} <= 10\\,MW/m^2; breach triggers nitrogen/neon impurity\
  \ puffing.. Any divergence between commanded network state and this physical reading\
  \ triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Divertor detachment failure, localized divertor tile thermal melting
core_invariant: "Saturation current density: j_{sat} \u221D n_e \\sqrt{T_e}; heat\
  \ flux q_{divertor} <= 10\\,MW/m^2; breach triggers nitrogen/neon impurity puffing."
physics:
  engine: vacuum_plasma
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: mbar
registers:
  holding_registers:
    40491:
      name: s423_divertor_target_plate_langmuir_probe_array_pv
      type: float32
      scale: 1.0
      unit: mbar
    40493:
      name: s423_divertor_target_plate_langmuir_probe_array_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s423_divertor_target_plate_langmuir_probe_array_fault
