sensor_id: s426_bolometer_array_total_radiated_power_sentry
name: Bolometer Array Total Radiated Power Sentry
domain_id: 60
domain_title: Superconducting Tokamak Fusion Plasma Diagnostics Sensors
category: SEMICONDUCTOR
