sensor_id: s421_mirnov_coil_poloidal_magnetic_pick_up_array
name: Mirnov Coil Poloidal Magnetic Pick-Up Array
domain_id: 60
domain_title: Superconducting Tokamak Fusion Plasma Diagnostics Sensors
category: SEMICONDUCTOR
