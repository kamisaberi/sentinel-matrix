sensor_id: s425_motional_stark_effect_mse_polarimetric_sensor
name: Motional Stark Effect (MSE) Polarimetric Sensor
domain_id: 60
domain_title: Superconducting Tokamak Fusion Plasma Diagnostics Sensors
category: SEMICONDUCTOR
target_protocol: MODBUS_TCP
default_port: 15425
interface: Photoelastic Modulator + APD Array
description: "Motional Stark Effect (MSE) Polarimetric Sensor is a specialized Domain\
  \ 60 (Superconducting Tokamak Fusion Plasma Diagnostics Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Photoelastic Modulator + APD Array,\
  \ it is specifically engineered to mitigate and detect Safety factor q(r) profile\
  \ manipulation, internal kink instability. In the Aryorithm edge architecture, it\
  \ continuously asserts the operational invariant: Polarization angle of Stark-split\
  \ neutral beam lines: \\tan\\gamma \u221D \\frac{B_z}{B_\\phi}; verifies core safety\
  \ factor q_0 > 1.0 (Kruskal-Shafranov limit).. Any divergence between commanded\
  \ network state and this physical reading triggers sub-microsecond in-kernel eBPF\
  \ packet mitigation."
target_threat: Safety factor q(r) profile manipulation, internal kink instability
core_invariant: "Polarization angle of Stark-split neutral beam lines: \\tan\\gamma\
  \ \u221D \\frac{B_z}{B_\\phi}; verifies core safety factor q_0 > 1.0 (Kruskal-Shafranov\
  \ limit)."
physics:
  engine: vacuum_plasma
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: mbar
registers:
  holding_registers:
    40001:
      name: s425_motional_stark_effect_mse_polarimetric_sensor_pv
      type: float32
      scale: 1.0
      unit: mbar
    40003:
      name: s425_motional_stark_effect_mse_polarimetric_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s425_motional_stark_effect_mse_polarimetric_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Safety factor q(r) profile manipulation, internal
    kink instability'
