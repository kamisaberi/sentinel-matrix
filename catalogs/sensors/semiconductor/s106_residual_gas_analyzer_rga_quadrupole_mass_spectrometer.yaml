sensor_id: s106_residual_gas_analyzer_rga_quadrupole_mass_spectrometer
name: Residual Gas Analyzer (RGA) Quadrupole Mass Spectrometer
domain_id: 16
domain_title: Semiconductor Fab, Vacuum & Plasma Process Sensors
category: SEMICONDUCTOR
target_protocol: MODBUS_TCP
default_port: 15106
interface: Ethernet / Modbus TCP (1--200 AMU)
description: 'Residual Gas Analyzer (RGA) Quadrupole Mass Spectrometer is a specialized
  Domain 16 (Semiconductor Fab, Vacuum & Plasma Process Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Ethernet / Modbus TCP (1--200 AMU), it is specifically
  engineered to mitigate and detect Cleanroom vacuum chamber micro-leakage, chemical
  sabotage. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Monitors partial pressures of mass-to-charge ratios (m/z = 18 for H_2O,
  28 for N_2, 32 for O_2); detects atmospheric leaks < 10^{-11}\,mbar\cdotL/s.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Cleanroom vacuum chamber micro-leakage, chemical sabotage
core_invariant: Monitors partial pressures of mass-to-charge ratios (m/z = 18 for
  H_2O, 28 for N_2, 32 for O_2); detects atmospheric leaks < 10^{-11}\,mbar\cdotL/s.
physics:
  engine: vacuum_plasma
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: mbar
registers:
  holding_registers:
    40041:
      name: s106_residual_gas_analyzer_rga_quadrupole_mass_spectrometer_pv
      type: float32
      scale: 1.0
      unit: mbar
    40043:
      name: s106_residual_gas_analyzer_rga_quadrupole_mass_spectrometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s106_residual_gas_analyzer_rga_quadrupole_mass_spectrometer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Cleanroom vacuum chamber micro-leakage, chemical
    sabotage'
