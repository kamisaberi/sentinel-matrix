sensor_id: s155_inverter_dc_link_voltage_ripple_sensor
name: Inverter DC-Link Voltage Ripple Sensor
domain_id: 22
domain_title: Advanced Automotive & Autonomous Drive-by-Wire Sensors
category: AUTOMOTIVE
target_protocol: MODBUS_TCP
default_port: 15155
interface: High-Voltage Differential Probe
description: "Inverter DC-Link Voltage Ripple Sensor is a specialized Domain 22 (Advanced\
  \ Automotive & Autonomous Drive-by-Wire Sensors) cyber-physical monitoring sensor.\
  \ Interfacing directly via High-Voltage Differential Probe, it is specifically engineered\
  \ to mitigate and detect DC-link capacitor aging, IGBT gate-driver desynchronization.\
  \ In the Aryorithm edge architecture, it continuously asserts the operational invariant:\
  \ Voltage ripple amplitude \u0394 V_{ripple} <= 5\\%\\cdot V_{DC}; excessive ripple\
  \ flags impending inverter short-circuit failure.. Any divergence between commanded\
  \ network state and this physical reading triggers sub-microsecond in-kernel eBPF\
  \ packet mitigation."
target_threat: DC-link capacitor aging, IGBT gate-driver desynchronization
core_invariant: "Voltage ripple amplitude \u0394 V_{ripple} <= 5\\%\\cdot V_{DC};\
  \ excessive ripple flags impending inverter short-circuit failure."
physics:
  engine: kinematic_encoder
  baseline_value: 0.0
  min_value: -180.0
  max_value: 180.0
  noise_sigma: 0.02
  unit: deg
registers:
  holding_registers:
    40001:
      name: s155_inverter_dc_link_voltage_ripple_sensor_pv
      type: float32
      scale: 1.0
      unit: deg
    40003:
      name: s155_inverter_dc_link_voltage_ripple_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s155_inverter_dc_link_voltage_ripple_sensor_fault
  action: step_increase
  value: 45.0
  description: 'Injects anomaly: DC-link capacitor aging, IGBT gate-driver desynchronization'
