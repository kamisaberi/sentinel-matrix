sensor_id: s152_tire_internal_cavity_acoustic_sensor_tpms_a
name: Tire Internal Cavity Acoustic Sensor (TPMS-A)
domain_id: 22
domain_title: Advanced Automotive & Autonomous Drive-by-Wire Sensors
category: AUTOMOTIVE
target_protocol: MODBUS_TCP
default_port: 15152
interface: Low-Power Direct Rim Transceiver
description: "Tire Internal Cavity Acoustic Sensor (TPMS-A) is a specialized Domain\
  \ 22 (Advanced Automotive & Autonomous Drive-by-Wire Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via Low-Power Direct Rim Transceiver, it is specifically\
  \ engineered to mitigate and detect Tire pressure spoofing, micro-puncture / blowout\
  \ precursor. In the Aryorithm edge architecture, it continuously asserts the operational\
  \ invariant: In-tire acoustic sound pressure level maps road friction coefficient\
  \ \xB5_{road}; friction drop alerts stability control before skid occurs.. Any divergence\
  \ between commanded network state and this physical reading triggers sub-microsecond\
  \ in-kernel eBPF packet mitigation."
target_threat: Tire pressure spoofing, micro-puncture / blowout precursor
core_invariant: "In-tire acoustic sound pressure level maps road friction coefficient\
  \ \xB5_{road}; friction drop alerts stability control before skid occurs."
physics:
  engine: kinematic_encoder
  baseline_value: 0.0
  min_value: -180.0
  max_value: 180.0
  noise_sigma: 0.02
  unit: deg
registers:
  holding_registers:
    40471:
      name: s152_tire_internal_cavity_acoustic_sensor_tpms_a_pv
      type: float32
      scale: 1.0
      unit: deg
    40473:
      name: s152_tire_internal_cavity_acoustic_sensor_tpms_a_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s152_tire_internal_cavity_acoustic_sensor_tpms_a_fault
  action: step_increase
  value: 45.0
  description: 'Injects anomaly: Tire pressure spoofing, micro-puncture / blowout
    precursor'
