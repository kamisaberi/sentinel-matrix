sensor_id: s151_magnetoresistive_wheel_speed_inductive_sensor
name: Magnetoresistive Wheel-Speed Inductive Sensor
domain_id: 22
domain_title: Advanced Automotive & Autonomous Drive-by-Wire Sensors
category: AUTOMOTIVE
target_protocol: MODBUS_TCP
default_port: 15151
interface: Current-Modulated Pulse Interface
description: 'Magnetoresistive Wheel-Speed Inductive Sensor is a specialized Domain
  22 (Advanced Automotive & Autonomous Drive-by-Wire Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Current-Modulated Pulse Interface, it is specifically
  engineered to mitigate and detect ABS wheel-speed spoofing, differential drive spin-out
  attacks. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Evaluates vehicle yaw rate consistency: \omega_{left} - \omega_{right}
  = \frac{W}{R} \dot{\psi}; unphysical slip triggers drive torque limits.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: ABS wheel-speed spoofing, differential drive spin-out attacks
core_invariant: 'Evaluates vehicle yaw rate consistency: \omega_{left} - \omega_{right}
  = \frac{W}{R} \dot{\psi}; unphysical slip triggers drive torque limits.'
physics:
  engine: kinematic_encoder
  baseline_value: 0.0
  min_value: -180.0
  max_value: 180.0
  noise_sigma: 0.02
  unit: deg
registers:
  holding_registers:
    40461:
      name: s151_magnetoresistive_wheel_speed_inductive_sensor_pv
      type: float32
      scale: 1.0
      unit: deg
    40463:
      name: s151_magnetoresistive_wheel_speed_inductive_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s151_magnetoresistive_wheel_speed_inductive_sensor_fault
  action: step_increase
  value: 45.0
  description: 'Injects anomaly: ABS wheel-speed spoofing, differential drive spin-out
    attacks'
