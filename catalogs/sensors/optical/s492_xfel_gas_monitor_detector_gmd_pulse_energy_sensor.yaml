sensor_id: s492_xfel_gas_monitor_detector_gmd_pulse_energy_sensor
name: XFEL Gas Monitor Detector (GMD) Pulse Energy Sensor
domain_id: 70
domain_title: X-Ray Free-Electron Laser (XFEL) Beamline Optics Sensors
category: OPTICAL
target_protocol: MODBUS_TCP
default_port: 15492
interface: Rare Gas Photoionization Electron Multiplier
description: "XFEL Gas Monitor Detector (GMD) Pulse Energy Sensor is a specialized\
  \ Domain 70 (X-Ray Free-Electron Laser (XFEL) Beamline Optics Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Rare Gas Photoionization Electron\
  \ Multiplier, it is specifically engineered to mitigate and detect Laser pulse energy\
  \ runaway, optical damage to downstream mirrors. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Photoelectron charge: Q \u221D\
  \ E_{pulse}; pulse energy must stay below mirror damage threshold: E_{pulse} <=\
  \ 5.0\\,mJ.. Any divergence between commanded network state and this physical reading\
  \ triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Laser pulse energy runaway, optical damage to downstream mirrors
core_invariant: "Photoelectron charge: Q \u221D E_{pulse}; pulse energy must stay\
  \ below mirror damage threshold: E_{pulse} <= 5.0\\,mJ."
physics:
  engine: optical_laser
  baseline_value: -0.5
  min_value: -40.0
  max_value: 10.0
  noise_sigma: 0.05
  unit: dBm
registers:
  holding_registers:
    40161:
      name: s492_xfel_gas_monitor_detector_gmd_pulse_energy_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40163:
      name: s492_xfel_gas_monitor_detector_gmd_pulse_energy_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s492_xfel_gas_monitor_detector_gmd_pulse_energy_sensor_fault
  action: step_decrease
  value: -15.0
  description: 'Injects anomaly: Laser pulse energy runaway, optical damage to downstream
    mirrors'
