sensor_id: s041_distributed_acoustic_sensing_phi_otdr_sensor
name: Distributed Acoustic Sensing (\phi-OTDR) Sensor
domain_id: 7
domain_title: Photonic & Fiber-Optic Sensors
category: OPTICAL
target_protocol: MODBUS_TCP
default_port: 15041
interface: High-Speed Optical Interrogator
description: "Distributed Acoustic Sensing (\\phi-OTDR) Sensor is a specialized Domain\
  \ 07 (Photonic & Fiber-Optic Sensors) cyber-physical monitoring sensor. Interfacing\
  \ directly via High-Speed Optical Interrogator, it is specifically engineered to\
  \ mitigate and detect Fiber cable macro-bending tap, digging/sabotage. In the Aryorithm\
  \ edge architecture, it continuously asserts the operational invariant: Pinpoints\
  \ optical power leakage and acoustic vibrations to \xB1 1\\,meter along a 100\\\
  ,km fiber.. Any divergence between commanded network state and this physical reading\
  \ triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Fiber cable macro-bending tap, digging/sabotage
core_invariant: "Pinpoints optical power leakage and acoustic vibrations to \xB1 1\\\
  ,meter along a 100\\,km fiber."
physics:
  engine: optical_laser
  baseline_value: -0.5
  min_value: -40.0
  max_value: 10.0
  noise_sigma: 0.05
  unit: dBm
registers:
  holding_registers:
    40401:
      name: s041_distributed_acoustic_sensing_phi_otdr_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40403:
      name: s041_distributed_acoustic_sensing_phi_otdr_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s041_distributed_acoustic_sensing_phi_otdr_sensor_fault
  action: step_decrease
  value: -15.0
  description: 'Injects anomaly: Fiber cable macro-bending tap, digging/sabotage'
