sensor_id: s173_integrated_waveguide_evanescent_power_tap_monitor
name: Integrated Waveguide Evanescent Power Tap Monitor
domain_id: 25
domain_title: Photonic Integrated Circuit (PIC) & Optical Computing Sensors
category: OPTICAL
target_protocol: MODBUS_TCP
default_port: 15173
interface: On-Chip Sub-1% Directional Coupler
description: 'Integrated Waveguide Evanescent Power Tap Monitor is a specialized Domain
  25 (Photonic Integrated Circuit (PIC) & Optical Computing Sensors) cyber-physical
  monitoring sensor. Interfacing directly via On-Chip Sub-1% Directional Coupler,
  it is specifically engineered to mitigate and detect Physical micro-probing, evanescent
  optical tapping on silicon waveguides. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Waveguide insertion loss: \alpha_{loss} = -10
  \log_{10}(P_{out}/P_{in}); localized drop > 0.2\,dB flags optical physical tap placement..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Physical micro-probing, evanescent optical tapping on silicon waveguides
core_invariant: 'Waveguide insertion loss: \alpha_{loss} = -10 \log_{10}(P_{out}/P_{in});
  localized drop > 0.2\,dB flags optical physical tap placement.'
physics:
  engine: optical_laser
  baseline_value: -0.5
  min_value: -40.0
  max_value: 10.0
  noise_sigma: 0.05
  unit: dBm
registers:
  holding_registers:
    40181:
      name: s173_integrated_waveguide_evanescent_power_tap_monitor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40183:
      name: s173_integrated_waveguide_evanescent_power_tap_monitor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s173_integrated_waveguide_evanescent_power_tap_monitor_fault
  action: step_decrease
  value: -15.0
  description: 'Injects anomaly: Physical micro-probing, evanescent optical tapping
    on silicon waveguides'
