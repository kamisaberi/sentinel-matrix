sensor_id: s496_high_heat_load_beryllium_exit_window_infrared_pyrometer
name: High-Heat-Load Beryllium Exit Window Infrared Pyrometer
domain_id: 70
domain_title: X-Ray Free-Electron Laser (XFEL) Beamline Optics Sensors
category: OPTICAL
target_protocol: MODBUS_TCP
default_port: 15496
interface: Non-Contact Fast Infrared Sensor
description: 'High-Heat-Load Beryllium Exit Window Infrared Pyrometer is a specialized
  Domain 70 (X-Ray Free-Electron Laser (XFEL) Beamline Optics Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Non-Contact Fast Infrared Sensor, it
  is specifically engineered to mitigate and detect Beryllium window thermal fracture,
  beamline vacuum implosion. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: Window temperature: T_{window} <= 180^\circC; localized
  thermal stress \sigma_{thermal} <= 0.5 \cdot \sigma_{yield}; trips fast shutter
  if exceeded.. Any divergence between commanded network state and this physical reading
  triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Beryllium window thermal fracture, beamline vacuum implosion
core_invariant: 'Window temperature: T_{window} <= 180^\circC; localized thermal stress
  \sigma_{thermal} <= 0.5 \cdot \sigma_{yield}; trips fast shutter if exceeded.'
physics:
  engine: optical_laser
  baseline_value: -0.5
  min_value: -40.0
  max_value: 10.0
  noise_sigma: 0.05
  unit: dBm
registers:
  holding_registers:
    40201:
      name: s496_high_heat_load_beryllium_exit_window_infrared_pyrometer_pv
      type: float32
      scale: 1.0
      unit: dBm
    40203:
      name: s496_high_heat_load_beryllium_exit_window_infrared_pyrometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s496_high_heat_load_beryllium_exit_window_infrared_pyrometer_fault
  action: step_decrease
  value: -15.0
  description: 'Injects anomaly: Beryllium window thermal fracture, beamline vacuum
    implosion'
