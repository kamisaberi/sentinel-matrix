sensor_id: s176_electro_optic_modulator_eom_half_wave_voltage_v_pi_sentry
name: Electro-Optic Modulator (EOM) Half-Wave Voltage (V_\pi) Sentry
domain_id: 25
domain_title: Photonic Integrated Circuit (PIC) & Optical Computing Sensors
category: OPTICAL
target_protocol: MODBUS_TCP
default_port: 15176
interface: Low-Frequency Modulator Bias Tap
description: 'Electro-Optic Modulator (EOM) Half-Wave Voltage (V_\pi) Sentry is a
  specialized Domain 25 (Photonic Integrated Circuit (PIC) & Optical Computing Sensors)
  cyber-physical monitoring sensor. Interfacing directly via Low-Frequency Modulator
  Bias Tap, it is specifically engineered to mitigate and detect Optical transmitter
  bias drift, RF-over-fiber signal clipping attacks. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Quadrature bias condition: V_{bias}
  = V_\pi / 2; second-harmonic distortion suppression > 40\,dBc maintained to prevent
  optical carrier saturation.. Any divergence between commanded network state and
  this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Optical transmitter bias drift, RF-over-fiber signal clipping attacks
core_invariant: 'Quadrature bias condition: V_{bias} = V_\pi / 2; second-harmonic
  distortion suppression > 40\,dBc maintained to prevent optical carrier saturation.'
physics:
  engine: optical_laser
  baseline_value: -0.5
  min_value: -40.0
  max_value: 10.0
  noise_sigma: 0.05
  unit: dBm
registers:
  holding_registers:
    40211:
      name: s176_electro_optic_modulator_eom_half_wave_voltage_v_pi_sentry_pv
      type: float32
      scale: 1.0
      unit: dBm
    40213:
      name: s176_electro_optic_modulator_eom_half_wave_voltage_v_pi_sentry_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s176_electro_optic_modulator_eom_half_wave_voltage_v_pi_sentry_fault
  action: step_decrease
  value: -15.0
  description: 'Injects anomaly: Optical transmitter bias drift, RF-over-fiber signal
    clipping attacks'
