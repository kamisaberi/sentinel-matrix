sensor_id: s042_single_photon_avalanche_diode_spad_detector
name: Single-Photon Avalanche Diode (SPAD) Detector
domain_id: 7
domain_title: Photonic & Fiber-Optic Sensors
category: OPTICAL
target_protocol: MODBUS_TCP
default_port: 15042
interface: High-Speed Photomultiplier Circuit
description: "Single-Photon Avalanche Diode (SPAD) Detector is a specialized Domain\
  \ 07 (Photonic & Fiber-Optic Sensors) cyber-physical monitoring sensor. Interfacing\
  \ directly via High-Speed Photomultiplier Circuit, it is specifically engineered\
  \ to mitigate and detect QKD photon-number-splitting, detector blinding attacks.\
  \ In the Aryorithm edge architecture, it continuously asserts the operational invariant:\
  \ Quantum Bit Error Rate (QBER) must remain <= 11\\%; breach wipes keys in < 1\\\
  ,\xB5s.. Any divergence between commanded network state and this physical reading\
  \ triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: QKD photon-number-splitting, detector blinding attacks
core_invariant: "Quantum Bit Error Rate (QBER) must remain <= 11\\%; breach wipes\
  \ keys in < 1\\,\xB5s."
physics:
  engine: optical_laser
  baseline_value: -0.5
  min_value: -40.0
  max_value: 10.0
  noise_sigma: 0.05
  unit: dBm
registers:
  holding_registers:
    40411:
      name: s042_single_photon_avalanche_diode_spad_detector_pv
      type: float32
      scale: 1.0
      unit: dBm
    40413:
      name: s042_single_photon_avalanche_diode_spad_detector_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s042_single_photon_avalanche_diode_spad_detector_fault
  action: step_decrease
  value: -15.0
  description: 'Injects anomaly: QKD photon-number-splitting, detector blinding attacks'
