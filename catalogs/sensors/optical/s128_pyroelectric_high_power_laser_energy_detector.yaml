sensor_id: s128_pyroelectric_high_power_laser_energy_detector
name: Pyroelectric High-Power Laser Energy Detector
domain_id: 19
domain_title: High-Energy Laser, Directed Energy & Optoelectronic Sensors
category: OPTICAL
target_protocol: MODBUS_TCP
default_port: 15128
interface: Sub-Nanosecond Pyroelectric Transducer
description: "Pyroelectric High-Power Laser Energy Detector is a specialized Domain\
  \ 19 (High-Energy Laser, Directed Energy & Optoelectronic Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Sub-Nanosecond Pyroelectric Transducer,\
  \ it is specifically engineered to mitigate and detect Directed-energy weapon pulse\
  \ tampering, optical coating ablation. In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Piezo-electric charge generation Q = p \\cdot\
  \ A \\cdot \u0394 T; pulse energy must strictly correlate with capacitor bank discharge\
  \ voltage.. Any divergence between commanded network state and this physical reading\
  \ triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Directed-energy weapon pulse tampering, optical coating ablation
core_invariant: "Piezo-electric charge generation Q = p \\cdot A \\cdot \u0394 T;\
  \ pulse energy must strictly correlate with capacitor bank discharge voltage."
physics:
  engine: optical_laser
  baseline_value: -0.5
  min_value: -40.0
  max_value: 10.0
  noise_sigma: 0.05
  unit: dBm
registers:
  holding_registers:
    40241:
      name: s128_pyroelectric_high_power_laser_energy_detector_pv
      type: float32
      scale: 1.0
      unit: dBm
    40243:
      name: s128_pyroelectric_high_power_laser_energy_detector_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s128_pyroelectric_high_power_laser_energy_detector_fault
  action: step_decrease
  value: -15.0
  description: 'Injects anomaly: Directed-energy weapon pulse tampering, optical coating
    ablation'
