sensor_id: s043_faraday_effect_polarimetric_optical_ct_sensor
name: Faraday-Effect Polarimetric Optical CT Sensor
domain_id: 7
domain_title: Photonic & Fiber-Optic Sensors
category: OPTICAL
target_protocol: MODBUS_TCP
default_port: 15043
interface: Stokes Parameter Optical Receiver
description: 'Faraday-Effect Polarimetric Optical CT Sensor is a specialized Domain
  07 (Photonic & Fiber-Optic Sensors) cyber-physical monitoring sensor. Interfacing
  directly via Stokes Parameter Optical Receiver, it is specifically engineered to
  mitigate and detect Magnetic spoofing of high-voltage current measurement. In the
  Aryorithm edge architecture, it continuously asserts the operational invariant:
  Stokes vector Degree of Polarization (DoP) must remain > 0.95.. Any divergence between
  commanded network state and this physical reading triggers sub-microsecond in-kernel
  eBPF packet mitigation.'
target_threat: Magnetic spoofing of high-voltage current measurement
core_invariant: Stokes vector Degree of Polarization (DoP) must remain > 0.95.
physics:
  engine: optical_laser
  baseline_value: -0.5
  min_value: -40.0
  max_value: 10.0
  noise_sigma: 0.05
  unit: dBm
registers:
  holding_registers:
    40421:
      name: s043_faraday_effect_polarimetric_optical_ct_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40423:
      name: s043_faraday_effect_polarimetric_optical_ct_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s043_faraday_effect_polarimetric_optical_ct_sensor_fault
  action: step_decrease
  value: -15.0
  description: 'Injects anomaly: Magnetic spoofing of high-voltage current measurement'
