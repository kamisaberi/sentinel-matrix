sensor_id: s169_refractory_hearth_ultrasonic_pulse_echo_sensor
name: Refractory Hearth Ultrasonic Pulse-Echo Sensor
domain_id: 24
domain_title: High-Temperature Metallurgy & Molten Material Sensors
category: METALLURGY
target_protocol: MODBUS_TCP
default_port: 15169
interface: High-Temperature Buffer Rod Transducer
description: 'Refractory Hearth Ultrasonic Pulse-Echo Sensor is a specialized Domain
  24 (High-Temperature Metallurgy & Molten Material Sensors) cyber-physical monitoring
  sensor. Interfacing directly via High-Temperature Buffer Rod Transducer, it is specifically
  engineered to mitigate and detect Smelting furnace refractory brick breakout, molten
  liquid metal breach. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: Measures acoustic round-trip transit time through refractory
  wall; residual wall thickness < 100\,mm triggers emergency furnace tapping.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Smelting furnace refractory brick breakout, molten liquid metal breach
core_invariant: Measures acoustic round-trip transit time through refractory wall;
  residual wall thickness < 100\,mm triggers emergency furnace tapping.
physics:
  engine: thermal_lag_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: degC
registers:
  holding_registers:
    40141:
      name: s169_refractory_hearth_ultrasonic_pulse_echo_sensor_pv
      type: float32
      scale: 1.0
      unit: degC
    40143:
      name: s169_refractory_hearth_ultrasonic_pulse_echo_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s169_refractory_hearth_ultrasonic_pulse_echo_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Smelting furnace refractory brick breakout, molten
    liquid metal breach'
