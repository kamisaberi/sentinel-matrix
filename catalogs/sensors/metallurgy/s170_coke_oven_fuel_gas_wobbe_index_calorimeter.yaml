sensor_id: s170_coke_oven_fuel_gas_wobbe_index_calorimeter
name: Coke Oven Fuel Gas Wobbe Index Calorimeter
domain_id: 24
domain_title: High-Temperature Metallurgy & Molten Material Sensors
category: METALLURGY
target_protocol: MODBUS_TCP
default_port: 15170
interface: Continuous Flow Combustor + Zirconia Cell
description: 'Coke Oven Fuel Gas Wobbe Index Calorimeter is a specialized Domain 24
  (High-Temperature Metallurgy & Molten Material Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Continuous Flow Combustor + Zirconia Cell, it is
  specifically engineered to mitigate and detect Industrial gas burner flame blow-off,
  combustion backfire. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: Wobbe Index = \frac{Higher Heating Value}{\sqrt{Specific
  Gravity}}; fuel composition drift triggers automated air/fuel ratio re-trimming..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Industrial gas burner flame blow-off, combustion backfire
core_invariant: Wobbe Index = \frac{Higher Heating Value}{\sqrt{Specific Gravity}};
  fuel composition drift triggers automated air/fuel ratio re-trimming.
physics:
  engine: thermal_lag_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: degC
registers:
  holding_registers:
    40151:
      name: s170_coke_oven_fuel_gas_wobbe_index_calorimeter_pv
      type: float32
      scale: 1.0
      unit: degC
    40153:
      name: s170_coke_oven_fuel_gas_wobbe_index_calorimeter_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s170_coke_oven_fuel_gas_wobbe_index_calorimeter_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Industrial gas burner flame blow-off, combustion
    backfire'
