sensor_id: s164_electromagnetic_slag_carry_over_detection_coil
name: Electromagnetic Slag Carry-Over Detection Coil
domain_id: 24
domain_title: High-Temperature Metallurgy & Molten Material Sensors
category: METALLURGY
target_protocol: MODBUS_TCP
default_port: 15164
interface: Copper Induction Coils Under Tundish
description: "Electromagnetic Slag Carry-Over Detection Coil is a specialized Domain\
  \ 24 (High-Temperature Metallurgy & Molten Material Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via Copper Induction Coils Under Tundish, it is specifically\
  \ engineered to mitigate and detect Liquid steel slag entrainment, casting nozzle\
  \ erosion. In the Aryorithm edge architecture, it continuously asserts the operational\
  \ invariant: Change in electromagnetic mutual inductance: electrical conductivity\
  \ of liquid steel (\\sigma \u2248 7 \xD7 10^5\\,S/m) vs slag (\\sigma \u2248 10^2\\\
  ,S/m).. Any divergence between commanded network state and this physical reading\
  \ triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Liquid steel slag entrainment, casting nozzle erosion
core_invariant: "Change in electromagnetic mutual inductance: electrical conductivity\
  \ of liquid steel (\\sigma \u2248 7 \xD7 10^5\\,S/m) vs slag (\\sigma \u2248 10^2\\\
  ,S/m)."
physics:
  engine: thermal_lag_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: degC
registers:
  holding_registers:
    40091:
      name: s164_electromagnetic_slag_carry_over_detection_coil_pv
      type: float32
      scale: 1.0
      unit: degC
    40093:
      name: s164_electromagnetic_slag_carry_over_detection_coil_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s164_electromagnetic_slag_carry_over_detection_coil_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Liquid steel slag entrainment, casting nozzle erosion'
