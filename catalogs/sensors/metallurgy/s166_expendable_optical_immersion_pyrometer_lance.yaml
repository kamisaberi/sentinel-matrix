sensor_id: s166_expendable_optical_immersion_pyrometer_lance
name: Expendable Optical Immersion Pyrometer Lance
domain_id: 24
domain_title: High-Temperature Metallurgy & Molten Material Sensors
category: METALLURGY
target_protocol: MODBUS_TCP
default_port: 15166
interface: Type B (Pt-Rh) Thermocouple (1{,}800^\circC)
description: "Expendable Optical Immersion Pyrometer Lance is a specialized Domain\
  \ 24 (High-Temperature Metallurgy & Molten Material Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via Type B (Pt-Rh) Thermocouple (1{,}800^\\circC),\
  \ it is specifically engineered to mitigate and detect Liquid steel temperature\
  \ measurement falsification, furnace freeze. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Dynamic plateau validation;\
  \ thermal arrest curve confirms liquid metal temperature within \xB1 1^\\circC before\
  \ casting.. Any divergence between commanded network state and this physical reading\
  \ triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Liquid steel temperature measurement falsification, furnace freeze
core_invariant: "Dynamic plateau validation; thermal arrest curve confirms liquid\
  \ metal temperature within \xB1 1^\\circC before casting."
physics:
  engine: thermal_lag_ode
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: degC
registers:
  holding_registers:
    40111:
      name: s166_expendable_optical_immersion_pyrometer_lance_pv
      type: float32
      scale: 1.0
      unit: degC
    40113:
      name: s166_expendable_optical_immersion_pyrometer_lance_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s166_expendable_optical_immersion_pyrometer_lance_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Liquid steel temperature measurement falsification,
    furnace freeze'
