sensor_id: s025_rf_spectrum_power_density_rssi_sensor
name: RF Spectrum Power Density / RSSI Sensor
domain_id: 4
domain_title: Radio Frequency, GNSS & Electromagnetic Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15025
interface: Software-Defined Radio (SDR)
description: 'RF Spectrum Power Density / RSSI Sensor is a specialized Domain 04 (Radio
  Frequency, GNSS & Electromagnetic Sensors) cyber-physical monitoring sensor. Interfacing
  directly via Software-Defined Radio (SDR), it is specifically engineered to mitigate
  and detect WirelessHART / Zigbee / LoRa jamming. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Sudden wideband noise floor elevation
  > 20\,dB indicates intentional jamming.. Any divergence between commanded network
  state and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: WirelessHART / Zigbee / LoRa jamming
core_invariant: Sudden wideband noise floor elevation > 20\,dB indicates intentional
  jamming.
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40241:
      name: s025_rf_spectrum_power_density_rssi_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40243:
      name: s025_rf_spectrum_power_density_rssi_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s025_rf_spectrum_power_density_rssi_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: WirelessHART / Zigbee / LoRa jamming'
