sensor_id: s438_psychrometric_water_potential_humidity_sensor
name: Psychrometric Water-Potential Humidity Sensor
domain_id: 62
domain_title: Deep Underground Geological Radioactive Waste Repository (DGR) Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15438
interface: Thermocouple Psychrometer
description: 'Psychrometric Water-Potential Humidity Sensor is a specialized Domain
  62 (Deep Underground Geological Radioactive Waste Repository (DGR) Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Thermocouple Psychrometer, it is specifically
  engineered to mitigate and detect Bentonite buffer desiccation and cracking, seal
  failure. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: Relative humidity: RH >= 95\%; water potential \Psi >= -5.0\,MPa; dry
  conditions flag ventilation bypass or heating faults.. Any divergence between commanded
  network state and this physical reading triggers sub-microsecond in-kernel eBPF
  packet mitigation.'
target_threat: Bentonite buffer desiccation and cracking, seal failure
core_invariant: 'Relative humidity: RH >= 95\%; water potential \Psi >= -5.0\,MPa;
  dry conditions flag ventilation bypass or heating faults.'
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40121:
      name: s438_psychrometric_water_potential_humidity_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40123:
      name: s438_psychrometric_water_potential_humidity_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s438_psychrometric_water_potential_humidity_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Bentonite buffer desiccation and cracking, seal failure'
