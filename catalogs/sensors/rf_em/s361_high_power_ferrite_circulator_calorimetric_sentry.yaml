sensor_id: s361_high_power_ferrite_circulator_calorimetric_sentry
name: High-Power Ferrite Circulator Calorimetric Sentry
domain_id: 51
domain_title: Industrial Microwave & RF Dielectric Processing Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15361
interface: Thermopile Flow Cell on Dummy Load
description: 'High-Power Ferrite Circulator Calorimetric Sentry is a specialized Domain
  51 (Industrial Microwave & RF Dielectric Processing Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Thermopile Flow Cell on Dummy Load, it is specifically
  engineered to mitigate and detect Circulator water-load cooling failure, ferrite
  magnet demagnetization. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: Absorbed dump power: P_{dump} = \dot{m} C_p (T_{out}
  - T_{in}); water flow loss trips magnetron before circulator ferrite cracks.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Circulator water-load cooling failure, ferrite magnet demagnetization
core_invariant: 'Absorbed dump power: P_{dump} = \dot{m} C_p (T_{out} - T_{in}); water
  flow loss trips magnetron before circulator ferrite cracks.'
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40441:
      name: s361_high_power_ferrite_circulator_calorimetric_sentry_pv
      type: float32
      scale: 1.0
      unit: dBm
    40443:
      name: s361_high_power_ferrite_circulator_calorimetric_sentry_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s361_high_power_ferrite_circulator_calorimetric_sentry_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Circulator water-load cooling failure, ferrite magnet
    demagnetization'
