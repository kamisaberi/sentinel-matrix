sensor_id: s328_cold_plate_microchannel_differential_pressure_p_sensor
name: "Cold Plate Microchannel Differential Pressure (\u0394 P) Sensor"
domain_id: 47
domain_title: High-Performance Computing (HPC) & Liquid Cooling Thermal/Fluid Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15328
interface: Piezoresistive Diaphragm Sensor
description: "Cold Plate Microchannel Differential Pressure (\u0394 P) Sensor is a\
  \ specialized Domain 47 (High-Performance Computing (HPC) & Liquid Cooling Thermal/Fluid\
  \ Sensors) cyber-physical monitoring sensor. Interfacing directly via Piezoresistive\
  \ Diaphragm Sensor, it is specifically engineered to mitigate and detect Microchannel\
  \ particulate clogging, localized GPU core thermal throttling. In the Aryorithm\
  \ edge architecture, it continuously asserts the operational invariant: Fluid pressure\
  \ drop: \u0394 P = f \\cdot \\frac{L}{D_h} \\cdot \\frac{\\rho v^2}{2}; sudden \u0394\
  \ P spike with normal pump flow flags copper micro-fin fouling.. Any divergence\
  \ between commanded network state and this physical reading triggers sub-microsecond\
  \ in-kernel eBPF packet mitigation."
target_threat: Microchannel particulate clogging, localized GPU core thermal throttling
core_invariant: "Fluid pressure drop: \u0394 P = f \\cdot \\frac{L}{D_h} \\cdot \\\
  frac{\\rho v^2}{2}; sudden \u0394 P spike with normal pump flow flags copper micro-fin\
  \ fouling."
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40121:
      name: s328_cold_plate_microchannel_differential_pressure_p_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40123:
      name: s328_cold_plate_microchannel_differential_pressure_p_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s328_cold_plate_microchannel_differential_pressure_p_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Microchannel particulate clogging, localized GPU
    core thermal throttling'
