sensor_id: s330_cooling_distribution_unit_cdu_manifold_flow_sensor
name: Cooling Distribution Unit (CDU) Manifold Flow Sensor
domain_id: 47
domain_title: High-Performance Computing (HPC) & Liquid Cooling Thermal/Fluid Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15330
interface: Ultrasonic Transit-Time Flowmeter
description: 'Cooling Distribution Unit (CDU) Manifold Flow Sensor is a specialized
  Domain 47 (High-Performance Computing (HPC) & Liquid Cooling Thermal/Fluid Sensors)
  cyber-physical monitoring sensor. Interfacing directly via Ultrasonic Transit-Time
  Flowmeter, it is specifically engineered to mitigate and detect Uneven cooling distribution
  across rack blades, thermal hot-spotting. In the Aryorithm edge architecture, it
  continuously asserts the operational invariant: Conservation of coolant mass: \dot{m}_{total}
  = \sum_{k=1}^N \dot{m}_{blade, k}; mass imbalance indicates flow-loop diversion
  or bypass.. Any divergence between commanded network state and this physical reading
  triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Uneven cooling distribution across rack blades, thermal hot-spotting
core_invariant: 'Conservation of coolant mass: \dot{m}_{total} = \sum_{k=1}^N \dot{m}_{blade,
  k}; mass imbalance indicates flow-loop diversion or bypass.'
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40141:
      name: s330_cooling_distribution_unit_cdu_manifold_flow_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40143:
      name: s330_cooling_distribution_unit_cdu_manifold_flow_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s330_cooling_distribution_unit_cdu_manifold_flow_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Uneven cooling distribution across rack blades, thermal
    hot-spotting'
