sensor_id: s027_near_field_magnetic_h_probe_sensor
name: Near-Field Magnetic H-Probe Sensor
domain_id: 4
domain_title: Radio Frequency, GNSS & Electromagnetic Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15027
interface: Spectrum Analyzer / ADC
description: 'Near-Field Magnetic H-Probe Sensor is a specialized Domain 04 (Radio
  Frequency, GNSS & Electromagnetic Sensors) cyber-physical monitoring sensor. Interfacing
  directly via Spectrum Analyzer / ADC, it is specifically engineered to mitigate
  and detect Side-channel electromagnetic leakage (Tempest attacks). In the Aryorithm
  edge architecture, it continuously asserts the operational invariant: Detects periodic
  EM radiation matching CPU memory bus access rhythms.. Any divergence between commanded
  network state and this physical reading triggers sub-microsecond in-kernel eBPF
  packet mitigation.'
target_threat: Side-channel electromagnetic leakage (Tempest attacks)
core_invariant: Detects periodic EM radiation matching CPU memory bus access rhythms.
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40261:
      name: s027_near_field_magnetic_h_probe_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40263:
      name: s027_near_field_magnetic_h_probe_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s027_near_field_magnetic_h_probe_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Side-channel electromagnetic leakage (Tempest attacks)'
