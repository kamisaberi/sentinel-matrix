sensor_id: s085_geiger_m_ller_gm_radiation_counter
name: "Geiger-M\xFCller (GM) Radiation Counter"
domain_id: 13
domain_title: Nuclear, Radiological & Particle Detection Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15085
interface: High-Voltage Pulse Inverter (GPIO)
description: "Geiger-M\xFCller (GM) Radiation Counter is a specialized Domain 13 (Nuclear,\
  \ Radiological & Particle Detection Sensors) cyber-physical monitoring sensor. Interfacing\
  \ directly via High-Voltage Pulse Inverter (GPIO), it is specifically engineered\
  \ to mitigate and detect Radioactive isotope theft, dirty bomb deployment, cobalt-60\
  \ spill. In the Aryorithm edge architecture, it continuously asserts the operational\
  \ invariant: Dose rate \\dot{D} <= Background + 3\\sigma; sudden count rate spike\
  \ (> 100\\,\xB5Sv/h) locks down facility air handlers.. Any divergence between commanded\
  \ network state and this physical reading triggers sub-microsecond in-kernel eBPF\
  \ packet mitigation."
target_threat: Radioactive isotope theft, dirty bomb deployment, cobalt-60 spill
core_invariant: "Dose rate \\dot{D} <= Background + 3\\sigma; sudden count rate spike\
  \ (> 100\\,\xB5Sv/h) locks down facility air handlers."
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40341:
      name: s085_geiger_m_ller_gm_radiation_counter_pv
      type: float32
      scale: 1.0
      unit: dBm
    40343:
      name: s085_geiger_m_ller_gm_radiation_counter_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s085_geiger_m_ller_gm_radiation_counter_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Radioactive isotope theft, dirty bomb deployment,
    cobalt-60 spill'
