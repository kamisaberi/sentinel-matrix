sensor_id: s026_antenna_vswr_voltage_standing_wave_ratio_sensor
name: Antenna VSWR (Voltage Standing Wave Ratio) Sensor
domain_id: 4
domain_title: Radio Frequency, GNSS & Electromagnetic Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15026
interface: Directional RF Coupler
description: 'Antenna VSWR (Voltage Standing Wave Ratio) Sensor is a specialized Domain
  04 (Radio Frequency, GNSS & Electromagnetic Sensors) cyber-physical monitoring sensor.
  Interfacing directly via Directional RF Coupler, it is specifically engineered to
  mitigate and detect Physical antenna disconnection, cable cutting, shielding. In
  the Aryorithm edge architecture, it continuously asserts the operational invariant:
  VSWR > 2.0:1 indicates antenna damage or intentional RF cage placement.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Physical antenna disconnection, cable cutting, shielding
core_invariant: VSWR > 2.0:1 indicates antenna damage or intentional RF cage placement.
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40251:
      name: s026_antenna_vswr_voltage_standing_wave_ratio_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40253:
      name: s026_antenna_vswr_voltage_standing_wave_ratio_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s026_antenna_vswr_voltage_standing_wave_ratio_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Physical antenna disconnection, cable cutting, shielding'
