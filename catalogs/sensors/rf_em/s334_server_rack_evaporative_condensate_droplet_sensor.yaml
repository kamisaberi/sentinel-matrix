sensor_id: s334_server_rack_evaporative_condensate_droplet_sensor
name: Server Rack Evaporative Condensate Droplet Sensor
domain_id: 47
domain_title: High-Performance Computing (HPC) & Liquid Cooling Thermal/Fluid Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15334
interface: Interdigitated Gold Comb Electrodes
description: 'Server Rack Evaporative Condensate Droplet Sensor is a specialized Domain
  47 (High-Performance Computing (HPC) & Liquid Cooling Thermal/Fluid Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Interdigitated Gold Comb Electrodes,
  it is specifically engineered to mitigate and detect Humidity condensation on cold
  water lines, motherboard corrosion. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Surface impedance drops from > 10\,M\Omega \to
  < 10\,k\Omega on water condensation; raises supply water temperature above dew point..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Humidity condensation on cold water lines, motherboard corrosion
core_invariant: Surface impedance drops from > 10\,M\Omega \to < 10\,k\Omega on water
  condensation; raises supply water temperature above dew point.
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40181:
      name: s334_server_rack_evaporative_condensate_droplet_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40183:
      name: s334_server_rack_evaporative_condensate_droplet_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s334_server_rack_evaporative_condensate_droplet_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Humidity condensation on cold water lines, motherboard
    corrosion'
