sensor_id: s090_continuous_alpha_air_monitor_cam
name: Continuous Alpha Air Monitor (CAM)
domain_id: 13
domain_title: Nuclear, Radiological & Particle Detection Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15090
interface: Silicon Surface Barrier Detector
description: 'Continuous Alpha Air Monitor (CAM) is a specialized Domain 13 (Nuclear,
  Radiological & Particle Detection Sensors) cyber-physical monitoring sensor. Interfacing
  directly via Silicon Surface Barrier Detector, it is specifically engineered to
  mitigate and detect Inhaled transuranic aerosol release, plutonium glovebox breach.
  In the Aryorithm edge architecture, it continuously asserts the operational invariant:
  Radon background stripping via alpha energy peak fitting (5.15\,MeV for ^{239}Pu
  vs 6.0--8.78\,MeV for radon daughters).. Any divergence between commanded network
  state and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Inhaled transuranic aerosol release, plutonium glovebox breach
core_invariant: Radon background stripping via alpha energy peak fitting (5.15\,MeV
  for ^{239}Pu vs 6.0--8.78\,MeV for radon daughters).
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40391:
      name: s090_continuous_alpha_air_monitor_cam_pv
      type: float32
      scale: 1.0
      unit: dBm
    40393:
      name: s090_continuous_alpha_air_monitor_cam_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s090_continuous_alpha_air_monitor_cam_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Inhaled transuranic aerosol release, plutonium glovebox
    breach'
