sensor_id: s437_host_rock_thermal_conduction_thermocouple_array
name: Host Rock Thermal Conduction Thermocouple Array
domain_id: 62
domain_title: Deep Underground Geological Radioactive Waste Repository (DGR) Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15437
interface: Armored Type K Thermocouple String
description: 'Host Rock Thermal Conduction Thermocouple Array is a specialized Domain
  62 (Deep Underground Geological Radioactive Waste Repository (DGR) Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Armored Type K Thermocouple String,
  it is specifically engineered to mitigate and detect Canister decay heat dissipation
  failure, host rock thermal fracture. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Bedrock temperature: T_{rock} <= 100^\circC;
  prevents steam generation and boiling expansion in the surrounding geological barrier..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Canister decay heat dissipation failure, host rock thermal fracture
core_invariant: 'Bedrock temperature: T_{rock} <= 100^\circC; prevents steam generation
  and boiling expansion in the surrounding geological barrier.'
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40111:
      name: s437_host_rock_thermal_conduction_thermocouple_array_pv
      type: float32
      scale: 1.0
      unit: dBm
    40113:
      name: s437_host_rock_thermal_conduction_thermocouple_array_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s437_host_rock_thermal_conduction_thermocouple_array_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Canister decay heat dissipation failure, host rock
    thermal fracture'
