sensor_id: s356_waveguide_dual_directional_coupler_power_tap
name: Waveguide Dual Directional Coupler Power Tap
domain_id: 51
domain_title: Industrial Microwave & RF Dielectric Processing Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15356
interface: Calibrated RF Diode Detector (2.45\,GHz)
description: "Waveguide Dual Directional Coupler Power Tap is a specialized Domain\
  \ 51 (Industrial Microwave & RF Dielectric Processing Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via Calibrated RF Diode Detector (2.45\\,GHz), it\
  \ is specifically engineered to mitigate and detect Magnetron catastrophic reflected\
  \ power damage, load mismatch. In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Voltage Standing Wave Ratio: VSWR = \\frac{1\
  \ + \\sqrt{P_r / P_f}}{1 - \\sqrt{P_r / P_f}} <= 2.0; high reflected power trips\
  \ anode power in < 10\\,\xB5s.. Any divergence between commanded network state and\
  \ this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Magnetron catastrophic reflected power damage, load mismatch
core_invariant: "Voltage Standing Wave Ratio: VSWR = \\frac{1 + \\sqrt{P_r / P_f}}{1\
  \ - \\sqrt{P_r / P_f}} <= 2.0; high reflected power trips anode power in < 10\\\
  ,\xB5s."
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40391:
      name: s356_waveguide_dual_directional_coupler_power_tap_pv
      type: float32
      scale: 1.0
      unit: dBm
    40393:
      name: s356_waveguide_dual_directional_coupler_power_tap_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s356_waveguide_dual_directional_coupler_power_tap_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Magnetron catastrophic reflected power damage, load
    mismatch'
