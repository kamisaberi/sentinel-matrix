sensor_id: s086_thallium_doped_sodium_iodide_nai_tl_scintillator
name: Thallium-Doped Sodium Iodide (NaI:Tl) Scintillator
domain_id: 13
domain_title: Nuclear, Radiological & Particle Detection Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15086
interface: Multi-Channel Analyzer (MCA) via USB
description: 'Thallium-Doped Sodium Iodide (NaI:Tl) Scintillator is a specialized
  Domain 13 (Nuclear, Radiological & Particle Detection Sensors) cyber-physical monitoring
  sensor. Interfacing directly via Multi-Channel Analyzer (MCA) via USB, it is specifically
  engineered to mitigate and detect Enriched uranium (^{235}U) / plutonium (^{239}Pu)
  diversion. In the Aryorithm edge architecture, it continuously asserts the operational
  invariant: 1024-channel gamma spectroscopy isolates specific isotope energy photopeaks
  (185.7\,keV for ^{235}U, 662\,keV for ^{137}Cs).. Any divergence between commanded
  network state and this physical reading triggers sub-microsecond in-kernel eBPF
  packet mitigation.'
target_threat: Enriched uranium (^{235}U) / plutonium (^{239}Pu) diversion
core_invariant: 1024-channel gamma spectroscopy isolates specific isotope energy photopeaks
  (185.7\,keV for ^{235}U, 662\,keV for ^{137}Cs).
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40351:
      name: s086_thallium_doped_sodium_iodide_nai_tl_scintillator_pv
      type: float32
      scale: 1.0
      unit: dBm
    40353:
      name: s086_thallium_doped_sodium_iodide_nai_tl_scintillator_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s086_thallium_doped_sodium_iodide_nai_tl_scintillator_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Enriched uranium (^{235}U) / plutonium (^{239}Pu)
    diversion'
