sensor_id: s357_fluoroptic_fiber_optic_temperature_sensor
name: Fluoroptic Fiber-Optic Temperature Sensor
domain_id: 51
domain_title: Industrial Microwave & RF Dielectric Processing Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15357
interface: Gallium Arsenide (GaAs) Crystal Probe
description: "Fluoroptic Fiber-Optic Temperature Sensor is a specialized Domain 51\
  \ (Industrial Microwave & RF Dielectric Processing Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via Gallium Arsenide (GaAs) Crystal Probe, it is\
  \ specifically engineered to mitigate and detect Material thermal runaway in intense\
  \ microwave electromagnetic field. In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Fluorescence decay time \\tau \u221D T; metal-free\
  \ optical sensor immune to microwave arcing; prevents internal product combustion..\
  \ Any divergence between commanded network state and this physical reading triggers\
  \ sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Material thermal runaway in intense microwave electromagnetic field
core_invariant: "Fluorescence decay time \\tau \u221D T; metal-free optical sensor\
  \ immune to microwave arcing; prevents internal product combustion."
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40401:
      name: s357_fluoroptic_fiber_optic_temperature_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40403:
      name: s357_fluoroptic_fiber_optic_temperature_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s357_fluoroptic_fiber_optic_temperature_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Material thermal runaway in intense microwave electromagnetic
    field'
