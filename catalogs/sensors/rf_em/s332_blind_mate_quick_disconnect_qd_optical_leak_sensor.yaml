sensor_id: s332_blind_mate_quick_disconnect_qd_optical_leak_sensor
name: Blind-Mate Quick Disconnect (QD) Optical Leak Sensor
domain_id: 47
domain_title: High-Performance Computing (HPC) & Liquid Cooling Thermal/Fluid Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15332
interface: Micro-Optical Reflectance Sensor
description: 'Blind-Mate Quick Disconnect (QD) Optical Leak Sensor is a specialized
  Domain 47 (High-Performance Computing (HPC) & Liquid Cooling Thermal/Fluid Sensors)
  cyber-physical monitoring sensor. Interfacing directly via Micro-Optical Reflectance
  Sensor, it is specifically engineered to mitigate and detect Drip-leak at rack disconnect
  point, catastrophic fluid loss. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Reflective index shift at optical prism interface
  detects liquid droplets (< 0.1\,mL) in < 50\,ms, isolating the rack shutoff valve..
  Any divergence between commanded network state and this physical reading triggers
  sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Drip-leak at rack disconnect point, catastrophic fluid loss
core_invariant: Reflective index shift at optical prism interface detects liquid droplets
  (< 0.1\,mL) in < 50\,ms, isolating the rack shutoff valve.
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40161:
      name: s332_blind_mate_quick_disconnect_qd_optical_leak_sensor_pv
      type: float32
      scale: 1.0
      unit: dBm
    40163:
      name: s332_blind_mate_quick_disconnect_qd_optical_leak_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s332_blind_mate_quick_disconnect_qd_optical_leak_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Drip-leak at rack disconnect point, catastrophic
    fluid loss'
