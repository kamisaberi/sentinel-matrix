sensor_id: s362_waveguide_optical_arc_flash_photodiode_detector
name: Waveguide Optical Arc-Flash Photodiode Detector
domain_id: 51
domain_title: Industrial Microwave & RF Dielectric Processing Sensors
category: RF_EM
target_protocol: MODBUS_TCP
default_port: 15362
interface: Solar-Blind Fast Optical Transducer
description: "Waveguide Optical Arc-Flash Photodiode Detector is a specialized Domain\
  \ 51 (Industrial Microwave & RF Dielectric Processing Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via Solar-Blind Fast Optical Transducer, it is specifically\
  \ engineered to mitigate and detect Waveguide electrical plasma arcing, waveguide\
  \ melt-through. In the Aryorithm edge architecture, it continuously asserts the\
  \ operational invariant: Optical arc light pulse rise time < 5\\,\xB5s; arc detection\
  \ triggers high-voltage thyristor crowbar in < 100\\,ns to extinguish the arc..\
  \ Any divergence between commanded network state and this physical reading triggers\
  \ sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Waveguide electrical plasma arcing, waveguide melt-through
core_invariant: "Optical arc light pulse rise time < 5\\,\xB5s; arc detection triggers\
  \ high-voltage thyristor crowbar in < 100\\,ns to extinguish the arc."
physics:
  engine: rf_signal_sdr
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: dBm
registers:
  holding_registers:
    40451:
      name: s362_waveguide_optical_arc_flash_photodiode_detector_pv
      type: float32
      scale: 1.0
      unit: dBm
    40453:
      name: s362_waveguide_optical_arc_flash_photodiode_detector_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s362_waveguide_optical_arc_flash_photodiode_detector_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Waveguide electrical plasma arcing, waveguide melt-through'
