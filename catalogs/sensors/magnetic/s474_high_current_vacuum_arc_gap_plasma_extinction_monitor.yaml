sensor_id: s474_high_current_vacuum_arc_gap_plasma_extinction_monitor
name: High-Current Vacuum Arc Gap Plasma Extinction Monitor
domain_id: 67
domain_title: Superconducting Magnetic Energy Storage (SMES) & Pulsed Power Sensors
category: MAGNETIC
target_protocol: MODBUS_TCP
default_port: 15474
interface: Fiber-Coupled High-Speed Photodetector
description: "High-Current Vacuum Arc Gap Plasma Extinction Monitor is a specialized\
  \ Domain 67 (Superconducting Magnetic Energy Storage (SMES) & Pulsed Power Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via Fiber-Coupled High-Speed\
  \ Photodetector, it is specifically engineered to mitigate and detect Vacuum switch\
  \ re-ignition, continuous DC short-circuit arc. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Plasma emission light intensity:\
  \ I_{arc} \\to 0 after current zero-crossing; re-strike detection triggers backup\
  \ explosive isolation switches in < 200\\,\xB5s.. Any divergence between commanded\
  \ network state and this physical reading triggers sub-microsecond in-kernel eBPF\
  \ packet mitigation."
target_threat: Vacuum switch re-ignition, continuous DC short-circuit arc
core_invariant: "Plasma emission light intensity: I_{arc} \\to 0 after current zero-crossing;\
  \ re-strike detection triggers backup explosive isolation switches in < 200\\,\xB5\
  s."
physics:
  engine: magnetic_flux
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: uT
registers:
  holding_registers:
    40481:
      name: s474_high_current_vacuum_arc_gap_plasma_extinction_monitor_pv
      type: float32
      scale: 1.0
      unit: uT
    40483:
      name: s474_high_current_vacuum_arc_gap_plasma_extinction_monitor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s474_high_current_vacuum_arc_gap_plasma_extinction_monitor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Vacuum switch re-ignition, continuous DC short-circuit
    arc'
