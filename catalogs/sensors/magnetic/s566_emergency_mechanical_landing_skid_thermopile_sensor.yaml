sensor_id: s566_emergency_mechanical_landing_skid_thermopile_sensor
name: Emergency Mechanical Landing Skid Thermopile Sensor
domain_id: 80
domain_title: Rail Transit Magnetic Levitation (EMS/EDS) Levitation Gap Sensors
category: MAGNETIC
target_protocol: MODBUS_TCP
default_port: 15566
interface: Non-Contact Fast Infrared Pyrometer
description: 'Emergency Mechanical Landing Skid Thermopile Sensor is a specialized
  Domain 80 (Rail Transit Magnetic Levitation (EMS/EDS) Levitation Gap Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Non-Contact Fast Infrared Pyrometer,
  it is specifically engineered to mitigate and detect Inadvertent skid deployment
  at speed, friction weld of skid to track. In the Aryorithm edge architecture, it
  continuously asserts the operational invariant: Skid contact temperature: T_{skid}
  <= 650^\circC; thermal spike confirms physical track contact, commanding immediate
  magnetic levitation boost.. Any divergence between commanded network state and this
  physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Inadvertent skid deployment at speed, friction weld of skid to track
core_invariant: 'Skid contact temperature: T_{skid} <= 650^\circC; thermal spike confirms
  physical track contact, commanding immediate magnetic levitation boost.'
physics:
  engine: magnetic_flux
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: uT
registers:
  holding_registers:
    40331:
      name: s566_emergency_mechanical_landing_skid_thermopile_sensor_pv
      type: float32
      scale: 1.0
      unit: uT
    40333:
      name: s566_emergency_mechanical_landing_skid_thermopile_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s566_emergency_mechanical_landing_skid_thermopile_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Inadvertent skid deployment at speed, friction weld
    of skid to track'
