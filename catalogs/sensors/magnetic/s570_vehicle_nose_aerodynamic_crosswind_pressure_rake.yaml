sensor_id: s570_vehicle_nose_aerodynamic_crosswind_pressure_rake
name: Vehicle Nose Aerodynamic Crosswind Pressure Rake
domain_id: 80
domain_title: Rail Transit Magnetic Levitation (EMS/EDS) Levitation Gap Sensors
category: MAGNETIC
target_protocol: MODBUS_TCP
default_port: 15570
interface: 7-Hole Multi-Directional Pitot System
description: "Vehicle Nose Aerodynamic Crosswind Pressure Rake is a specialized Domain\
  \ 80 (Rail Transit Magnetic Levitation (EMS/EDS) Levitation Gap Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via 7-Hole Multi-Directional Pitot System,\
  \ it is specifically engineered to mitigate and detect High-speed tunnel entry pressure\
  \ wave shock, vehicle derailment moment. In the Aryorithm edge architecture, it\
  \ continuously asserts the operational invariant: Micro-pressure wave amplitude:\
  \ \u0394 P_{wave} <= 2.5\\,kPa; excessive aerodynamic roll moment commands automated\
  \ speed throttling.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: High-speed tunnel entry pressure wave shock, vehicle derailment moment
core_invariant: "Micro-pressure wave amplitude: \u0394 P_{wave} <= 2.5\\,kPa; excessive\
  \ aerodynamic roll moment commands automated speed throttling."
physics:
  engine: magnetic_flux
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: uT
registers:
  holding_registers:
    40361:
      name: s570_vehicle_nose_aerodynamic_crosswind_pressure_rake_pv
      type: float32
      scale: 1.0
      unit: uT
    40363:
      name: s570_vehicle_nose_aerodynamic_crosswind_pressure_rake_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s570_vehicle_nose_aerodynamic_crosswind_pressure_rake_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: High-speed tunnel entry pressure wave shock, vehicle
    derailment moment'
