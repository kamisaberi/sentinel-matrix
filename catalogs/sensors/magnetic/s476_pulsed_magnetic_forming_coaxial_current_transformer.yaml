sensor_id: s476_pulsed_magnetic_forming_coaxial_current_transformer
name: Pulsed Magnetic Forming Coaxial Current Transformer
domain_id: 67
domain_title: Superconducting Magnetic Energy Storage (SMES) & Pulsed Power Sensors
category: MAGNETIC
target_protocol: MODBUS_TCP
default_port: 15476
interface: High-Current Pearson Coil (100 kA)
description: "Pulsed Magnetic Forming Coaxial Current Transformer is a specialized\
  \ Domain 67 (Superconducting Magnetic Energy Storage (SMES) & Pulsed Power Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via High-Current Pearson\
  \ Coil (100 kA), it is specifically engineered to mitigate and detect Forming coil\
  \ mechanical rupture, workpiece arc flashover. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Peak discharge current: I_{pulse}\
  \ <= I_{coil\\_burst\\_rating}; instantaneous energy integral \u2208t I^2 dt limits\
  \ coil thermal fatigue.. Any divergence between commanded network state and this\
  \ physical reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Forming coil mechanical rupture, workpiece arc flashover
core_invariant: "Peak discharge current: I_{pulse} <= I_{coil\\_burst\\_rating}; instantaneous\
  \ energy integral \u2208t I^2 dt limits coil thermal fatigue."
physics:
  engine: magnetic_flux
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: uT
registers:
  holding_registers:
    40001:
      name: s476_pulsed_magnetic_forming_coaxial_current_transformer_pv
      type: float32
      scale: 1.0
      unit: uT
    40003:
      name: s476_pulsed_magnetic_forming_coaxial_current_transformer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s476_pulsed_magnetic_forming_coaxial_current_transformer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Forming coil mechanical rupture, workpiece arc flashover'
