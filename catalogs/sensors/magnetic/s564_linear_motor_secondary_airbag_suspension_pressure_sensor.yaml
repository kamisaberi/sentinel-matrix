sensor_id: s564_linear_motor_secondary_airbag_suspension_pressure_sensor
name: Linear Motor Secondary Airbag Suspension Pressure Sensor
domain_id: 80
domain_title: Rail Transit Magnetic Levitation (EMS/EDS) Levitation Gap Sensors
category: MAGNETIC
target_protocol: MODBUS_TCP
default_port: 15564
interface: Dual Piezoresistive Pressure Cells
description: 'Linear Motor Secondary Airbag Suspension Pressure Sensor is a specialized
  Domain 80 (Rail Transit Magnetic Levitation (EMS/EDS) Levitation Gap Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Dual Piezoresistive Pressure Cells,
  it is specifically engineered to mitigate and detect Pneumatic suspension deflation,
  passenger cabin track collision. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Secondary airbag pressure: P_{airbag} >= 4.5\,bar;
  pressure loss commands automatic vehicle deceleration and auxiliary support.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Pneumatic suspension deflation, passenger cabin track collision
core_invariant: 'Secondary airbag pressure: P_{airbag} >= 4.5\,bar; pressure loss
  commands automatic vehicle deceleration and auxiliary support.'
physics:
  engine: magnetic_flux
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: uT
registers:
  holding_registers:
    40311:
      name: s564_linear_motor_secondary_airbag_suspension_pressure_sensor_pv
      type: float32
      scale: 1.0
      unit: uT
    40313:
      name: s564_linear_motor_secondary_airbag_suspension_pressure_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s564_linear_motor_secondary_airbag_suspension_pressure_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Pneumatic suspension deflation, passenger cabin track
    collision'
