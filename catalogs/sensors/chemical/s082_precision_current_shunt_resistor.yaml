sensor_id: s082_precision_current_shunt_resistor
name: Precision Current Shunt Resistor
domain_id: 12
domain_title: High-Voltage Electrical, Arc & Dielectric Breakdown Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15082
interface: Isolated Delta-Sigma ADC (24-bit)
description: "Precision Current Shunt Resistor is a specialized Domain 12 (High-Voltage\
  \ Electrical, Arc & Dielectric Breakdown Sensors) cyber-physical monitoring sensor.\
  \ Interfacing directly via Isolated Delta-Sigma ADC (24-bit), it is specifically\
  \ engineered to mitigate and detect Battery cell balance tampering, BMS current-measurement\
  \ bypass. In the Aryorithm edge architecture, it continuously asserts the operational\
  \ invariant: Continuous Coulomb counting integration \u2208t I(t) dt; verifies battery\
  \ pack state-of-charge conservation laws.. Any divergence between commanded network\
  \ state and this physical reading triggers sub-microsecond in-kernel eBPF packet\
  \ mitigation."
target_threat: Battery cell balance tampering, BMS current-measurement bypass
core_invariant: "Continuous Coulomb counting integration \u2208t I(t) dt; verifies\
  \ battery pack state-of-charge conservation laws."
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40311:
      name: s082_precision_current_shunt_resistor_pv
      type: float32
      scale: 1.0
      unit: ppm
    40313:
      name: s082_precision_current_shunt_resistor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s082_precision_current_shunt_resistor_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Battery cell balance tampering, BMS current-measurement
    bypass'
