sensor_id: s411_bog_fuel_gas_supply_skid_gas_odorant_mass_sensor
name: BOG Fuel Gas Supply Skid Gas Odorant Mass Sensor
domain_id: 58
domain_title: Liquefied Natural Gas (LNG) Carrier Tank Sloshing & Boil-Off Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15411
interface: Gas Chromatograph / Flame Photometric Detector
description: 'BOG Fuel Gas Supply Skid Gas Odorant Mass Sensor is a specialized Domain
  58 (Liquefied Natural Gas (LNG) Carrier Tank Sloshing & Boil-Off Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Gas Chromatograph / Flame Photometric
  Detector, it is specifically engineered to mitigate and detect Odorant injection
  failure, undetectable methane leaks in ship engine rooms. In the Aryorithm edge
  architecture, it continuously asserts the operational invariant: Tetrahydrothiophene
  (THT) odorant concentration: [THT] >= 15\,mg/m^3; starvation halts gas delivery
  to dual-fuel engines.. Any divergence between commanded network state and this physical
  reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Odorant injection failure, undetectable methane leaks in ship engine
  rooms
core_invariant: 'Tetrahydrothiophene (THT) odorant concentration: [THT] >= 15\,mg/m^3;
  starvation halts gas delivery to dual-fuel engines.'
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40371:
      name: s411_bog_fuel_gas_supply_skid_gas_odorant_mass_sensor_pv
      type: float32
      scale: 1.0
      unit: ppm
    40373:
      name: s411_bog_fuel_gas_supply_skid_gas_odorant_mass_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s411_bog_fuel_gas_supply_skid_gas_odorant_mass_sensor_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Odorant injection failure, undetectable methane leaks
    in ship engine rooms'
