sensor_id: s080_surge_arrester_resistive_leakage_current_monitor
name: Surge Arrester Resistive Leakage Current Monitor
domain_id: 12
domain_title: High-Voltage Electrical, Arc & Dielectric Breakdown Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15080
interface: High-Accuracy Hall Sensor / Modbus
description: "Surge Arrester Resistive Leakage Current Monitor is a specialized Domain\
  \ 12 (High-Voltage Electrical, Arc & Dielectric Breakdown Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via High-Accuracy Hall Sensor / Modbus,\
  \ it is specifically engineered to mitigate and detect Metal-Oxide Varistor (MOV)\
  \ thermal runaway, arrester explosion. In the Aryorithm edge architecture, it continuously\
  \ asserts the operational invariant: Extracts 3rd harmonic resistive leakage current\
  \ component I_{3r}; I_{3r} > 50\\,\xB5A indicates moisture ingress or thermal breakdown..\
  \ Any divergence between commanded network state and this physical reading triggers\
  \ sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Metal-Oxide Varistor (MOV) thermal runaway, arrester explosion
core_invariant: "Extracts 3rd harmonic resistive leakage current component I_{3r};\
  \ I_{3r} > 50\\,\xB5A indicates moisture ingress or thermal breakdown."
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40291:
      name: s080_surge_arrester_resistive_leakage_current_monitor_pv
      type: float32
      scale: 1.0
      unit: ppm
    40293:
      name: s080_surge_arrester_resistive_leakage_current_monitor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s080_surge_arrester_resistive_leakage_current_monitor_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Metal-Oxide Varistor (MOV) thermal runaway, arrester
    explosion'
