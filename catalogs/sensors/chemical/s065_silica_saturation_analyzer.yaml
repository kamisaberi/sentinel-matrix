sensor_id: s065_silica_saturation_analyzer
name: Silica Saturation Analyzer
domain_id: 10
domain_title: Chemical, Gas & Dielectric Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15065
interface: Photometric Analyzer
description: 'Silica Saturation Analyzer is a specialized Domain 10 (Chemical, Gas
  & Dielectric Sensors) cyber-physical monitoring sensor. Interfacing directly via
  Photometric Analyzer, it is specifically engineered to mitigate and detect Geothermal
  flash turbine scaling, reinjection well clogging. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Silica Saturation Index (SSI
  <= 1.0) enforced by automatic acid dosing override.. Any divergence between commanded
  network state and this physical reading triggers sub-microsecond in-kernel eBPF
  packet mitigation.'
target_threat: Geothermal flash turbine scaling, reinjection well clogging
core_invariant: Silica Saturation Index (SSI <= 1.0) enforced by automatic acid dosing
  override.
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40141:
      name: s065_silica_saturation_analyzer_pv
      type: float32
      scale: 1.0
      unit: ppm
    40143:
      name: s065_silica_saturation_analyzer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s065_silica_saturation_analyzer_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Geothermal flash turbine scaling, reinjection well
    clogging'
