sensor_id: s066_high_frequency_current_transformer_hfct_partial_discharge
name: High-Frequency Current Transformer (HFCT) Partial Discharge
domain_id: 10
domain_title: Chemical, Gas & Dielectric Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15066
interface: 250 MSPS High-Speed ADC
description: 'High-Frequency Current Transformer (HFCT) Partial Discharge is a specialized
  Domain 10 (Chemical, Gas & Dielectric Sensors) cyber-physical monitoring sensor.
  Interfacing directly via 250 MSPS High-Speed ADC, it is specifically engineered
  to mitigate and detect Underground XLPE transmission cable insulation breakdown.
  In the Aryorithm edge architecture, it continuously asserts the operational invariant:
  Sub-nanosecond partial discharge pulses cluster on PRPD patterns, warning months
  early.. Any divergence between commanded network state and this physical reading
  triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Underground XLPE transmission cable insulation breakdown
core_invariant: Sub-nanosecond partial discharge pulses cluster on PRPD patterns,
  warning months early.
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40151:
      name: s066_high_frequency_current_transformer_hfct_partial_discharge_pv
      type: float32
      scale: 1.0
      unit: ppm
    40153:
      name: s066_high_frequency_current_transformer_hfct_partial_discharge_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s066_high_frequency_current_transformer_hfct_partial_discharge_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Underground XLPE transmission cable insulation breakdown'
