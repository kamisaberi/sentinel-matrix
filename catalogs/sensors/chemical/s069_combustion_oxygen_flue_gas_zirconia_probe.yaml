sensor_id: s069_combustion_oxygen_flue_gas_zirconia_probe
name: Combustion Oxygen Flue Gas Zirconia Probe
domain_id: 10
domain_title: Chemical, Gas & Dielectric Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15069
interface: High-Temperature Zirconia Cell
description: 'Combustion Oxygen Flue Gas Zirconia Probe is a specialized Domain 10
  (Chemical, Gas & Dielectric Sensors) cyber-physical monitoring sensor. Interfacing
  directly via High-Temperature Zirconia Cell, it is specifically engineered to mitigate
  and detect Boiler unburned fuel accumulation, furnace explosion. In the Aryorithm
  edge architecture, it continuously asserts the operational invariant: Flue O_2 must
  remain >= 1.5\%; fuel-rich mixtures cut gas supply in < 20\,ms.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Boiler unburned fuel accumulation, furnace explosion
core_invariant: Flue O_2 must remain >= 1.5\%; fuel-rich mixtures cut gas supply in
  < 20\,ms.
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40181:
      name: s069_combustion_oxygen_flue_gas_zirconia_probe_pv
      type: float32
      scale: 1.0
      unit: ppm
    40183:
      name: s069_combustion_oxygen_flue_gas_zirconia_probe_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s069_combustion_oxygen_flue_gas_zirconia_probe_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Boiler unburned fuel accumulation, furnace explosion'
