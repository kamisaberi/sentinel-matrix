sensor_id: s068_boiler_water_cation_conductivity_sensor
name: Boiler Water Cation Conductivity Sensor
domain_id: 10
domain_title: Chemical, Gas & Dielectric Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15068
interface: High-Purity Conductivity Cell
description: "Boiler Water Cation Conductivity Sensor is a specialized Domain 10 (Chemical,\
  \ Gas & Dielectric Sensors) cyber-physical monitoring sensor. Interfacing directly\
  \ via High-Purity Conductivity Cell, it is specifically engineered to mitigate and\
  \ detect Steam condenser tube rupture, corrosive seawater inleakage. In the Aryorithm\
  \ edge architecture, it continuously asserts the operational invariant: Cation conductivity\
  \ > 0.2\\,\xB5S/cm indicates chloride contamination, isolating the condenser.. Any\
  \ divergence between commanded network state and this physical reading triggers\
  \ sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Steam condenser tube rupture, corrosive seawater inleakage
core_invariant: "Cation conductivity > 0.2\\,\xB5S/cm indicates chloride contamination,\
  \ isolating the condenser."
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40171:
      name: s068_boiler_water_cation_conductivity_sensor_pv
      type: float32
      scale: 1.0
      unit: ppm
    40173:
      name: s068_boiler_water_cation_conductivity_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s068_boiler_water_cation_conductivity_sensor_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Steam condenser tube rupture, corrosive seawater
    inleakage'
