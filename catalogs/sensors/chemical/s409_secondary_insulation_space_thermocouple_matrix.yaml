sensor_id: s409_secondary_insulation_space_thermocouple_matrix
name: Secondary Insulation Space Thermocouple Matrix
domain_id: 58
domain_title: Liquefied Natural Gas (LNG) Carrier Tank Sloshing & Boil-Off Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15409
interface: Type T Thermocouple Array on Outer Hull
description: 'Secondary Insulation Space Thermocouple Matrix is a specialized Domain
  58 (Liquefied Natural Gas (LNG) Carrier Tank Sloshing & Boil-Off Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Type T Thermocouple Array on Outer Hull,
  it is specifically engineered to mitigate and detect Inner membrane structural failure,
  cold spot hull steel brittle fracture. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Inner hull temperature: T_{inner\_hull} >= 0^\circC;
  localized cold spot drop (< -10^\circC) trips hull heating water jackets to stop
  brittle fracture.. Any divergence between commanded network state and this physical
  reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Inner membrane structural failure, cold spot hull steel brittle fracture
core_invariant: 'Inner hull temperature: T_{inner\_hull} >= 0^\circC; localized cold
  spot drop (< -10^\circC) trips hull heating water jackets to stop brittle fracture.'
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40351:
      name: s409_secondary_insulation_space_thermocouple_matrix_pv
      type: float32
      scale: 1.0
      unit: ppm
    40353:
      name: s409_secondary_insulation_space_thermocouple_matrix_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s409_secondary_insulation_space_thermocouple_matrix_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Inner membrane structural failure, cold spot hull
    steel brittle fracture'
