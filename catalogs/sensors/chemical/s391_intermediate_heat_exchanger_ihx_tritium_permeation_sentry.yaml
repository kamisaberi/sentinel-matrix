sensor_id: s391_intermediate_heat_exchanger_ihx_tritium_permeation_sentry
name: Intermediate Heat Exchanger (IHX) Tritium Permeation Sentry
domain_id: 55
domain_title: Molten Salt Reactor (MSR) Chemical Reprocessing & Actinide Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15391
interface: Ion Chamber Beta Proportional Counter
description: "Intermediate Heat Exchanger (IHX) Tritium Permeation Sentry is a specialized\
  \ Domain 55 (Molten Salt Reactor (MSR) Chemical Reprocessing & Actinide Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via Ion Chamber Beta Proportional\
  \ Counter, it is specifically engineered to mitigate and detect Tritium (^3H) diffusion\
  \ through heat exchanger walls into secondary loop. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Secondary loop tritium concentration:\
  \ [^3H] <= 0.1\\,\xB5Ci/cm^3; breach activates molten salt stripping gas scrubbers..\
  \ Any divergence between commanded network state and this physical reading triggers\
  \ sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Tritium (^3H) diffusion through heat exchanger walls into secondary
  loop
core_invariant: "Secondary loop tritium concentration: [^3H] <= 0.1\\,\xB5Ci/cm^3;\
  \ breach activates molten salt stripping gas scrubbers."
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40181:
      name: s391_intermediate_heat_exchanger_ihx_tritium_permeation_sentry_pv
      type: float32
      scale: 1.0
      unit: ppm
    40183:
      name: s391_intermediate_heat_exchanger_ihx_tritium_permeation_sentry_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s391_intermediate_heat_exchanger_ihx_tritium_permeation_sentry_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Tritium (^3H) diffusion through heat exchanger walls
    into secondary loop'
