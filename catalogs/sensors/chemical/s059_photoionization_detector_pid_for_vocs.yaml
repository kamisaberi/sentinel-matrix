sensor_id: s059_photoionization_detector_pid_for_vocs
name: Photoionization Detector (PID) for VOCs
domain_id: 10
domain_title: Chemical, Gas & Dielectric Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15059
interface: Analog Voltage / I2C Sensor
description: 'Photoionization Detector (PID) for VOCs is a specialized Domain 10 (Chemical,
  Gas & Dielectric Sensors) cyber-physical monitoring sensor. Interfacing directly
  via Analog Voltage / I2C Sensor, it is specifically engineered to mitigate and detect
  Chemical reactor solvent leaks, vapor cloud explosions. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Flags volatile organic compounds
  before Lower Explosive Limit (LEL > 25\%) is reached.. Any divergence between commanded
  network state and this physical reading triggers sub-microsecond in-kernel eBPF
  packet mitigation.'
target_threat: Chemical reactor solvent leaks, vapor cloud explosions
core_invariant: Flags volatile organic compounds before Lower Explosive Limit (LEL
  > 25\%) is reached.
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40081:
      name: s059_photoionization_detector_pid_for_vocs_pv
      type: float32
      scale: 1.0
      unit: ppm
    40083:
      name: s059_photoionization_detector_pid_for_vocs_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s059_photoionization_detector_pid_for_vocs_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Chemical reactor solvent leaks, vapor cloud explosions'
