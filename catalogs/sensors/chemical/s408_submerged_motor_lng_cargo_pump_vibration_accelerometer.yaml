sensor_id: s408_submerged_motor_lng_cargo_pump_vibration_accelerometer
name: Submerged Motor LNG Cargo Pump Vibration Accelerometer
domain_id: 58
domain_title: Liquefied Natural Gas (LNG) Carrier Tank Sloshing & Boil-Off Sensors
category: CHEMICAL
target_protocol: MODBUS_TCP
default_port: 15408
interface: Cryogenic Submerged Accelerometer (50 kHz)
description: 'Submerged Motor LNG Cargo Pump Vibration Accelerometer is a specialized
  Domain 58 (Liquefied Natural Gas (LNG) Carrier Tank Sloshing & Boil-Off Sensors)
  cyber-physical monitoring sensor. Interfacing directly via Cryogenic Submerged Accelerometer
  (50 kHz), it is specifically engineered to mitigate and detect Pump bearing seizure
  in cryogenic liquid, cavitation vapor lock. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Vibration velocity RMS: v_{vib}
  <= 4.5\,mm/s; high-frequency cavitation spike throttles pump discharge valve.. Any
  divergence between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Pump bearing seizure in cryogenic liquid, cavitation vapor lock
core_invariant: 'Vibration velocity RMS: v_{vib} <= 4.5\,mm/s; high-frequency cavitation
  spike throttles pump discharge valve.'
physics:
  engine: chemical_nernst
  baseline_value: 45.0
  min_value: 0.0
  max_value: 1000.0
  noise_sigma: 0.02
  unit: ppm
registers:
  holding_registers:
    40341:
      name: s408_submerged_motor_lng_cargo_pump_vibration_accelerometer_pv
      type: float32
      scale: 1.0
      unit: ppm
    40343:
      name: s408_submerged_motor_lng_cargo_pump_vibration_accelerometer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s408_submerged_motor_lng_cargo_pump_vibration_accelerometer_fault
  action: step_increase
  value: 25.0
  description: 'Injects anomaly: Pump bearing seizure in cryogenic liquid, cavitation
    vapor lock'
