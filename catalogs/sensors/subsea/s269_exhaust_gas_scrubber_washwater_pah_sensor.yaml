sensor_id: s269_exhaust_gas_scrubber_washwater_pah_sensor
name: Exhaust Gas Scrubber Washwater PAH Sensor
domain_id: 38
domain_title: Autonomous Marine Vessel Propulsion & Ballast Biosecurity Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15269
interface: Optical Fluorescence Spectrometer
description: "Exhaust Gas Scrubber Washwater PAH Sensor is a specialized Domain 38\
  \ (Autonomous Marine Vessel Propulsion & Ballast Biosecurity Sensors) cyber-physical\
  \ monitoring sensor. Interfacing directly via Optical Fluorescence Spectrometer,\
  \ it is specifically engineered to mitigate and detect Environmental illegal discharge\
  \ of acidic, polycyclic aromatic washwater. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Phenanthrene-equivalent PAH\
  \ concentration: PAH <= 50\\,\xB5g/L; water discharge pH must remain >= 6.5; acidic\
  \ discharge diverted to holding tanks.. Any divergence between commanded network\
  \ state and this physical reading triggers sub-microsecond in-kernel eBPF packet\
  \ mitigation."
target_threat: Environmental illegal discharge of acidic, polycyclic aromatic washwater
core_invariant: "Phenanthrene-equivalent PAH concentration: PAH <= 50\\,\xB5g/L; water\
  \ discharge pH must remain >= 6.5; acidic discharge diverted to holding tanks."
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40091:
      name: s269_exhaust_gas_scrubber_washwater_pah_sensor_pv
      type: float32
      scale: 1.0
      unit: m/s
    40093:
      name: s269_exhaust_gas_scrubber_washwater_pah_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s269_exhaust_gas_scrubber_washwater_pah_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Environmental illegal discharge of acidic, polycyclic
    aromatic washwater'
