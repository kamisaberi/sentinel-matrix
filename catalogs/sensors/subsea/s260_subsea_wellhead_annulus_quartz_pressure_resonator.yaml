sensor_id: s260_subsea_wellhead_annulus_quartz_pressure_resonator
name: Subsea Wellhead Annulus Quartz Pressure Resonator
domain_id: 37
domain_title: Subsea Well Intervention, Choke & Hydrate Management Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15260
interface: High-Accuracy Quartz Crystal Gauge
description: 'Subsea Wellhead Annulus Quartz Pressure Resonator is a specialized Domain
  37 (Subsea Well Intervention, Choke & Hydrate Management Sensors) cyber-physical
  monitoring sensor. Interfacing directly via High-Accuracy Quartz Crystal Gauge,
  it is specifically engineered to mitigate and detect Casing-annulus communication,
  subterranean reservoir gas migration. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Long-term pressure drift: \frac{dP}{dt} <= 0.5\,psi/day;
  continuous pressure rise indicates cement sheath failure or casing leak.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Casing-annulus communication, subterranean reservoir gas migration
core_invariant: 'Long-term pressure drift: \frac{dP}{dt} <= 0.5\,psi/day; continuous
  pressure rise indicates cement sheath failure or casing leak.'
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40001:
      name: s260_subsea_wellhead_annulus_quartz_pressure_resonator_pv
      type: float32
      scale: 1.0
      unit: m/s
    40003:
      name: s260_subsea_wellhead_annulus_quartz_pressure_resonator_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s260_subsea_wellhead_annulus_quartz_pressure_resonator_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Casing-annulus communication, subterranean reservoir
    gas migration'
