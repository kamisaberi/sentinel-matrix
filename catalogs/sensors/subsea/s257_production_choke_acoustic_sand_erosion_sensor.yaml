sensor_id: s257_production_choke_acoustic_sand_erosion_sensor
name: Production Choke Acoustic Sand Erosion Sensor
domain_id: 37
domain_title: Subsea Well Intervention, Choke & Hydrate Management Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15257
interface: Clamp-On Ultrasonic Piezoceramic Probe
description: 'Production Choke Acoustic Sand Erosion Sensor is a specialized Domain
  37 (Subsea Well Intervention, Choke & Hydrate Management Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Clamp-On Ultrasonic Piezoceramic Probe,
  it is specifically engineered to mitigate and detect Severe sand erosion of subsea
  choke body, high-pressure hydrocarbon leak. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: Sand impact rate: N_{sand} =
  k \cdot V_{acoustic}^{1.5}; sand production > 10\,kg/day throttles production choke
  to prevent body washout.. Any divergence between commanded network state and this
  physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Severe sand erosion of subsea choke body, high-pressure hydrocarbon
  leak
core_invariant: 'Sand impact rate: N_{sand} = k \cdot V_{acoustic}^{1.5}; sand production
  > 10\,kg/day throttles production choke to prevent body washout.'
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40471:
      name: s257_production_choke_acoustic_sand_erosion_sensor_pv
      type: float32
      scale: 1.0
      unit: m/s
    40473:
      name: s257_production_choke_acoustic_sand_erosion_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s257_production_choke_acoustic_sand_erosion_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Severe sand erosion of subsea choke body, high-pressure
    hydrocarbon leak'
