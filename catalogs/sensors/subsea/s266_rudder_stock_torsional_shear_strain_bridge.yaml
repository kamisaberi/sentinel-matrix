sensor_id: s266_rudder_stock_torsional_shear_strain_bridge
name: Rudder Stock Torsional Shear Strain Bridge
domain_id: 38
domain_title: Autonomous Marine Vessel Propulsion & Ballast Biosecurity Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15266
interface: Full-Bridge Torsional Strain Gauge
description: 'Rudder Stock Torsional Shear Strain Bridge is a specialized Domain 38
  (Autonomous Marine Vessel Propulsion & Ballast Biosecurity Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Full-Bridge Torsional Strain Gauge,
  it is specifically engineered to mitigate and detect Steering gear jamming, excessive
  hydrodynamic load in heavy seas. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Torsional shear stress: \tau = \frac{T \cdot
  r}{J} <= \tau_{yield}; shear load exceeding safety limit commands automated rudder
  angle de-rate.. Any divergence between commanded network state and this physical
  reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Steering gear jamming, excessive hydrodynamic load in heavy seas
core_invariant: 'Torsional shear stress: \tau = \frac{T \cdot r}{J} <= \tau_{yield};
  shear load exceeding safety limit commands automated rudder angle de-rate.'
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40061:
      name: s266_rudder_stock_torsional_shear_strain_bridge_pv
      type: float32
      scale: 1.0
      unit: m/s
    40063:
      name: s266_rudder_stock_torsional_shear_strain_bridge_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s266_rudder_stock_torsional_shear_strain_bridge_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Steering gear jamming, excessive hydrodynamic load
    in heavy seas'
