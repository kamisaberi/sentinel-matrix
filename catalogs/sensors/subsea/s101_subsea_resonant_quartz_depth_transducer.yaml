sensor_id: s101_subsea_resonant_quartz_depth_transducer
name: Subsea Resonant Quartz Depth Transducer
domain_id: 15
domain_title: Deep Marine, Subsea & Oceanographic Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15101
interface: RS-485 / Subsea MUX (0.01\% accuracy)
description: 'Subsea Resonant Quartz Depth Transducer is a specialized Domain 15 (Deep
  Marine, Subsea & Oceanographic Sensors) cyber-physical monitoring sensor. Interfacing
  directly via RS-485 / Subsea MUX (0.01\% accuracy), it is specifically engineered
  to mitigate and detect Submersible crush-depth falsification, seafloor tsunami detection.
  In the Aryorithm edge architecture, it continuously asserts the operational invariant:
  Resonant frequency shift of quartz crystal beam under hydrostatic pressure; detects
  pressure anomalies of < 1\,mm water column.. Any divergence between commanded network
  state and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Submersible crush-depth falsification, seafloor tsunami detection
core_invariant: Resonant frequency shift of quartz crystal beam under hydrostatic
  pressure; detects pressure anomalies of < 1\,mm water column.
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40491:
      name: s101_subsea_resonant_quartz_depth_transducer_pv
      type: float32
      scale: 1.0
      unit: m/s
    40493:
      name: s101_subsea_resonant_quartz_depth_transducer_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s101_subsea_resonant_quartz_depth_transducer_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Submersible crush-depth falsification, seafloor tsunami
    detection'
