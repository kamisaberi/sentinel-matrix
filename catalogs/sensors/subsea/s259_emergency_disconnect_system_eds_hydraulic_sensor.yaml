sensor_id: s259_emergency_disconnect_system_eds_hydraulic_sensor
name: Emergency Disconnect System (EDS) Hydraulic Sensor
domain_id: 37
domain_title: Subsea Well Intervention, Choke & Hydrate Management Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15259
interface: Subsea Fast-Response Pressure Cell
description: 'Emergency Disconnect System (EDS) Hydraulic Sensor is a specialized
  Domain 37 (Subsea Well Intervention, Choke & Hydrate Management Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Subsea Fast-Response Pressure Cell,
  it is specifically engineered to mitigate and detect Riser pull-off without unlatching,
  drilling rig drift-off disaster. In the Aryorithm edge architecture, it continuously
  asserts the operational invariant: Pilot hydraulic pressure drop to 0\,bar verifies
  physical hydraulic disconnect command completed within < 3.0\,seconds.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Riser pull-off without unlatching, drilling rig drift-off disaster
core_invariant: Pilot hydraulic pressure drop to 0\,bar verifies physical hydraulic
  disconnect command completed within < 3.0\,seconds.
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40491:
      name: s259_emergency_disconnect_system_eds_hydraulic_sensor_pv
      type: float32
      scale: 1.0
      unit: m/s
    40493:
      name: s259_emergency_disconnect_system_eds_hydraulic_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s259_emergency_disconnect_system_eds_hydraulic_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Riser pull-off without unlatching, drilling rig drift-off
    disaster'
