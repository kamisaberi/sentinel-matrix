sensor_id: s100_conductivity_temperature_depth_ctd_sensor
name: Conductivity-Temperature-Depth (CTD) Sensor
domain_id: 15
domain_title: Deep Marine, Subsea & Oceanographic Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15100
interface: High-Precision Inductive Cell
description: 'Conductivity-Temperature-Depth (CTD) Sensor is a specialized Domain
  15 (Deep Marine, Subsea & Oceanographic Sensors) cyber-physical monitoring sensor.
  Interfacing directly via High-Precision Inductive Cell, it is specifically engineered
  to mitigate and detect Underwater speed-of-sound profile manipulation, sonar spoofing.
  In the Aryorithm edge architecture, it continuously asserts the operational invariant:
  UNESCO 1983 Equation of State for Seawater; calculates sound velocity c(S, T, P)
  to detect acoustic shadow-zone evasion.. Any divergence between commanded network
  state and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Underwater speed-of-sound profile manipulation, sonar spoofing
core_invariant: UNESCO 1983 Equation of State for Seawater; calculates sound velocity
  c(S, T, P) to detect acoustic shadow-zone evasion.
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40481:
      name: s100_conductivity_temperature_depth_ctd_sensor_pv
      type: float32
      scale: 1.0
      unit: m/s
    40483:
      name: s100_conductivity_temperature_depth_ctd_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s100_conductivity_temperature_depth_ctd_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Underwater speed-of-sound profile manipulation, sonar
    spoofing'
