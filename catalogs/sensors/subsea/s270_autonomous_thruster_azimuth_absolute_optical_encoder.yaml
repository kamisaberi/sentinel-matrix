sensor_id: s270_autonomous_thruster_azimuth_absolute_optical_encoder
name: Autonomous Thruster Azimuth Absolute Optical Encoder
domain_id: 38
domain_title: Autonomous Marine Vessel Propulsion & Ballast Biosecurity Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15270
interface: 24-bit Gray-Code Optical Encoder
description: "Autonomous Thruster Azimuth Absolute Optical Encoder is a specialized\
  \ Domain 38 (Autonomous Marine Vessel Propulsion & Ballast Biosecurity Sensors)\
  \ cyber-physical monitoring sensor. Interfacing directly via 24-bit Gray-Code Optical\
  \ Encoder, it is specifically engineered to mitigate and detect Autopilot thruster\
  \ angle command spoofing, vessel spinning out. In the Aryorithm edge architecture,\
  \ it continuously asserts the operational invariant: Measured azimuth angle \\theta_{actual}\
  \ must match steering servo position within \xB1 0.1^\\circ; divergence locks propulsion\
  \ and sounds alarms.. Any divergence between commanded network state and this physical\
  \ reading triggers sub-microsecond in-kernel eBPF packet mitigation."
target_threat: Autopilot thruster angle command spoofing, vessel spinning out
core_invariant: "Measured azimuth angle \\theta_{actual} must match steering servo\
  \ position within \xB1 0.1^\\circ; divergence locks propulsion and sounds alarms."
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40101:
      name: s270_autonomous_thruster_azimuth_absolute_optical_encoder_pv
      type: float32
      scale: 1.0
      unit: m/s
    40103:
      name: s270_autonomous_thruster_azimuth_absolute_optical_encoder_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s270_autonomous_thruster_azimuth_absolute_optical_encoder_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Autopilot thruster angle command spoofing, vessel
    spinning out'
