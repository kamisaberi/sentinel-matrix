sensor_id: s105_forward_looking_obstacle_avoidance_sonar_fls
name: Forward-Looking Obstacle Avoidance Sonar (FLS)
domain_id: 15
domain_title: Deep Marine, Subsea & Oceanographic Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15105
interface: 2D Multibeam Acoustic Array
description: 'Forward-Looking Obstacle Avoidance Sonar (FLS) is a specialized Domain
  15 (Deep Marine, Subsea & Oceanographic Sensors) cyber-physical monitoring sensor.
  Interfacing directly via 2D Multibeam Acoustic Array, it is specifically engineered
  to mitigate and detect Autonomous UUV collision with unmapped subsea terrain / mines.
  In the Aryorithm edge architecture, it continuously asserts the operational invariant:
  Generates real-time 3D bathymetric mesh; enforces obstacle clearance barrier (d_{obstacle}
  >= v_{UUV} \cdot t_{stop} + d_{margin}).. Any divergence between commanded network
  state and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Autonomous UUV collision with unmapped subsea terrain / mines
core_invariant: Generates real-time 3D bathymetric mesh; enforces obstacle clearance
  barrier (d_{obstacle} >= v_{UUV} \cdot t_{stop} + d_{margin}).
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40031:
      name: s105_forward_looking_obstacle_avoidance_sonar_fls_pv
      type: float32
      scale: 1.0
      unit: m/s
    40033:
      name: s105_forward_looking_obstacle_avoidance_sonar_fls_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s105_forward_looking_obstacle_avoidance_sonar_fls_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Autonomous UUV collision with unmapped subsea terrain
    / mines'
