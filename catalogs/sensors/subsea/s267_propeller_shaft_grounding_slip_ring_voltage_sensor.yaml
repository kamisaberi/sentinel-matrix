sensor_id: s267_propeller_shaft_grounding_slip_ring_voltage_sensor
name: Propeller Shaft Grounding Slip-Ring Voltage Sensor
domain_id: 38
domain_title: Autonomous Marine Vessel Propulsion & Ballast Biosecurity Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15267
interface: Carbon Brush Microvolt Voltage Tap
description: 'Propeller Shaft Grounding Slip-Ring Voltage Sensor is a specialized
  Domain 38 (Autonomous Marine Vessel Propulsion & Ballast Biosecurity Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Carbon Brush Microvolt Voltage Tap,
  it is specifically engineered to mitigate and detect Spark erosion of main engine
  bearings, hull cathodic protection bypass. In the Aryorithm edge architecture, it
  continuously asserts the operational invariant: Shaft-to-hull electrical potential:
  V_{shaft} <= 50\,mV; voltage rise indicates grounding brush lift, pitting engine
  crankshaft bearings.. Any divergence between commanded network state and this physical
  reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Spark erosion of main engine bearings, hull cathodic protection bypass
core_invariant: 'Shaft-to-hull electrical potential: V_{shaft} <= 50\,mV; voltage
  rise indicates grounding brush lift, pitting engine crankshaft bearings.'
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40071:
      name: s267_propeller_shaft_grounding_slip_ring_voltage_sensor_pv
      type: float32
      scale: 1.0
      unit: m/s
    40073:
      name: s267_propeller_shaft_grounding_slip_ring_voltage_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s267_propeller_shaft_grounding_slip_ring_voltage_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Spark erosion of main engine bearings, hull cathodic
    protection bypass'
