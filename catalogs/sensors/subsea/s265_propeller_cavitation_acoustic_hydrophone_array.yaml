sensor_id: s265_propeller_cavitation_acoustic_hydrophone_array
name: Propeller Cavitation Acoustic Hydrophone Array
domain_id: 38
domain_title: Autonomous Marine Vessel Propulsion & Ballast Biosecurity Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15265
interface: Flush-Mounted Hull Acoustic Transducers
description: 'Propeller Cavitation Acoustic Hydrophone Array is a specialized Domain
  38 (Autonomous Marine Vessel Propulsion & Ballast Biosecurity Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Flush-Mounted Hull Acoustic Transducers,
  it is specifically engineered to mitigate and detect Propeller blade cavitation
  erosion, vessel acoustic stealth compromise. In the Aryorithm edge architecture,
  it continuously asserts the operational invariant: High-frequency acoustic noise
  (20--50\,kHz) generated by collapsing cavitation bubbles; adjusts engine RPM/pitch
  to stay below cavitation inception.. Any divergence between commanded network state
  and this physical reading triggers sub-microsecond in-kernel eBPF packet mitigation.'
target_threat: Propeller blade cavitation erosion, vessel acoustic stealth compromise
core_invariant: High-frequency acoustic noise (20--50\,kHz) generated by collapsing
  cavitation bubbles; adjusts engine RPM/pitch to stay below cavitation inception.
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40051:
      name: s265_propeller_cavitation_acoustic_hydrophone_array_pv
      type: float32
      scale: 1.0
      unit: m/s
    40053:
      name: s265_propeller_cavitation_acoustic_hydrophone_array_status
