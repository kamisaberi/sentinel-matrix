sensor_id: s261_subsea_rov_hot_stab_hydraulic_pressure_flow_sensor
name: Subsea ROV Hot-Stab Hydraulic Pressure & Flow Sensor
domain_id: 37
domain_title: Subsea Well Intervention, Choke & Hydrate Management Sensors
category: SUBSEA
target_protocol: MODBUS_TCP
default_port: 15261
interface: Dual-Pressure Transducer in Manifold
description: 'Subsea ROV Hot-Stab Hydraulic Pressure & Flow Sensor is a specialized
  Domain 37 (Subsea Well Intervention, Choke & Hydrate Management Sensors) cyber-physical
  monitoring sensor. Interfacing directly via Dual-Pressure Transducer in Manifold,
  it is specifically engineered to mitigate and detect Rogue ROV manipulation of subsea
  intervention panel valves. In the Aryorithm edge architecture, it continuously asserts
  the operational invariant: Verifies hydraulic supply pressure (3{,}000 psi) and
  fluid cleanliness (NAS 1638 Class 6) before commanding isolation valves.. Any divergence
  between commanded network state and this physical reading triggers sub-microsecond
  in-kernel eBPF packet mitigation.'
target_threat: Rogue ROV manipulation of subsea intervention panel valves
core_invariant: Verifies hydraulic supply pressure (3{,}000 psi) and fluid cleanliness
  (NAS 1638 Class 6) before commanding isolation valves.
physics:
  engine: subsea_acoustic
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: m/s
registers:
  holding_registers:
    40011:
      name: s261_subsea_rov_hot_stab_hydraulic_pressure_flow_sensor_pv
      type: float32
      scale: 1.0
      unit: m/s
    40013:
      name: s261_subsea_rov_hot_stab_hydraulic_pressure_flow_sensor_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s261_subsea_rov_hot_stab_hydraulic_pressure_flow_sensor_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: Rogue ROV manipulation of subsea intervention panel
    valves'
