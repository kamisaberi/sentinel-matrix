sensor_id: s123_transition_edge_sensor_tes_microcalorimeter
name: Transition-Edge Sensor (TES) Microcalorimeter
domain_id: 18
domain_title: Quantum Metrology, Superconducting & Qubit Sensors
category: QUANTUM
target_protocol: MODBUS_TCP
default_port: 15123
interface: SQUID Voltage Pre-Amp
description: "Transition-Edge Sensor (TES) Microcalorimeter is a specialized Domain\
  \ 18 (Quantum Metrology, Superconducting & Qubit Sensors) cyber-physical monitoring\
  \ sensor. Interfacing directly via SQUID Voltage Pre-Amp, it is specifically engineered\
  \ to mitigate and detect QKD laser pulse intensity spoofing, Trojan horse state\
  \ probing. In the Aryorithm edge architecture, it continuously asserts the operational\
  \ invariant: Biased in the superconducting-to-normal transition zone (R \u221D T);\
  \ resolves individual photon numbers with 99.9\\% accuracy.. Any divergence between\
  \ commanded network state and this physical reading triggers sub-microsecond in-kernel\
  \ eBPF packet mitigation."
target_threat: QKD laser pulse intensity spoofing, Trojan horse state probing
core_invariant: "Biased in the superconducting-to-normal transition zone (R \u221D\
  \ T); resolves individual photon numbers with 99.9\\% accuracy."
physics:
  engine: quantum_squid
  baseline_value: 10.0
  min_value: 0.0
  max_value: 100.0
  noise_sigma: 0.1
  unit: mK
registers:
  holding_registers:
    40191:
      name: s123_transition_edge_sensor_tes_microcalorimeter_pv
      type: float32
      scale: 1.0
      unit: mK
    40193:
      name: s123_transition_edge_sensor_tes_microcalorimeter_status
      type: uint16
      scale: 1.0
      unit: bitmask
fault_hooks:
- id: s123_transition_edge_sensor_tes_microcalorimeter_fault
  action: step_increase
  value: 10.0
  description: 'Injects anomaly: QKD laser pulse intensity spoofing, Trojan horse
    state probing'
