networks:
  sentinel-grid-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${SUBNET_PREFIX:-10.240.0}.0/24
          gateway: ${SUBNET_PREFIX:-10.240.0}.1

volumes:
  shared-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/shared/models
  shared-datasets:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/shared/datasets
  shared-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/shared/logs

services:
# ============================================================================
  # TIER 6: SENTINEL NEXUS (Master Command Plane)
  # ============================================================================
  nexus:
    build:
      context: .
      dockerfile: docker/Dockerfile.nexus
    container_name: matrix-nexus
    hostname: nexus.matrix.internal
    restart: unless-stopped
    privileged: true
    networks:
      sentinel-grid-net:
        ipv4_address: ${SUBNET_PREFIX:-10.240.0}.10
    ports:
      - "${NEXUS_GRPC_PORT:-50051}:50051"
      - "${NEXUS_REST_PORT:-9443}:9443"
      - "${NEXUS_STREAM_PORT:-9444}:9444"
    volumes:
      - ./configs:/opt/sentinel-nexus/configs:ro
      - shared-models:/opt/sentinel-nexus/models
      - shared-datasets:/var/lib/sentinel-nexus/forge_datasets
      - shared-logs:/var/log/sentinel-nexus
      - ./shared/lib:/usr/local/lib/matrix-deps:ro
      - ./shared/bin/sentinel-nexus:/usr/local/bin/sentinel-nexus:ro
      - ./web:/opt/sentinel-nexus/web:ro
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib/matrix-deps
      - VMWARE_ENVIRONMENT=true
      - NEXUS_ENV=simulation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9443/api/v1/fleet/nodes"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  # ============================================================================
  # DIGITAL TWIN HARDWARE: MOCK PLC (SCADA Industrial Protocols Listener)
  # ============================================================================
  mock-plc:
    build:
      context: .
      dockerfile: docker/Dockerfile.plc
    container_name: matrix-mock-plc
    hostname: plc.matrix.internal
    restart: unless-stopped
    networks:
      sentinel-grid-net:
        ipv4_address: ${SUBNET_PREFIX:-10.240.0}.150
    ports:
      - "${MODBUS_PORT:-502}:502"
      - "${S7COMM_PORT:-102}:102"
      - "${IEC104_PORT:-2404}:2404"
    volumes:
      - ./configs:/opt/sentinel-matrix/configs:ro
      - ./shared/bin/mock_plc:/usr/local/bin/mock_plc:ro
    command: [ "/usr/local/bin/mock_plc", "-c", "/opt/sentinel-matrix/configs/plc_register_map.json" ]

  # ============================================================================
  # TIER 4: XINFER FORGE (Continuous Learning Daemon)
  # ============================================================================
  forge:
    build:
      context: .
      dockerfile: docker/Dockerfile.forge
    container_name: matrix-forge
    hostname: forge.matrix.internal
    restart: unless-stopped
    depends_on:
      nexus:
        condition: service_healthy
    networks:
      sentinel-grid-net:
        ipv4_address: ${SUBNET_PREFIX:-10.240.0}.20
    volumes:
      - shared-datasets:/var/lib/sentinel-nexus/forge_datasets:ro
      - shared-models:/opt/sentinel-nexus/models:rw
      - shared-logs:/var/log/xinfer-forge
    environment:
      - NEXUS_REST_URL=http://${SUBNET_PREFIX:-10.240.0}.10:9443
      - NEXUS_DATASET_DIR=/var/lib/sentinel-nexus/forge_datasets
      - NEXUS_MODELS_DIR=/opt/sentinel-nexus/models
      - VMWARE_CONTAINER=true

  # ============================================================================
  # TIER 3: EDGE APPLIANCE 01 (Industrial Substation - OpenVINO)
  # ============================================================================
  sentinel-edge-01:
    build:
      context: .
      dockerfile: docker/Dockerfile.sentinel
    container_name: matrix-edge-substation-01
    hostname: substation-01.matrix.internal
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - BPF
    depends_on:
      nexus:
        condition: service_healthy
    networks:
      sentinel-grid-net:
        ipv4_address: ${SUBNET_PREFIX:-10.240.0}.101
    volumes:
      - ./configs/nodes/node_01_substation_alpha.yaml:/etc/sentinel/sentinel.yaml:ro
      - ./configs:/etc/sentinel/configs:ro
      - shared-models:/etc/sentinel/models:rw
      - shared-logs:/var/log/sentinel
      - ./shared/lib:/usr/local/lib/matrix-deps:ro
      - ./shared/bin/sentinel:/usr/local/bin/sentinel:ro

    environment:
      - LD_LIBRARY_PATH=/usr/local/lib/matrix-deps
      - NODE_IDENTIFIER=Edge-Substation-01
      - SITE_IDENTIFIER=Edge-Substation-01
      - NODE_SITE=PowerGrid-North-01
      - PRIMARY_BACKEND=INTEL_OPENVINO
      - VMWARE_VIRTUAL_NIC=true
      - XDP_MODE=SKB
      - NEXUS_HOST=${SUBNET_PREFIX:-10.240.0}.10
      - NEXUS_PORT=50051

  # ============================================================================
  # TIER 3: EDGE APPLIANCE 02 (Hospital PACS - TensorRT Emulation)
  # ============================================================================
  sentinel-edge-02:
    build:
      context: .
      dockerfile: docker/Dockerfile.sentinel
    container_name: matrix-edge-hospital-02
    hostname: hospital-02.matrix.internal
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - BPF
    depends_on:
      nexus:
        condition: service_healthy
    networks:
      sentinel-grid-net:
        ipv4_address: ${SUBNET_PREFIX:-10.240.0}.102
    volumes:
      - ./configs/nodes/node_02_hospital_pacs.yaml:/etc/sentinel/sentinel.yaml:ro
      - ./configs:/etc/sentinel/configs:ro
      - shared-models:/etc/sentinel/models:rw
      - shared-logs:/var/log/sentinel
      - ./shared/lib:/usr/local/lib/matrix-deps:ro
      - ./shared/bin/sentinel:/usr/local/bin/sentinel:ro
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib/matrix-deps
      - NODE_IDENTIFIER=Edge-Hospital-PACS-02
      - SITE_IDENTIFIER=Edge-Hospital-PACS-02
      - NODE_SITE=Metro-General-Hospital
      - PRIMARY_BACKEND=NVIDIA_TENSORRT
      - VMWARE_VIRTUAL_NIC=true
      - XDP_MODE=SKB
      - NEXUS_HOST=${SUBNET_PREFIX:-10.240.0}.10
      - NEXUS_PORT=50051

  # ============================================================================
  # TIER 3: EDGE APPLIANCE 03 (Refinery SCADA - RKNN Emulation)
  # ============================================================================
  sentinel-edge-03:
    build:
      context: .
      dockerfile: docker/Dockerfile.sentinel
    container_name: matrix-edge-refinery-03
    hostname: refinery-03.matrix.internal
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - BPF
    depends_on:
      nexus:
        condition: service_healthy
    networks:
      sentinel-grid-net:
        ipv4_address: ${SUBNET_PREFIX:-10.240.0}.103
    volumes:
      - ./configs/nodes/node_03_refinery_plc.yaml:/etc/sentinel/sentinel.yaml:ro
      - ./configs:/etc/sentinel/configs:ro
      - shared-models:/etc/sentinel/models:rw
      - shared-logs:/var/log/sentinel
      - ./shared/lib:/usr/local/lib/matrix-deps:ro
      - ./shared/bin/sentinel:/usr/local/bin/sentinel:ro
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib/matrix-deps
      - NODE_IDENTIFIER=Edge-Refinery-PLC-03
      - SITE_IDENTIFIER=Edge-Refinery-PLC-03
      - NODE_SITE=Coastal-Refinery-ZoneB
      - PRIMARY_BACKEND=ROCKCHIP_RKNN
      - VMWARE_VIRTUAL_NIC=true
      - XDP_MODE=SKB
      - NEXUS_HOST=${SUBNET_PREFIX:-10.240.0}.10
      - NEXUS_PORT=50051

  # ============================================================================
  # SYNTHETIC WIRE TRAFFIC & ATTACK WAVE GENERATOR
  # ============================================================================
  traffic-gen:
    build:
      context: .
      dockerfile: docker/Dockerfile.traffic
    container_name: matrix-traffic-gen
    hostname: traffic.matrix.internal
    restart: unless-stopped
    depends_on:
      nexus:
        condition: service_healthy
    networks:
      sentinel-grid-net:
        ipv4_address: ${SUBNET_PREFIX:-10.240.0}.50
    volumes:
      - ./configs:/configs:ro
      - ./src:/app/src:ro
      - shared-logs:/var/log/traffic-gen
      - ./shared/datasets:/shared/datasets:ro
    environment:
      - NEXUS_ENDPOINT=${SUBNET_PREFIX:-10.240.0}.10:50051
      - TARGET_NODES=${SUBNET_PREFIX:-10.240.0}.101,${SUBNET_PREFIX:-10.240.0}.102,${SUBNET_PREFIX:-10.240.0}.103
      - VMWARE_SIMULATION_MODE=true

  # ============================================================================
  # TERMINAL REAL-TIME DASHBOARD (TUI)
  # ============================================================================
  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    container_name: matrix-monitor
    restart: unless-stopped
    depends_on:
      nexus:
        condition: service_healthy
    networks:
      sentinel-grid-net:
        ipv4_address: ${SUBNET_PREFIX:-10.240.0}.60
    volumes:
      - ./src/monitor:/app/src/monitor:ro
    environment:
      - NEXUS_REST_URL=http://${SUBNET_PREFIX:-10.240.0}.10:9443
      - NEXUS_STREAM_URL=http://${SUBNET_PREFIX:-10.240.0}.10:9444
      - TERM=xterm-256color
    stdin_open: true
    tty: true

  # ============================================================================
  # LIVE ADVERSARY & ACTIVE WIRE THREAT CONTAINER (10.240.0.99)
  # ============================================================================
  adversary:
    build:
      context: .
      dockerfile: docker/Dockerfile.adversary
    container_name: matrix-adversary
    hostname: adversary.matrix.internal
    restart: unless-stopped
    depends_on:
      nexus:
        condition: service_healthy
    networks:
      sentinel-grid-net:
        ipv4_address: ${SUBNET_PREFIX:-10.240.0}.99
    volumes:
      - ./configs:/configs:ro
      - ./src:/app/src:ro
      - shared-logs:/var/log/adversary
    environment:
      - NEXUS_REST_URL=http://${SUBNET_PREFIX:-10.240.0}.10:9443
      - TARGET_NODES=${SUBNET_PREFIX:-10.240.0}.101,${SUBNET_PREFIX:-10.240.0}.102,${SUBNET_PREFIX:-10.240.0}.103

