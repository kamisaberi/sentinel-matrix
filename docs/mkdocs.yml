site_name: Sentinel-Matrix Documentation
site_description: Autonomous Cyber-Range Digital Twin, OmniFlow Multi-Modal Traffic Engine, and Malware PCAP Replay Mesh (Tier 7)
site_author: Aryorithm Technologies B.V.
site_url: https://docs.aryorithm.com/matrix/
repo_name: kamisaberi/sentinel-matrix
repo_url: https://github.com/kamisaberi/sentinel-matrix

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

