# File: /home/kami/sentinel-matrix/scenarios/reference_minimal/configs/nodes/node_01_reference.yaml

node:
  identifier: "Edge-Reference-01"
  site_identifier: "Framework-Smoke-Site"
  hardware:
    type: "DEVICE_VIRTUAL_TPM"
    primary_backend: "INTEL_OPENVINO"
    xdp_driver_mode: "SKB"

nexus:
  enabled: true
  host: "10.240.99.10"
  port: 50051
  nexus_http_port: 9443
  active_model_name: "network_threat_int8.onnx"
  local_models_dir: "/etc/sentinel/models"

routes:
  - sensor_id: Reference-Stream-01
    sensor_type: GENERIC_TELEMETRY
    driver_mode: AF_XDP_UMEM
    match:
      port: 502
      transport: tcp
      package_id: org.aryorithm.package.core_telemetry
      plugin_id: core_telemetry_plugin.so
      owner_subsystem: 03_ndr
      execution_mode: CASCADE_SHORT_CIRCUIT
      model_id: network_threat_int8.onnx
      silicon_target: INTEL_OPENVINO
      format: ONNX
      precision: INT8
      latency_budget_ns: 20000
      threshold_drop: 0.85
